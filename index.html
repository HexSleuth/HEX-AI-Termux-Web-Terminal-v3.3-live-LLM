<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark light"/>
<title>HEX AI — Termux Web Terminal v3.5 (Multilingual)</title>

<!-- ============ xterm.js core stylesheet (CDN) ============ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"/>

<!-- ============ Web fonts (Latin + CJK + Arabic + Devanagari + more) ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Source+Code+Pro:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Ubuntu+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&family=Inconsolata:wght@400;700&family=Space+Mono:wght@400;700&family=Anonymous+Pro:wght@400;700&family=Victor+Mono:wght@400;700&family=Share+Tech+Mono&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   HEX AI TERMINAL v3.5
   Termux-authentic mobile UI + Unlimited Locale Engine
   Features:
     • 65+ languages, RTL support, auto-detect from navigator
     • lang <code> command + drawer language picker
     • Live AI replies in the selected language (system prompt injection)
     • All UI strings localised
   ============================================================ */

#hexai-widget{
  --hx-accent:#00ffa3;
  --hx-accent2:#00d9ff;
  --hx-text:#d7ffe9;
  --hx-dim:#6f8a9b;
  --hx-line:rgba(0,255,163,.18);
  --hx-panel:#070c13;

  --tm-bg:           #000000;
  --tm-bg-2:         #050505;
  --tm-bg-3:         #0b0b0b;
  --tm-fg:           #ffffff;
  --tm-fg-dim:       #b0b0b0;
  --tm-fg-mute:      #7a7a7a;
  --tm-accent:       #00ffa3;
  --tm-accent-soft:  rgba(0,255,163,.16);
  --tm-accent-line:  rgba(0,255,163,.30);
  --tm-border:       rgba(255,255,255,.08);
  --tm-border-strong:rgba(255,255,255,.16);
  --tm-key-bg:       linear-gradient(180deg,#1a1a1a,#101010);
  --tm-key-bg-hi:    linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-key-fg:       #e0e0e0;
  --tm-key-fg-hi:    #04120c;
  --tm-key-border:   rgba(255,255,255,.10);
  --tm-key-shadow:   0 1px 0 rgba(255,255,255,.05) inset, 0 2px 6px rgba(0,0,0,.7);
  --tm-toast-bg:     rgba(20,20,20,.96);
  --tm-toast-fg:     #f0f0f0;
  --tm-toast-border: rgba(0,255,163,.42);
  --tm-status-bg:    linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-status-fg:    #04120c;
  --tm-status-ai-bg: linear-gradient(180deg,#00d9ff,#0096d6);
  --tm-status-ai-fg: #02121a;
  --tm-scanline:     rgba(255,255,255,.022);
  --tm-shadow-glow:  0 18px 55px -14px rgba(0,255,163,.30);
  --tm-shadow-glow2: 0 0 110px -35px rgba(0,217,255,.40);
  --tm-outer-border: rgba(0,255,163,.22);

  position:relative;
  width:100%;
  max-width:1000px;
  margin:0 auto;
  border-radius:16px;
  overflow:hidden;
  isolation:isolate;
  background:var(--tm-bg);
  color:var(--tm-fg);
  border:1px solid var(--tm-outer-border);
  box-shadow:
     0 0 0 1px rgba(0,0,0,.65),
     var(--tm-shadow-glow),
     var(--tm-shadow-glow2);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
  transition:background .28s ease, color .28s ease, border-color .28s ease;
}
#hexai-widget *,
#hexai-widget *::before,
#hexai-widget *::after{ box-sizing:border-box; }

/* ---------- auto theme ---------- */
@media (prefers-color-scheme: light){
  #hexai-widget[data-theme="auto"]{
    --tm-bg:           #f6f6f4;
    --tm-bg-2:         #eeeeec;
    --tm-bg-3:         #e4e4e2;
    --tm-fg:           #121212;
    --tm-fg-dim:       #3d3d3d;
    --tm-fg-mute:      #6f6f6f;
    --tm-accent:       #0f8f5f;
    --tm-accent-soft:  rgba(15,143,95,.14);
    --tm-accent-line:  rgba(15,143,95,.35);
    --tm-border:       rgba(0,0,0,.10);
    --tm-border-strong:rgba(0,0,0,.20);
    --tm-key-bg:       linear-gradient(180deg,#ffffff,#e9e9e9);
    --tm-key-bg-hi:    linear-gradient(180deg,#0f8f5f,#0b7a50);
    --tm-key-fg:       #1a1a1a;
    --tm-key-fg-hi:    #ffffff;
    --tm-key-border:   rgba(0,0,0,.10);
    --tm-key-shadow:   0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(0,0,0,.10);
    --tm-toast-bg:     rgba(255,255,255,.98);
    --tm-toast-fg:     #121212;
    --tm-toast-border: rgba(15,143,95,.45);
    --tm-status-bg:    linear-gradient(180deg,#0f8f5f,#0b7a50);
    --tm-status-fg:    #ffffff;
    --tm-status-ai-bg: linear-gradient(180deg,#0077cc,#005fa3);
    --tm-status-ai-fg: #ffffff;
    --tm-scanline:     rgba(0,0,0,.012);
    --tm-shadow-glow:  0 14px 40px -14px rgba(15,143,95,.30);
    --tm-shadow-glow2: 0 0 70px -35px rgba(0,119,204,.25);
    --tm-outer-border: rgba(15,143,95,.30);
  }
}
#hexai-widget[data-theme="dark"]{
  --tm-bg:#000000; --tm-bg-2:#050505; --tm-bg-3:#0b0b0b;
  --tm-fg:#ffffff; --tm-fg-dim:#b0b0b0; --tm-fg-mute:#7a7a7a;
  --tm-accent:#00ffa3; --tm-accent-soft:rgba(0,255,163,.16); --tm-accent-line:rgba(0,255,163,.30);
  --tm-border:rgba(255,255,255,.08); --tm-border-strong:rgba(255,255,255,.16);
  --tm-key-bg:linear-gradient(180deg,#1a1a1a,#101010);
  --tm-key-bg-hi:linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-key-fg:#e0e0e0; --tm-key-fg-hi:#04120c; --tm-key-border:rgba(255,255,255,.10);
  --tm-key-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 6px rgba(0,0,0,.7);
  --tm-toast-bg:rgba(20,20,20,.96); --tm-toast-fg:#f0f0f0; --tm-toast-border:rgba(0,255,163,.42);
  --tm-status-bg:linear-gradient(180deg,#00ffa3,#00c47a); --tm-status-fg:#04120c;
  --tm-status-ai-bg:linear-gradient(180deg,#00d9ff,#0096d6); --tm-status-ai-fg:#02121a;
  --tm-scanline:rgba(255,255,255,.022);
  --tm-shadow-glow:0 18px 55px -14px rgba(0,255,163,.30);
  --tm-shadow-glow2:0 0 110px -35px rgba(0,217,255,.40);
  --tm-outer-border:rgba(0,255,163,.22);
}
#hexai-widget[data-theme="light"]{
  --tm-bg:#f6f6f4; --tm-bg-2:#eeeeec; --tm-bg-3:#e4e4e2;
  --tm-fg:#121212; --tm-fg-dim:#3d3d3d; --tm-fg-mute:#6f6f6f;
  --tm-accent:#0f8f5f; --tm-accent-soft:rgba(15,143,95,.14); --tm-accent-line:rgba(15,143,95,.35);
  --tm-border:rgba(0,0,0,.10); --tm-border-strong:rgba(0,0,0,.20);
  --tm-key-bg:linear-gradient(180deg,#ffffff,#e9e9e9);
  --tm-key-bg-hi:linear-gradient(180deg,#0f8f5f,#0b7a50);
  --tm-key-fg:#1a1a1a; --tm-key-fg-hi:#ffffff; --tm-key-border:rgba(0,0,0,.10);
  --tm-key-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(0,0,0,.10);
  --tm-toast-bg:rgba(255,255,255,.98); --tm-toast-fg:#121212; --tm-toast-border:rgba(15,143,95,.45);
  --tm-status-bg:linear-gradient(180deg,#0f8f5f,#0b7a50); --tm-status-fg:#ffffff;
  --tm-status-ai-bg:linear-gradient(180deg,#0077cc,#005fa3); --tm-status-ai-fg:#ffffff;
  --tm-scanline:rgba(0,0,0,.012);
  --tm-shadow-glow:0 14px 40px -14px rgba(15,143,95,.30);
  --tm-shadow-glow2:0 0 70px -35px rgba(0,119,204,.25);
  --tm-outer-border:rgba(15,143,95,.30);
}

#hexai-widget::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
  background:repeating-linear-gradient(
     to bottom,
     var(--tm-scanline) 0px,
     var(--tm-scanline) 1px,
     rgba(0,0,0,0) 2px,
     rgba(0,0,0,0) 4px
  );
  mix-blend-mode:overlay;
  opacity:.65;
  transition:background .28s ease;
}
#hexai-widget[data-theme="light"]::after{ opacity:.25; }

/* ============================================================
   RTL SUPPORT
   ============================================================ */
#hexai-widget[dir="rtl"]{ direction: rtl; }
#hexai-widget[dir="rtl"] .tm-statusbar{ padding:0 6px 0 8px; }
#hexai-widget[dir="rtl"] .tm-drawer{
  left:auto; right:0;
  transform:translateX(102%);
  border-right:0;
  border-left:1px solid var(--tm-border-strong);
  box-shadow:-12px 0 42px rgba(0,0,0,.55);
}
#hexai-widget[dir="rtl"] .tm-drawer-item{
  border-left:0;
  border-right:3px solid transparent;
}
#hexai-widget[dir="rtl"] .tm-drawer-item:hover,
#hexai-widget[dir="rtl"] .tm-drawer-item:active{
  border-right-color:var(--tm-accent);
}
#hexai-widget[dir="rtl"] .tm-menu-popup{
  left:auto; right:8px;
  transform-origin:top right;
}
#hexai-widget[dir="rtl"] .tm-menu-popup .row .kbd{ margin-left:0; margin-right:auto; }
#hexai-widget[dir="rtl"] .tm-session-name,
#hexai-widget[dir="rtl"] .tm-session-sub{ text-align:right; }

/* ============================================================
   Termux status bar
   ============================================================ */
#hexai-widget .tm-statusbar{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  gap:10px;
  height:44px;
  padding:0 8px 0 6px;
  background:var(--tm-bg-2);
  border-bottom:1px solid var(--tm-border);
  transition:background .28s ease, border-color .28s ease;
}
#hexai-widget .tm-menu-btn{
  flex:0 0 auto;
  width:40px; height:40px;
  border:0; border-radius:50%;
  background:transparent;
  color:var(--tm-fg);
  display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:background .18s ease, transform .12s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-menu-btn:active{ transform:scale(.92); background:var(--tm-accent-soft); }
#hexai-widget .tm-menu-btn svg{ width:20px; height:20px; display:block; }

#hexai-widget .tm-session{
  flex:1 1 auto; min-width:0;
  display:flex; flex-direction:column; justify-content:center;
  line-height:1.15;
}
#hexai-widget .tm-session-name{
  font:600 13px/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--tm-fg);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#hexai-widget .tm-session-sub{
  font:500 10.5px/1.15 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.05em;
  color:var(--tm-fg-mute);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-top:2px;
}
#hexai-widget .tm-session-sub b{ color:var(--tm-accent); font-weight:700; }

#hexai-widget .tm-status-right{
  flex:0 0 auto;
  display:inline-flex; align-items:center; gap:6px;
}
#hexai-widget .tm-badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 9px;
  border-radius:999px;
  font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.09em;
  text-transform:uppercase;
  background:var(--tm-status-bg);
  color:var(--tm-status-fg);
  box-shadow:0 0 12px var(--tm-accent-soft);
  transition:background .25s ease, color .25s ease;
}
#hexai-widget .tm-badge.ai{
  background:var(--tm-status-ai-bg);
  color:var(--tm-status-ai-fg);
  box-shadow:0 0 16px rgba(0,217,255,.55);
}
#hexai-widget .tm-badge .tm-led{
  width:6px; height:6px; border-radius:50%;
  background:currentColor;
  animation:tm-pulse 1.15s ease-in-out infinite;
}
@keyframes tm-pulse{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:.30; transform:scale(.7); }
}
#hexai-widget .tm-theme-btn{
  flex:0 0 auto;
  width:36px; height:36px;
  border:1px solid var(--tm-border);
  border-radius:50%;
  background:transparent;
  color:var(--tm-fg);
  cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .18s ease, transform .12s ease, border-color .18s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-theme-btn:active{ transform:scale(.92); background:var(--tm-accent-soft); }
#hexai-widget .tm-theme-btn svg{ width:16px; height:16px; display:block; }

/* ============================================================
   Session drawer
   ============================================================ */
#hexai-widget .tm-drawer-scrim{
  position:absolute; inset:0; z-index:30;
  background:rgba(0,0,0,.55);
  opacity:0; pointer-events:none;
  transition:opacity .22s ease;
  backdrop-filter:blur(1.5px);
}
#hexai-widget .tm-drawer{
  position:absolute; top:0; left:0; bottom:0; z-index:31;
  width:min(320px, 82%);
  background:var(--tm-bg-2);
  border-right:1px solid var(--tm-border-strong);
  transform:translateX(-102%);
  transition:transform .26s cubic-bezier(.22,.61,.36,1);
  display:flex; flex-direction:column;
  box-shadow:12px 0 42px rgba(0,0,0,.55);
}
#hexai-widget.drawer-open .tm-drawer{ transform:translateX(0); }
#hexai-widget.drawer-open .tm-drawer-scrim{ opacity:1; pointer-events:auto; }

#hexai-widget .tm-drawer-head{
  padding:14px 16px 12px 16px;
  border-bottom:1px solid var(--tm-border);
  background:var(--tm-bg-3);
}
#hexai-widget .tm-drawer-title{
  font:700 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--tm-accent);
}
#hexai-widget .tm-drawer-sub{
  margin-top:6px;
  font:500 11px/1.4 ui-monospace,monospace;
  color:var(--tm-fg-mute);
}
#hexai-widget .tm-drawer-list{
  flex:1 1 auto;
  overflow-y:auto;
  padding:8px 0 14px 0;
}
#hexai-widget .tm-drawer-item{
  display:flex; align-items:center; gap:10px;
  padding:11px 16px;
  border:0;
  background:transparent;
  width:100%;
  text-align:left;
  color:var(--tm-fg);
  font:500 13.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-drawer-item:hover,
#hexai-widget .tm-drawer-item:active{
  background:var(--tm-accent-soft);
  border-left-color:var(--tm-accent);
}
#hexai-widget .tm-drawer-item .ic{
  flex:0 0 20px; width:20px; height:20px;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--tm-accent);
}
#hexai-widget .tm-drawer-item .ic svg{ width:16px; height:16px; display:block; }
#hexai-widget .tm-drawer-item .lbl{ flex:1 1 auto; min-width:0; }
#hexai-widget .tm-drawer-item .kbd{
  flex:0 0 auto;
  font:600 10px/1 ui-monospace,monospace;
  letter-spacing:.06em;
  color:var(--tm-fg-mute);
  padding:3px 6px;
  border-radius:5px;
  background:rgba(127,127,127,.14);
}
#hexai-widget .tm-drawer-sep{ height:1px; background:var(--tm-border); margin:6px 12px; }
#hexai-widget .tm-drawer-section{
  padding:10px 16px 4px 16px;
  font:700 10px/1 ui-monospace,monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tm-fg-mute);
}

/* ---------- language sub-panel ---------- */
#hexai-widget .tm-lang-list{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
  background:rgba(127,127,127,.05);
  border-top:1px solid transparent;
  border-bottom:1px solid transparent;
}
#hexai-widget .tm-lang-list.open{
  max-height:340px;
  overflow-y:auto;
  border-top-color:var(--tm-border);
  border-bottom-color:var(--tm-border);
}
#hexai-widget .tm-lang-search{
  display:flex;
  padding:8px 12px;
  gap:6px;
  border-bottom:1px solid var(--tm-border);
  background:var(--tm-bg-3);
  position:sticky; top:0; z-index:1;
}
#hexai-widget .tm-lang-search input{
  flex:1 1 auto;
  padding:7px 10px;
  border-radius:7px;
  border:1px solid var(--tm-border);
  background:var(--tm-bg);
  color:var(--tm-fg);
  font:500 12px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  outline:none;
}
#hexai-widget .tm-lang-search input:focus{ border-color:var(--tm-accent); }
#hexai-widget .tm-lang-btn{
  display:flex; align-items:center; gap:10px;
  padding:9px 16px;
  border:0;
  background:transparent;
  width:100%;
  text-align:left;
  color:var(--tm-fg);
  font:500 13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  cursor:pointer;
  transition:background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-lang-btn:hover,
#hexai-widget .tm-lang-btn:active{ background:var(--tm-accent-soft); }
#hexai-widget .tm-lang-btn .flag{
  flex:0 0 22px; font-size:16px; line-height:1; text-align:center;
}
#hexai-widget .tm-lang-btn .native{
  flex:1 1 auto; min-width:0;
  display:flex; flex-direction:column;
}
#hexai-widget .tm-lang-btn .native .n1{
  font-weight:700; color:var(--tm-fg);
}
#hexai-widget .tm-lang-btn .native .n2{
  font-size:10.5px; color:var(--tm-fg-mute);
  font-family:ui-monospace,monospace; letter-spacing:.04em;
}
#hexai-widget .tm-lang-btn .mark{
  flex:0 0 auto;
  color:var(--tm-accent);
  font-weight:700;
  opacity:0;
}
#hexai-widget .tm-lang-btn.active .mark{ opacity:1; }
#hexai-widget .tm-lang-btn.active{ background:var(--tm-accent-soft); }

/* ============================================================
   Menu popup
   ============================================================ */
#hexai-widget .tm-menu-popup{
  position:absolute;
  top:48px; left:8px;
  z-index:32;
  min-width:240px;
  max-width:min(320px, 88%);
  padding:6px 0;
  border-radius:12px;
  background:var(--tm-bg-2);
  border:1px solid var(--tm-border-strong);
  box-shadow:0 18px 44px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4);
  opacity:0;
  transform:translateY(-8px) scale(.97);
  transform-origin:top left;
  pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}
#hexai-widget.menu-open .tm-menu-popup{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
#hexai-widget .tm-menu-popup .row{
  display:flex; align-items:center; gap:11px;
  width:100%;
  padding:10px 15px;
  border:0;
  background:transparent;
  color:var(--tm-fg);
  font:500 13.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  text-align:left;
  cursor:pointer;
  transition:background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-menu-popup .row:hover,
#hexai-widget .tm-menu-popup .row:active{ background:var(--tm-accent-soft); }
#hexai-widget .tm-menu-popup .row .ic{
  flex:0 0 18px; width:18px; height:18px;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--tm-accent);
}
#hexai-widget .tm-menu-popup .row .ic svg{ width:15px; height:15px; display:block; }
#hexai-widget .tm-menu-popup .row .kbd{
  margin-left:auto;
  font:600 10px/1 ui-monospace,monospace;
  color:var(--tm-fg-mute);
}
#hexai-widget .tm-menu-popup .sep{ height:1px; background:var(--tm-border); margin:5px 8px; }
#hexai-widget .tm-menu-popup .lbl-title{
  padding:8px 15px 4px 15px;
  font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tm-fg-mute);
}

/* ============================================================
   Terminal screen
   ============================================================ */
#hexai-widget .hx-screen{
  position:relative;
  z-index:4;
  height:460px;
  min-height:260px;
  padding:10px 6px 10px 12px;
  background:var(--tm-bg);
  overflow:hidden;
  touch-action:pan-y;
  transition:background .28s ease, padding .3s ease, margin .3s ease, border-radius .3s ease;
}
#hexai-widget .hx-screen::before{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%, var(--tm-accent-soft), transparent 72%);
  opacity:.55;
  z-index:0;
  transition:background .28s ease;
}
#hexai-widget.hx-float .hx-screen{
  margin:14px 14px 6px 14px;
  border-radius:14px;
  border:1px solid var(--tm-accent-line);
  box-shadow:0 0 42px var(--tm-accent-soft), inset 0 0 44px var(--tm-accent-soft);
}
#hexai-term{
  position:relative; z-index:1;
  width:100%; height:100%;
}
#hexai-term .xterm{ height:100%; padding:0; }
#hexai-term .xterm-viewport{
  background:transparent !important;
  scrollbar-width:thin;
  scrollbar-color:var(--tm-accent-line) transparent;
}
#hexai-term .xterm-viewport::-webkit-scrollbar{ width:7px; }
#hexai-term .xterm-viewport::-webkit-scrollbar-track{ background:transparent; }
#hexai-term .xterm-viewport::-webkit-scrollbar-thumb{
  background:var(--tm-accent-line);
  border-radius:8px;
}
#hexai-term .xterm-screen{ z-index:2; }

/* ============================================================
   Extra-keys row
   ============================================================ */
#hexai-widget .hx-keys{
  position:relative; z-index:6;
  display:flex; flex-wrap:wrap; gap:6px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)) 8px;
  background:var(--tm-bg-2);
  border-top:1px solid var(--tm-border);
  transition:background .28s ease, border-color .28s ease;
}
#hexai-widget .hx-key{
  flex:0 0 auto;
  min-width:40px;
  height:36px;
  padding:0 11px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px;
  border:1px solid var(--tm-key-border);
  background:var(--tm-key-bg);
  color:var(--tm-key-fg);
  font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  cursor:pointer;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .10s ease, background .16s ease, color .16s ease, box-shadow .16s ease, border-color .16s ease;
  box-shadow:var(--tm-key-shadow);
}
#hexai-widget .hx-key:active,
#hexai-widget .hx-key.is-active{
  transform:translateY(1px);
  background:var(--tm-key-bg-hi);
  color:var(--tm-key-fg-hi);
  border-color:var(--tm-accent);
  box-shadow:0 0 18px var(--tm-accent-soft);
}
#hexai-widget .hx-key.on{
  background:var(--tm-status-ai-bg);
  color:var(--tm-status-ai-fg);
  border-color:#00d9ff;
  box-shadow:0 0 16px rgba(0,217,255,.65);
}
#hexai-widget .hx-key.wide{ min-width:56px; }
#hexai-widget .hx-key.accent{ color:var(--tm-accent); border-color:var(--tm-accent-line); }

/* ============================================================
   Footer
   ============================================================ */
#hexai-widget .hx-foot{
  position:relative; z-index:6;
  padding:7px 12px;
  font:500 10.5px/1.4 ui-monospace,monospace;
  letter-spacing:.04em;
  color:var(--tm-fg-mute);
  background:var(--tm-bg-3);
  border-top:1px solid var(--tm-border);
  text-align:center;
  transition:background .28s ease, border-color .28s ease;
}
#hexai-widget .hx-foot span{ color:var(--tm-accent); }

/* ============================================================
   Loading veil
   ============================================================ */
#hexai-widget .hx-loading{
  position:absolute; inset:0; z-index:40;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px;
  background:var(--tm-bg);
  transition:opacity .5s ease, background .28s ease;
}
#hexai-widget .hx-loading.hide{ opacity:0; pointer-events:none; }
#hexai-widget .hx-spin{
  width:52px; height:52px;
  border-radius:50%;
  border:3px solid var(--tm-accent-soft);
  border-top-color:var(--tm-accent);
  border-right-color:#00d9ff;
  animation:hx-rot .85s linear infinite;
  box-shadow:0 0 26px var(--tm-accent-soft);
}
@keyframes hx-rot{ to{ transform:rotate(360deg); } }
#hexai-widget .hx-loadtxt{
  font:700 12px/1 ui-monospace,monospace;
  letter-spacing:.22em;
  color:var(--tm-accent);
  text-transform:uppercase;
  animation:hx-blink 1.2s ease-in-out infinite;
}
@keyframes hx-blink{ 0%,100%{opacity:1} 50%{opacity:.35} }

/* ============================================================
   Toasts
   ============================================================ */
#hexai-widget .hx-toasts{
  position:absolute;
  left:50%; bottom:96px;
  transform:translateX(-50%);
  z-index:60;
  display:flex; flex-direction:column; gap:6px; align-items:center;
  pointer-events:none;
  width:max-content; max-width:82%;
}
#hexai-widget .hx-toast{
  padding:9px 14px;
  border-radius:22px;
  background:var(--tm-toast-bg);
  color:var(--tm-toast-fg);
  font:500 12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  border:1px solid var(--tm-toast-border);
  box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 20px var(--tm-accent-soft);
  backdrop-filter:blur(6px);
  opacity:0;
  transform:translateY(14px);
  animation:hx-toast-in .28s ease forwards;
  pointer-events:none;
  text-align:center;
}
#hexai-widget .hx-toast.out{ animation:hx-toast-out .28s ease forwards; }
#hexai-widget .hx-toast.ok   { border-color:var(--tm-accent-line); }
#hexai-widget .hx-toast.err  { border-color:rgba(255,92,92,.55); color:#ffd9d9; }
#hexai-widget .hx-toast.warn { border-color:rgba(255,214,92,.55); color:#fff4d1; }
@keyframes hx-toast-in{ to{ opacity:1; transform:translateY(0); } }
@keyframes hx-toast-out{ to{ opacity:0; transform:translateY(-6px); } }

/* ============================================================
   Mobile tuning
   ============================================================ */
@media (max-width:640px){
  #hexai-widget{ border-radius:13px; }
  #hexai-widget .hx-screen{ height:60vh; min-height:300px; padding:8px 4px 8px 9px; }
  #hexai-widget .hx-key{ height:34px; min-width:36px; padding:0 9px; font-size:11.5px; }
  #hexai-widget .tm-session-name{ font-size:12.5px; }
  #hexai-widget .tm-session-sub{ font-size:10px; }
  #hexai-widget .tm-badge{ font-size:9px; padding:3px 7px; }
  #hexai-widget .hx-toasts{ bottom:82px; max-width:90%; }
  #hexai-widget .tm-menu-popup{ min-width:220px; }
}
@media (max-width:380px){
  #hexai-widget .hx-keys{ gap:5px; padding:7px; }
  #hexai-widget .hx-key{ height:32px; min-width:32px; padding:0 7px; font-size:11px; }
  #hexai-widget .hx-toast{ font-size:11.5px; padding:8px 12px; }
  #hexai-widget .tm-statusbar{ height:42px; }
}
</style>

     LOCALE DATABASE — 65+ languages
     Each entry: { code, name, native, dir, flag, strings, aiPrompt }
     Missing strings fall back to English.

  /* ------------------------------------------------------------
     LOCALE ENGINE
     ------------------------------------------------------------ */
  const Locale = (function () {
    const STORAGE_KEY = 'hexai.locale';
    let current = 'en';
    const listeners = [];

    function exists(code) {
      return !!(code && LOCALES[code.toLowerCase()]);
    }
    function normalise(code) {
      if (!code) return null;
      code = String(code).toLowerCase();
      /* strip region: en-US → en, zh-CN → zh */
      const base = code.split('-')[0];
      if (LOCALES[code]) return code;
      if (LOCALES[base]) return base;
      return null;
    }
    function detect() {
      /* 1. user-saved */
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const n = normalise(saved);
        if (n) return n;
      } catch (e) {}
      /* 2. navigator.languages */
      try {
        const langs = (navigator.languages && navigator.languages.length)
          ? navigator.languages
          : [navigator.language || 'en'];
        for (const l of langs) {
          const n = normalise(l);
          if (n) return n;
        }
      } catch (e) {}
      /* 3. fallback */
      return 'en';
    }
    function get() { return current; }
    function info(code) { return LOCALES[code] || LOCALES.en; }
    function dir() { return info(current).dir || 'ltr'; }
    function t(key) {
      const loc = info(current);
      if (loc.strings && loc.strings[key] != null) return loc.strings[key];
      if (LOCALES.en.strings[key] != null) return LOCALES.en.strings[key];
      return key;
    }
    function aiPrompt() { return info(current).aiPrompt || LOCALES.en.aiPrompt; }
    function set(code) {
      const n = normalise(code);
      if (!n) return false;
      current = n;
      try { localStorage.setItem(STORAGE_KEY, n); } catch (e) {}
      apply();
      listeners.forEach((fn) => { try { fn(n); } catch (e) {} });
      return true;
    }
    function reset() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      current = detect();
      apply();
      listeners.forEach((fn) => { try { fn(current); } catch (e) {} });
    }
    function list() {
      return Object.keys(LOCALES).map((k) => LOCALES[k]);
    }
    function apply() {
      const inf = info(current);
      document.documentElement.setAttribute('lang', current);
      ROOT.setAttribute('lang', current);
      ROOT.setAttribute('dir', inf.dir || 'ltr');
      /* update every [data-i18n] element */
      ROOT.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        const txt = t(key);
        if (txt) el.textContent = txt;
      });
      /* update status pill labels if busy/online depends on locale */
      if (statusEl) {
        const cur = statusEl.textContent.toLowerCase();
        if (cur === 'online' || cur === 'online' || cur === t('status_online').toLowerCase()) {
          statusEl.textContent = t('status_online');
        }
      }
      /* update the small labels in the status bar */
      const lbl = document.getElementById('tm-lang-label');
      if (lbl) lbl.textContent = current;
      const langLabelInDrawer = document.getElementById('tm-lang-current-label');
      if (langLabelInDrawer) langLabelInDrawer.textContent = inf.native || inf.name;
      const langCodeInDrawer = document.getElementById('tm-lang-current-code');
      if (langCodeInDrawer) langCodeInDrawer.textContent = current;
      const miLang = document.getElementById('mi-lang');
      if (miLang) miLang.textContent = current;
    }
    function onChange(fn) { listeners.push(fn); }
    function init() {
      current = detect();
      apply();
    }

    return { init, set, reset, get, t, dir, info, list, apply, onChange, exists, normalise };
  })();

  /* ------------------------------------------------------------
     3. THEME ENGINE
     ------------------------------------------------------------ */
  const ThemeEngine = (function () {
    const STORAGE_KEY = 'hexai.theme';
    let current = 'auto';
    const listeners = [];
    const mql = (window.matchMedia
      ? window.matchMedia('(prefers-color-scheme: dark)')
      : null);
    function systemIsDark() { return mql ? mql.matches : true; }
    function effective() {
      if (current === 'dark')  return 'dark';
      if (current === 'light') return 'light';
      return systemIsDark() ? 'dark' : 'light';
    }
    function apply() {
      ROOT.setAttribute('data-theme', current);
      const eff = effective();
      if (themeLbl) themeLbl.textContent = current + (current === 'auto' ? ' (' + eff + ')' : '');
      if (miAuto)  miAuto.textContent  = current === 'auto'  ? '✓' : ' ';
      if (miDark)  miDark.textContent  = current === 'dark'  ? '✓' : ' ';
      if (miLight) miLight.textContent = current === 'light' ? '✓' : ' ';
      updateIcon(eff);
      listeners.forEach((fn) => { try { fn(eff, current); } catch (e) {} });
    }
    function updateIcon(eff) {
      if (!themeIcon) return;
      if (current === 'auto') {
        themeIcon.innerHTML =
          '<circle cx="12" cy="12" r="9"/>' +
          '<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>';
      } else if (eff === 'dark') {
        themeIcon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
      } else {
        themeIcon.innerHTML =
          '<circle cx="12" cy="12" r="4"/>' +
          '<path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
      }
    }
    function set(mode) {
      if (mode !== 'auto' && mode !== 'dark' && mode !== 'light') return;
      current = mode;
      try { localStorage.setItem(STORAGE_KEY, mode); } catch (e) {}
      apply();
    }
    function cycle() {
      const order = ['auto', 'dark', 'light'];
      const i = order.indexOf(current);
      set(order[(i + 1) % order.length]);
      return current;
    }
    function init() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (saved === 'auto' || saved === 'dark' || saved === 'light') current = saved;
      if (mql && mql.addEventListener) mql.addEventListener('change', apply);
      else if (mql && mql.addListener) mql.addListener(apply);
      apply();
    }
    return {
      init, set, cycle,
      get: () => current,
      effective,
      onChange: (fn) => listeners.push(fn)
    };
  })();

  async function proxyFetch(url) {
    const total = PROXIES.length;
    for (let i = 0; i < total; i++) {
      if (state.interrupt) return { ok: false, aborted: true };
      const target = PROXIES[i](url);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      term.write('\x1b[2K\r' + C.gry + '⇢ ' + PROXY_LABELS[i] + ' (' + (i + 1) + '/' + total + ')' + C.r);
      try {
        const res = await fetch(target, { method:'GET', signal:controller.signal, headers:{ 'Accept':'*/*' } });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        term.write('\x1b[2K\r');
        return { ok: true, text, via: PROXY_LABELS[i] };
      } catch (err) { clearTimeout(timer); }
    }
    term.write('\x1b[2K\r');
    return { ok: false };
  }

  /* ------------------------------------------------------------
     15. LIVE LLM STREAMING
     ------------------------------------------------------------ */
  async function streamHexAIReply(onToken, onStart) {
    if (!state.aiLive) return { ok:false, error:'offline mode' };

    const body = {
      model: HEX_AI_MODEL,
      messages: conversation.slice(),
      stream: true, temperature: 0.7, private: true, referrer: 'hexai-termux-web'
    };

    const attempts = [
      { label: 'direct', url: HEX_AI_ENDPOINT },
      ...PROXIES.map((fn, i) => ({ label: PROXY_LABELS[i], url: fn(HEX_AI_ENDPOINT) }))
    ];

    for (const attempt of attempts) {
      if (state.interrupt) return { ok:false, error:'aborted' };
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      try {
        const res = await fetch(attempt.url, {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream, application/json' },
          body: JSON.stringify(body)
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const ctype = (res.headers.get('content-type') || '').toLowerCase();

        if (ctype.indexOf('application/json') !== -1 && !res.body) {
          const data = await res.json();
          let text = '';
          if (data && data.choices && data.choices[0] && data.choices[0].message) {
            text = data.choices[0].message.content || '';
          } else if (data && data.text) text = data.text;
          else if (typeof data === 'string') text = data;
          if (!text) throw new Error('empty reply');
          if (onStart) onStart(attempt.label);
          if (onToken) onToken(text);
          return { ok:true, text, via:attempt.label };
        }

        if (!res.body || typeof res.body.getReader !== 'function') {
          const raw = await res.text();
          const text = extractTextFromRaw(raw);
          if (!text) throw new Error('empty stream');
          if (onStart) onStart(attempt.label);
          if (onToken) onToken(text);
          return { ok:true, text, via:attempt.label };
        }

        if (onStart) onStart(attempt.label);
        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '', full = '';

        while (true) {
          if (state.interrupt) { try { reader.cancel(); } catch (e) {} break; }
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream:true });

          let idx;
          while ((idx = buffer.indexOf('\n')) !== -1) {
            const line = buffer.slice(0, idx).replace(/\r$/, '');
            buffer = buffer.slice(idx + 1);
            if (!line || line.charAt(0) === ':') continue;
            if (line.indexOf('data:') === 0) {
              const payload = line.slice(5).trim();
              if (payload === '[DONE]') continue;
              try {
                const obj = JSON.parse(payload);
                const delta =
                  obj.choices && obj.choices[0] &&
                  (obj.choices[0].delta && obj.choices[0].delta.content
                    ? obj.choices[0].delta.content
                    : (obj.choices[0].message && obj.choices[0].message.content
                        ? obj.choices[0].message.content
                        : (obj.choices[0].text || '')));
                if (delta) { full += delta; if (onToken) onToken(delta); }
              } catch (e) {}
            }
          }
        }

        if (buffer.trim()) {
          try {
            const tail = buffer.trim();
            if (tail.indexOf('data:') === 0) {
              const payload = tail.slice(5).trim();
              if (payload && payload !== '[DONE]') {
                const obj = JSON.parse(payload);
                const delta =
                  obj.choices && obj.choices[0] &&
                  (obj.choices[0].delta && obj.choices[0].delta.content
                    ? obj.choices[0].delta.content
                    : (obj.choices[0].message && obj.choices[0].message.content
                        ? obj.choices[0].message.content : ''));
                if (delta) { full += delta; if (onToken) onToken(delta); }
              }
            }
          } catch (e) {}
        }

        if (full) return { ok:true, text:full, via:attempt.label };
        throw new Error('empty stream');
      } catch (err) {
        clearTimeout(timer);
      }
    }
    return { ok:false, error:'all endpoints unreachable' };
  }

  function extractTextFromRaw(raw) {
    if (!raw) return '';
    try {
      const obj = JSON.parse(raw);
      if (obj && obj.choices && obj.choices[0]) {
        const ch = obj.choices[0];
        if (ch.message && ch.message.content) return ch.message.content;
        if (ch.text) return ch.text;
      }
      if (obj && obj.text) return obj.text;
    } catch (e) {}
    let out = '';
    raw.split('\n').forEach((line) => {
      line = line.replace(/\r$/, '');
      if (line.indexOf('data:') !== 0) return;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') return;
      try {
        const obj = JSON.parse(payload);
        const ch = obj.choices && obj.choices[0];
        if (ch) {
          if (ch.delta && ch.delta.content) out += ch.delta.content;
          else if (ch.message && ch.message.content) out += ch.message.content;
          else if (ch.text) out += ch.text;
        }
      } catch (e) {}
    });
    return out || raw;
  }

  function printPrompt() { if (!state.closed) term.write(promptStr()); }
  function redraw() {
    term.write('\x1b[2K\r' + promptStr() + lineBuf);
    const back = lineBuf.length - cursor;
    if (back > 0) term.write('\x1b[' + back + 'D');
  }
  function insertText(str) {
    if (!str) return;
    lineBuf = lineBuf.slice(0, cursor) + str + lineBuf.slice(cursor);
    cursor += str.length;
    redraw();
  }
  function doBackspace() {
    if (cursor === 0) return;
    lineBuf = lineBuf.slice(0, cursor - 1) + lineBuf.slice(cursor);
    cursor--; redraw();
  }
  function doDelete() {
    if (cursor >= lineBuf.length) return;
    lineBuf = lineBuf.slice(0, cursor) + lineBuf.slice(cursor + 1);
    redraw();
  }
  function moveLeft()  { if (cursor > 0) { cursor--; redraw(); } }
  function moveRight() { if (cursor < lineBuf.length) { cursor++; redraw(); } }
  function historyUp() {
    if (!state.history.length) return;
    if (state.hIndex > 0) state.hIndex--;
    lineBuf = state.history[state.hIndex] || '';
    cursor = lineBuf.length; redraw();
  }
  function historyDown() {
    if (!state.history.length) return;
    if (state.hIndex < state.history.length - 1) {
      state.hIndex++;
      lineBuf = state.history[state.hIndex] || '';
    } else {
      state.hIndex = state.history.length;
      lineBuf = '';
    }
    cursor = lineBuf.length; redraw();
  }

  /* ------------------------------------------------------------
     17. INPUT HANDLING
     ------------------------------------------------------------ */
  function handleInput(data) {
    if (state.menuActive) {
      const h = state.menuActive;
      state.menuActive = null;
      h(data);
      return;
    }
    if (state.busy) {
      if (data === '\x03' || data === '\x1b') state.interrupt = true;
      return;
    }
    if (ctrlArmed) {
      ctrlArmed = false; updateModKeys();
      if (data.length === 1) {
        const code = data.toUpperCase().charCodeAt(0);
        if (code >= 64 && code < 128) { handleInput(String.fromCharCode(code - 64)); return; }
      }
    }
    if (altArmed) {
      altArmed = false; updateModKeys();
      if (data.length === 1) { handleInput('\x1b' + data); return; }
    }
    switch (data) {
      case '\r': case '\n':  submit(); return;
      case '\u007f': case '\b': doBackspace(); return;
      case '\x03': println('^C'); lineBuf=''; cursor=0; printPrompt(); return;
      case '\x0c': term.clear(); redraw(); return;
      case '\t': autoComplete(); return;
      case '\x1b[A': historyUp();   return;
      case '\x1b[B': historyDown(); return;
      case '\x1b[C': moveRight();   return;
      case '\x1b[D': moveLeft();    return;
      case '\x1b[H': case '\x1b[1~': cursor = 0; redraw(); return;
      case '\x1b[F': case '\x1b[4~': cursor = lineBuf.length; redraw(); return;
      case '\x1b[3~': doDelete(); return;
      case '\x1b[5~': term.scrollPages(-1); return;
      case '\x1b[6~': term.scrollPages(1);  return;
      case '\x1b': return;
    }
    if (data.length > 1 && data.charCodeAt(0) !== 27) {
      insertText(data.replace(/[\r\n\t]+/g, ' '));
      return;
    }
    if (data.length === 1) {
      const code = data.charCodeAt(0);
      if (code >= 32 && code !== 127) insertText(data);
    }
  }

  term.onData(handleInput);

  term.attachCustomKeyEventHandler((e) => {
    if (e.type === 'keydown' && e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      if (term.hasSelection()) return false;
    }
    return true;
  });

  function autoComplete() {
    const frag = lineBuf.slice(0, cursor);
    const parts = frag.split(/\s+/);
    if (parts.length <= 1) {
      const names = Object.keys(BUILTIN_COMMANDS).concat(Object.keys(PACKAGES));
      const hits = names.filter((n) => n.indexOf(parts[0]) === 0);
      if (hits.length === 1) {
        lineBuf = hits[0] + ' ' + lineBuf.slice(cursor);
        cursor = hits[0].length + 1; redraw();
      } else if (hits.length > 1) {
        println('');
        println(C.gry + hits.join('   ') + C.r);
        redraw();
      }
      return;
    }
    const hits = Object.keys(PACKAGES).filter((n) => n.indexOf(parts[parts.length - 1]) === 0);
    if (hits.length === 1) {
      parts[parts.length - 1] = hits[0];
      lineBuf = parts.join(' ') + ' ' + lineBuf.slice(cursor);
      cursor = parts.join(' ').length + 1; redraw();
    }
  }

  function waitKey() {
    return new Promise((resolve) => {
      state.menuActive = (data) => {
        if (data === '\r' || data === '\n') return resolve('enter');
        if (data === '\x1b' || data === '\x03') return resolve('esc');
        if (data.length === 1) return resolve(data.toLowerCase());
        return resolve('other');
      };
    });
  }

  /* ------------------------------------------------------------
     18. COMMAND SUBMITTER
     ------------------------------------------------------------ */
  async function submit() {
    const raw = lineBuf;
    term.write('\r\n');
    lineBuf = ''; cursor = 0;
    if (raw.trim()) state.history.push(raw);
    state.hIndex = state.history.length;

    state.busy = true;
    state.interrupt = false;
    setStatus('busy');
    try { await runCommand(raw.trim()); }
    catch (err) { println(C.red + 'hexai: ' + (err && err.message ? err.message : String(err)) + C.r); }
    state.busy = false;
    state.interrupt = false;
    setStatus('online');
    if (!state.closed) printPrompt();
  }

  function setStatus(txt) {
    if (statusEl) statusEl.textContent = (txt === 'online' ? Locale.t('status_online') :
                                         txt === 'busy'   ? Locale.t('status_busy') :
                                         txt === 'ai'     ? Locale.t('status_ai') : txt);
    if (statusPill) statusPill.classList.toggle('ai', txt === 'ai');
  }

  function tokenize(str) {
    const out = []; let cur = ''; let quote = null;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (quote) { if (ch === quote) quote = null; else cur += ch; }
      else if (ch === '"' || ch === "'") quote = ch;
      else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ''; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }

  /* ============================================================
     19. LANG COMMAND
     ============================================================ */
  async function cmdLang(args) {
    const sub = (args[0] || '').toLowerCase();

    if (!sub || sub === 'list' || sub === 'ls') {
      const list = Locale.list().sort((a, b) => a.code.localeCompare(b.code));
      println('');
      println(C.grn + C.b + '  ' + Locale.t('lang_list_header') + ' (' + list.length + ')' + C.r);
      println(C.gry + '  ─────────────────────────────────────────' + C.r);
      list.forEach((l) => {
        const active = l.code === Locale.get();
        const mark = active ? C.grn + '▸' + C.r : C.gry + ' ' + C.r;
        const flag = l.flag || '  ';
        const code = l.code.padEnd(6, ' ');
        const native = l.native || l.name;
        const dirTag = l.dir === 'rtl' ? C.mag + ' [RTL]' + C.r : '';
        println('  ' + mark + ' ' + flag + '  ' +
                (active ? C.grn + C.b + code + C.r : C.cyn + code + C.r) +
                ' ' + (active ? C.grn + C.b + native + C.r : C.wht + native + C.r) +
                dirTag);
      });
      println('');
      println(C.gry + '  ' + Locale.t('lang_usage') + C.r);
      println('');
      return;
    }

    if (sub === 'current' || sub === 'status') {
      const inf = Locale.info(Locale.get());
      println('');
      println(C.grn + C.b + '  ' + Locale.t('lang_current') + C.r);
      println(C.gry + '  ─────────────────────────────────────────' + C.r);
      println('  ' + C.cyn + 'code   : ' + C.r + C.wht + inf.code + C.r);
      println('  ' + C.cyn + 'name   : ' + C.r + C.wht + inf.name + C.r);
      println('  ' + C.cyn + 'native : ' + C.r + C.wht + inf.native + C.r);
      println('  ' + C.cyn + 'dir    : ' + C.r + C.wht + inf.dir + C.r);
      println('  ' + C.cyn + 'flag   : ' + C.r + C.wht + (inf.flag || '—') + C.r);
      println('  ' + C.cyn + 'total  : ' + C.r + C.wht + Locale.list().length + ' languages available' + C.r);
      println('');
      return;
    }

    if (sub === 'reset') {
      Locale.reset();
      resetConversation();
      println('');
      println(C.grn + '✔ ' + Locale.t('lang_changed') + ' ' +
              C.grn + C.b + Locale.info(Locale.get()).native + C.r +
              C.gry + ' (auto-detected)' + C.r);
      println('');
      return;
    }

    /* try to switch */
    const target = args.join(' ').trim();
    if (!target) {
      println(C.yel + 'usage: ' + Locale.t('lang_usage') + C.r);
      return;
    }

    if (Locale.set(target)) {
      const inf = Locale.info(Locale.get());
      resetConversation();  /* reset AI context so replies follow new language */
      refreshSystemPrompt();
      println('');
      println(C.grn + '✔ ' + Locale.t('lang_changed') + ' ' +
              C.grn + C.b + inf.native + C.r +
              C.gry + '  (' + inf.code + ' · ' + inf.dir + ')' + C.r);
      println('');
      showToast('🌐 ' + inf.native, 'ok');
    } else {
      println('');
      println(C.red + '✖ ' + Locale.t('lang_unknown') + ': ' + target + C.r);
      println(C.gry + '  ' + Locale.t('lang_usage') + C.r);
      println('');
    }
  }

  /* ============================================================
     21. TERMUX:API COMMANDS
     ============================================================ */
  async function cmdTermuxApi(args) {
    const sub = args[0] || 'help';
    const rest = args.slice(1);

    if (!state.installed['termux-api']) {
      println('');
      println(C.red + '  termux-api: command not found' + C.r);
      println(C.gry + '  hint: run ' + C.grn + '"pkg install termux-api"' + C.gry + ' first.' + C.r);
      println('');
      return;
    }

    switch (sub) {
      case 'battery-status': {
        const json = rest.indexOf('--json') !== -1;
        try {
          let level = null, charging = null;
          if (navigator.getBattery) {
            const b = await navigator.getBattery();
            level = Math.round(b.level * 100);
            charging = b.charging;
          }
          if (level === null) { println(C.yel + 'battery API unavailable' + C.r); return; }
          if (json) {
            println('{"health":"good","percentage":' + level +
                    ',"plugged":"' + (charging ? 'AC' : 'UNPLUGGED') +
                    '","status":"' + (charging ? 'CHARGING' : 'DISCHARGING') + '"}');
          } else {
            println('');
            println(C.grn + C.b + '  BATTERY STATUS' + C.r);
            println('  ' + C.cyn + 'percentage : ' + C.r + C.wht + level + '%' + C.r);
            println('  ' + C.cyn + 'status     : ' + C.r + (charging ? C.grn + 'CHARGING' : C.yel + 'DISCHARGING') + C.r);
            println('');
          }
        } catch (e) { println(C.red + 'battery: ' + e.message + C.r); }
        return;
      }
      case 'vibrate': {
        const ms = parseInt(rest[0] || '500', 10) || 500;
        if (navigator.vibrate) {
          const ok = navigator.vibrate(ms);
          println(ok ? C.grn + '✔ vibrating ' + ms + 'ms' + C.r
                     : C.yel + '⚠ vibration blocked' + C.r);
        } else println(C.yel + '⚠ vibration API unavailable' + C.r);
        return;
      }
      case 'clipboard-get': {
        try { const txt = await navigator.clipboard.readText();
              println(txt || C.gry + '(clipboard empty)' + C.r); }
        catch (e) { println(C.red + 'clipboard-get: permission denied' + C.r); }
        return;
      }
      case 'clipboard-set': {
        const txt = rest.join(' ');
        if (!txt) { println(C.yel + 'usage: termux-clipboard-set <text>' + C.r); return; }
        try { await navigator.clipboard.writeText(txt);
              println(C.grn + '✔ ' + Locale.t('toast_copy') + C.r);
              showToast('📋 ' + Locale.t('toast_copy'), 'ok'); }
        catch (e) { println(C.red + 'clipboard-set: ' + e.message + C.r); }
        return;
      }
      case 'toast': {
        const text = rest.join(' ') || 'Hello from HEX AI';
        showToast(text, 'ok');
        println(C.grn + '✔ toast shown: ' + text + C.r);
        return;
      }
      case 'notification': {
        let title = 'HEX AI', body = 'Notification from Termux:API';
        const t = rest.indexOf('--title');
        const c = rest.indexOf('--content');
        if (t !== -1 && rest[t + 1]) title = rest[t + 1];
        if (c !== -1 && rest[c + 1]) body  = rest[c + 1];
        await showNotification(title, body);
        return;
      }
      case 'notification-remove': { println(C.grn + '✔ notification removed' + C.r); return; }
      case 'tts-speak': {
        const text = rest.join(' ') || 'Hello from HEX AI';
        if (typeof speechSynthesis === 'undefined') {
          println(C.yel + 'tts-speak: speech synthesis unsupported' + C.r); return;
        }
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 1.0; u.pitch = 1.0;
          u.lang = Locale.get();
          speechSynthesis.speak(u);
          println(C.grn + '✔ speaking: "' + text + '"' + C.r);
        } catch (e) { println(C.red + 'tts-speak: ' + e.message + C.r); }
        return;
      }
      case 'tts-engines': { println('com.hexai.tts.engine'); return; }
      case 'location': {
        if (!navigator.geolocation) { println(C.red + 'location: geolocation unavailable' + C.r); return; }
        println(C.gry + 'requesting location permission…' + C.r);
        await new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => { println('');
              println(C.grn + C.b + '  LOCATION' + C.r);
              println('  ' + C.cyn + 'latitude  : ' + C.r + C.wht + pos.coords.latitude.toFixed(6) + C.r);
              println('  ' + C.cyn + 'longitude : ' + C.r + C.wht + pos.coords.longitude.toFixed(6) + C.r);
              println('  ' + C.cyn + 'accuracy  : ' + C.r + C.wht + pos.coords.accuracy.toFixed(1) + ' m' + C.r);
              println(''); resolve(); },
            (err) => { println(C.red + 'location: ' + err.message + C.r); resolve(); },
            { enableHighAccuracy:true, timeout:12000 });
        });
        return;
      }
      case 'wifi-connectioninfo': {
        const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        println('');
        println(C.grn + C.b + '  WIFI / NETWORK INFO' + C.r);
        if (c) {
          println('  ' + C.cyn + 'type       : ' + C.r + C.wht + (c.effectiveType || 'unknown') + C.r);
          println('  ' + C.cyn + 'downlink   : ' + C.r + C.wht + (c.downlink || '?') + ' Mbps' + C.r);
          println('  ' + C.cyn + 'rtt        : ' + C.r + C.wht + (c.rtt || '?') + ' ms' + C.r);
        } else {
          println('  ' + C.wht + 'online     : ' + (navigator.onLine ? 'yes' : 'no') + C.r);
        }
        println('');
        return;
      }
      case 'wifi-scaninfo': {
        println('[{"ssid":"HEX-NET","frequency":2412,"level":-45}]');
        return;
      }
      case 'wifi-enable': { println(C.grn + '✔ wifi toggled (simulated)' + C.r); return; }
      case 'share': {
        const text = rest.join(' ') || 'Shared from HEX AI terminal';
        if (navigator.share) {
          try { await navigator.share({ title:'HEX AI', text });
                println(C.grn + '✔ shared' + C.r); }
          catch (e) { println(C.gry + 'share cancelled' + C.r); }
        } else {
          println(C.yel + '⚠ Web Share API unavailable — copying' + C.r);
          try { await navigator.clipboard.writeText(text); showToast('📋 ' + Locale.t('toast_copy'), 'ok'); } catch (e) {}
        }
        return;
      }
      case 'dialog': {
        const prompt_ = rest.join(' ') || 'Enter value';
        const val = window.prompt(prompt_, '');
        if (val === null) { println('{"code":-1,"text":""}'); return; }
        println('{"code":0,"text":"' + val.replace(/"/g, '\\"') + '"}');
        return;
      }
      case 'fingerprint': {
        if (window.PublicKeyCredential) {
          println(C.grn + '✔ authentication successful' + C.r);
          println('{"auth_result":1,"errors":""}');
        } else {
          println(C.yel + '⚠ biometric unavailable' + C.r);
          println('{"auth_result":0,"errors":"unsupported"}');
        }
        return;
      }
      case 'sensor': {
        if (typeof DeviceOrientationEvent === 'undefined') {
          println(C.yel + '⚠ motion sensors unavailable' + C.r); return;
        }
        println(C.gry + 'reading device orientation for 1.5s…' + C.r);
        await new Promise((resolve) => {
          let got = false;
          const h = (e) => {
            got = true;
            println('{"sensor":"accelerometer","values":[' +
                    (e.alpha || 0).toFixed(2) + ',' +
                    (e.beta  || 0).toFixed(2) + ',' +
                    (e.gamma || 0).toFixed(2) + ']}');
          };
          window.addEventListener('deviceorientation', h);
          setTimeout(() => {
            window.removeEventListener('deviceorientation', h);
            if (!got) println(C.yel + '{"sensor":"accelerometer","values":[]}' + C.r);
            resolve();
          }, 1500);
        });
        return;
      }
      case 'camera-photo': {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          println(C.red + 'camera-photo: getUserMedia unavailable' + C.r); return;
        }
        try {
          const s = await navigator.mediaDevices.getUserMedia({ video:true });
          s.getTracks().forEach((t) => t.stop());
          println(C.grn + '✔ camera accessible' + C.r);
        } catch (e) { println(C.red + 'camera-photo: ' + e.name + C.r); }
        return;
      }
      case 'torch': {
        const on = (rest[0] || '').toLowerCase() !== 'false';
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
            const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
            const track = s.getVideoTracks()[0];
            if (track && track.getCapabilities && track.getCapabilities().torch) {
              await track.applyConstraints({ advanced:[{ torch:on }] });
              println(C.grn + '✔ torch ' + (on ? 'ON' : 'OFF') + C.r);
            } else println(C.yel + '⚠ device has no torch capability' + C.r);
            setTimeout(() => s.getTracks().forEach((t) => t.stop()), 800);
          } catch (e) { println(C.red + 'torch: ' + e.name + C.r); }
        } else println(C.yel + '⚠ torch API unavailable' + C.r);
        return;
      }
      case 'volume': { println('{"stream":"music","volume":7,"max_volume":15}'); return; }
      case 'brightness': { println(C.grn + '✔ brightness ' + (rest[0] || '128') + ' (simulated)' + C.r); return; }
      case 'telephony-deviceinfo': {
        println('{"network_operator_name":"HEX Mobile","network_country_iso":"IN"}');
        return;
      }
      case 'telephony-cellinfo': { println('[{"type":"gsm","cid":12345,"signalStrength":-67}]'); return; }
      case 'telephony-call': {
        const num = rest[0] || '0000000000';
        println(C.grn + '✔ dialing ' + num + ' (simulated)' + C.r);
        window.location.href = 'tel:' + num;
        return;
      }
      case 'contact-list': { println('[]'); return; }
      case 'sms-list': { println('[]'); return; }
      case 'sms-send': { println(C.grn + '✔ SMS queued (requires Termux:API app)' + C.r); return; }
      case 'call-log': { println('[]'); return; }
      case 'media-player': { println(C.grn + '✔ media-player: ' + (rest.join(' ') || 'info') + ' (simulated)' + C.r); return; }
      case 'media-scan': { println(C.grn + '✔ media scan complete' + C.r); return; }
      case 'audio-info': { println('{"stream":"music","volume":7,"max_volume":15}'); return; }
      case 'microphone-record': {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio:true });
          s.getTracks().forEach((t) => t.stop());
          println(C.grn + '✔ microphone accessible' + C.r);
        } catch (e) { println(C.red + 'microphone-record: ' + e.name + C.r); }

      }

      case 'storage-get': { println(C.grn + '✔ storage-get requested' + C.r); return; }
      case 'download': {
        const url = rest[0];
        if (!url) { println(C.yel + 'usage: termux-download <url>' + C.r); return; }
        const a = document.createElement('a');
        a.href = url; a.download = ''; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(() => a.remove(), 400);
        println(C.grn + '✔ download started for ' + url + C.r);

      }
      case 'open': case 'open-url': {
        const url = rest[0] || 'https://example.com';
        window.open(/^https?:/.test(url) ? url : ('https://' + url), '_blank', 'noopener');
        println(C.grn + '✔ opened ' + url + C.r);

      case 'usb': { if (navigator.usb) println('[]'); else println(C.yel + '⚠ WebUSB unavailable' + C.r); return; }

      case 'keystore': { println(C.grn + '✔ keystore operation completed (simulated)' + C.r); return; }
      default: {
        println('');
        println(C.grn + C.b + '  TERMUX:API COMMANDS' + C.r);
        println(C.gry + '  ─────────────────────────────────────────' + C.r);
        ['termux-battery-status [--json]','termux-vibrate <ms>','termux-clipboard-get',
         'termux-clipboard-set <text>','termux-toast <text>','termux-notification',
         'termux-tts-speak <text>','termux-location','termux-wifi-connectioninfo',
         'termux-share <text>','termux-dialog <prompt>','termux-fingerprint',

         'termux-wallpaper'].forEach((l) => println('  ' + C.cyn + l + C.r));
        println('');
      }
    }
  }

  function applyScheme(name, loud) {

      return;

    state.scheme = key;

    term.options.theme = SCHEMES[key].theme;

    if (loud) {

  async function styleMenuColors() {
    println('');
    println(C.grn + C.b + '  SELECT COLOR-SCHEME' + C.r);
    SCHEME_NAMES.forEach((id, i) => {
      const active = id === state.scheme;
      println('  ' + (active ? C.grn + '▸' : C.gry + ' ') + ' ' +
              C.gry + pad(i + 1, 3) + C.r + '  ' +
              (active ? C.grn + C.b + SCHEMES[id].name + C.r : C.wht + SCHEMES[id].name + C.r));
    });
    println('');
    term.write(C.grn + '  [Color #]: ' + C.r);
    const k = await waitKey();
    term.write('\r\n');
    if (k === 'q' || k === 'esc') return;
    let buf = /[0-9]/.test(k) ? k : '';
    if (!buf) { println(C.yel + '  invalid' + C.r); return; }
    while (true) {
      term.write(C.grn + '  [Color #]: ' + C.r + buf);
      const more = await waitKey();
      if (more === 'enter') break;
      if (more === 'esc') { term.write('\r\n'); return; }
      if (more.length === 1 && /[0-9]/.test(more)) { buf += more; term.write('\x1b[2K\r'); continue; }
      break;
    }
    const idx = parseInt(buf, 10) - 1;
    term.write('\r\n');
    if (isNaN(idx) || idx < 0 || idx >= SCHEME_NAMES.length) { println(C.red + '  invalid' + C.r); return; }
    applyScheme(SCHEME_NAMES[idx], true);
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function tryMath(q) {
    if (!/^[\d\s+\-*/().%^]+$/.test(q)) return null;
    try {
      const expr = q.replace(/\^/g, '**');
      const val = Function('"use strict";return (' + expr + ')')();
      if (typeof val === 'number' && isFinite(val)) return val;
    } catch (e) {}
    return null;
  }
  function offlineReply(q) {
    const lower = q.toLowerCase();
    for (const entry of AI_KB) {
      if (entry.k.some((k) => lower.indexOf(k) !== -1)) return pick(entry.a);
    }
    return 'I parsed "' + q + '" but the live AI endpoint seems unreachable. Type "help".';
  }

  async function cmdAI(args) {
    if (args[0] === '--clear' || args[0] === '--reset') {
      resetConversation();
      println(C.grn + '✔ ' + Locale.t('toast_ai_cleared') + C.r);
      return;
    }
    if (args[0] === '--status') {
      println('');
      println(C.grn + C.b + '  ' + Locale.t('ai_status_header') + C.r);
      println(C.gry + '  ─────────────────────────────────────────' + C.r);
      println('  ' + C.cyn + Locale.t('ai_endpoint') + ' : ' + C.r + C.wht + HEX_AI_ENDPOINT + C.r);
      println('  ' + C.cyn + Locale.t('ai_model')    + '    : ' + C.r + C.wht + HEX_AI_MODEL + C.r);
      println('  ' + C.cyn + Locale.t('ai_api_key')  + '  : ' + C.r + C.grn + Locale.t('ai_none_required') + C.r);
      println('  ' + C.cyn + Locale.t('ai_stream')   + '   : ' + C.r + C.wht + 'yes (SSE)' + C.r);
      println('  ' + C.cyn + Locale.t('ai_memory')   + '   : ' + C.r + C.wht + (conversation.length - 1) + ' / ' + MAX_TURNS + C.r);
      println('  ' + C.cyn + Locale.t('ai_mode')     + '     : ' + C.r +
              (state.aiLive ? C.grn + Locale.t('ai_mode_live') + C.r : C.yel + Locale.t('ai_mode_offline') + C.r));
      println('  ' + C.cyn + 'locale   : ' + C.r + C.wht + Locale.get() + ' (' + Locale.info(Locale.get()).native + ')' + C.r);
      println('');
      return;
    }
    if (args[0] === '--offline') { state.aiLive = false; println(C.yel + '⚠ offline mode' + C.r); return; }
    if (args[0] === '--online')  { state.aiLive = true;  println(C.grn + '✔ live mode' + C.r); return; }

    const q = args.join(' ').trim();
    if (!q) {
      println('');
      println(C.grn + '  HEX AI ▸ usage: ai <your question>' + C.r);
      println('');
      return;
    }

    const math = tryMath(q);
    if (math !== null) {
      println('');
      println('  ' + C.grn + '▸' + C.r + ' ' + C.wht + q + ' = ' + C.r + C.grn + C.b + math + C.r);
      println('');
      return;
    }

    println('');
    term.write('  ' + C.grn + C.b + '╭─ HEX AI ' + C.r + C.gry + '──── live · ' + HEX_AI_MODEL +
               ' · ' + Locale.get() + ' ────' + C.r + '\r\n');
    const spinFrames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    let spinIdx = 0;
    let gotFirstToken = false;
    setStatus('ai');

    term.write('  ' + C.grn + '│ ' + C.r);
    const spinId = setInterval(() => {
      if (gotFirstToken) return;
      const f = spinFrames[spinIdx++ % spinFrames.length];
      term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.cyn + f + C.r + ' ' + C.gry + Locale.t('ai_thinking') + '…' + C.r);
    }, 72);

    pushConversation('user', q);
    let reply = '';
    let via = '';
    const wrapWidth = Math.max(20, term.cols - 6);
    let currentCol = 0;

    function writeWrapped(chunk) {
      for (let i = 0; i < chunk.length; i++) {
        const ch = chunk[i];
        if (ch === '\n') { term.write('\r\n  ' + C.grn + '│ ' + C.r + C.wht); currentCol = 0; continue; }
        if (ch === '\r') continue;
        if (currentCol >= wrapWidth) { term.write('\r\n  ' + C.grn + '│ ' + C.r + C.wht); currentCol = 0; }
        term.write(C.wht + ch + C.r);
        currentCol++;
      }
    }

    const result = await streamHexAIReply(
      (token) => {
        if (!gotFirstToken) { gotFirstToken = true; clearInterval(spinId); term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.r); }
        reply += token;
        writeWrapped(token);
      },
      (label) => { via = label; }
    );

    clearInterval(spinId);

    if (result.ok && reply) {
      pushConversation('assistant', reply);
      term.write('\r\n');
      println('  ' + C.grn + '╰─ ' + C.gry + Locale.t('ai_live_via') + ' ' + via + ' · ' +
              reply.length + ' ' + Locale.t('ai_chars') + ' · ' +
              (conversation.length - 1) + '/' + MAX_TURNS + ' ' + Locale.t('ai_turns') + C.r);
      println('');
      setStatus('online');
      return;
    }

    if (!gotFirstToken) term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.r);
    println('');
    println('  ' + C.grn + '╰─ ' + C.yel + Locale.t('ai_offline') + C.r);
    println('');

    const fallback = offlineReply(q);
    pushConversation('assistant', fallback);
    term.write('  ' + C.grn + C.b + '╭─ HEX AI ' + C.r + C.gry + '──────── offline KB ────────' + C.r + '\r\n');
    term.write('  ' + C.grn + '│ ' + C.r);
    await typeOut('  ' + C.wht + fallback + C.r, 6);
    println('  ' + C.grn + '╰──────────────────────────────────────' + C.r);
    println('');
    setStatus('online');
  }

  /* ---- fetch / open / proxy / matrix / pkg / reboot / exit ---- */
  async function cmdFetch(args) {
    const raw = args.filter((a) => a.charAt(0) !== '-');
    let url = raw[0];
    const keepRaw = args.indexOf('-raw') !== -1;
    if (!url) { println(C.yel + 'usage: fetch <url> [-raw]' + C.r); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    println('');
    println('  ' + C.cyn + '→ ' + C.r + C.wht + url + C.r);
    const res = await proxyFetch(url);
    if (res.aborted) { println(C.yel + '  ✖ aborted' + C.r); return; }
    if (!res.ok) { println(C.red + '  ✖ fetch failed' + C.r); return; }
    println('');
    println('  ' + C.grn + C.b + '✔ 200 OK' + C.r + C.gry + '   via ' + res.via + '   ' +
            (res.text.length / 1024).toFixed(1) + ' KB' + C.r);
    println('');
    let body = res.text;
    if (!keepRaw) {
      body = body
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
        .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    }
    const lines = body.split('\n').filter((l) => l.trim().length).slice(0, 28);
    let printed = 0;
    for (const l of lines) {
      if (printed >= 1600) break;
      const cut = l.length > 160 ? l.slice(0, 160) + '…' : l;
      println('  ' + C.gry + '│' + C.r + ' ' + C.wht + cut + C.r);
      printed += cut.length;
      await sleep(14);
    }
    println('');
  }

      println('');
      println(C.cyn + 'Reading package lists... Done' + C.r);
      println(C.grn + name + C.r + C.gry + '  (' + PACKAGES[name].size + ')  — ' + PACKAGES[name].desc + C.r);

      if (isAddon) { await progressBar('download addon'); await progressBar('link'); }

      state.installed[name] = true;
