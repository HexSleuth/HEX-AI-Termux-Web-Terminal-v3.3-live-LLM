<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark light"/>
<title>HEX AI — Termux Web Terminal v3.4</title>

<!-- ============ xterm.js core stylesheet (CDN) ============ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"/>

<!-- ============ Web fonts (Termux-style + powerline-ready) ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Source+Code+Pro:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Ubuntu+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&family=Inconsolata:wght@400;700&family=Space+Mono:wght@400;700&family=Anonymous+Pro:wght@400;700&family=Victor+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/* ============================================================
   HEX AI TERMINAL v3.4
   Termux Android–authentic mobile interface
   Features:
     • Auto theme detection (follows device preference)
     • Forced dark / light mode toggle
     • Termux session drawer, menu bar, extra-keys row
     • Long-press context menu (Copy / Paste / Style / Help)
   ============================================================ */

/* ============================================================
   THEME TOKENS
   Applied via [data-theme] on #hexai-widget:
     auto  → follows prefers-color-scheme
     dark  → forced dark (Termux default)
     light → forced light
   ============================================================ */

#hexai-widget{
  /* -------- DEFAULT = DARK (Termux native) -------- */
  --hx-accent:#00ffa3;
  --hx-accent2:#00d9ff;
  --hx-text:#d7ffe9;
  --hx-dim:#6f8a9b;
  --hx-line:rgba(0,255,163,.18);
  --hx-panel:#070c13;

  --tm-bg:           #000000;
  --tm-bg-2:         #050505;
  --tm-bg-3:         #0b0b0b;
  --tm-fg:           #ffffff;
  --tm-fg-dim:       #b0b0b0;
  --tm-fg-mute:      #7a7a7a;
  --tm-accent:       #00ffa3;
  --tm-accent-soft:  rgba(0,255,163,.16);
  --tm-accent-line:  rgba(0,255,163,.30);
  --tm-border:       rgba(255,255,255,.08);
  --tm-border-strong:rgba(255,255,255,.16);
  --tm-key-bg:       linear-gradient(180deg,#1a1a1a,#101010);
  --tm-key-bg-hi:    linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-key-fg:       #e0e0e0;
  --tm-key-fg-hi:    #04120c;
  --tm-key-border:   rgba(255,255,255,.10);
  --tm-key-shadow:   0 1px 0 rgba(255,255,255,.05) inset, 0 2px 6px rgba(0,0,0,.7);
  --tm-toast-bg:     rgba(20,20,20,.96);
  --tm-toast-fg:     #f0f0f0;
  --tm-toast-border: rgba(0,255,163,.42);
  --tm-status-bg:    linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-status-fg:    #04120c;
  --tm-status-ai-bg: linear-gradient(180deg,#00d9ff,#0096d6);
  --tm-status-ai-fg: #02121a;
  --tm-scanline:     rgba(255,255,255,.022);
  --tm-shadow-glow:  0 18px 55px -14px rgba(0,255,163,.30);
  --tm-shadow-glow2: 0 0 110px -35px rgba(0,217,255,.40);
  --tm-outer-border: rgba(0,255,163,.22);

  position:relative;
  width:100%;
  max-width:1000px;
  margin:0 auto;
  border-radius:16px;
  overflow:hidden;
  isolation:isolate;
  background:var(--tm-bg);
  color:var(--tm-fg);
  border:1px solid var(--tm-outer-border);
  box-shadow:
     0 0 0 1px rgba(0,0,0,.65),
     var(--tm-shadow-glow),
     var(--tm-shadow-glow2);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
  transition:background .28s ease, color .28s ease, border-color .28s ease;
}
#hexai-widget *,
#hexai-widget *::before,
#hexai-widget *::after{ box-sizing:border-box; }

/* ============================================================
   AUTO THEME — follow device preference
   ============================================================ */
@media (prefers-color-scheme: light){
  #hexai-widget[data-theme="auto"]{
    --tm-bg:           #f6f6f4;
    --tm-bg-2:         #eeeeec;
    --tm-bg-3:         #e4e4e2;
    --tm-fg:           #121212;
    --tm-fg-dim:       #3d3d3d;
    --tm-fg-mute:      #6f6f6f;
    --tm-accent:       #0f8f5f;
    --tm-accent-soft:  rgba(15,143,95,.14);
    --tm-accent-line:  rgba(15,143,95,.35);
    --tm-border:       rgba(0,0,0,.10);
    --tm-border-strong:rgba(0,0,0,.20);
    --tm-key-bg:       linear-gradient(180deg,#ffffff,#e9e9e9);
    --tm-key-bg-hi:    linear-gradient(180deg,#0f8f5f,#0b7a50);
    --tm-key-fg:       #1a1a1a;
    --tm-key-fg-hi:    #ffffff;
    --tm-key-border:   rgba(0,0,0,.10);
    --tm-key-shadow:   0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(0,0,0,.10);
    --tm-toast-bg:     rgba(255,255,255,.98);
    --tm-toast-fg:     #121212;
    --tm-toast-border: rgba(15,143,95,.45);
    --tm-status-bg:    linear-gradient(180deg,#0f8f5f,#0b7a50);
    --tm-status-fg:    #ffffff;
    --tm-status-ai-bg: linear-gradient(180deg,#0077cc,#005fa3);
    --tm-status-ai-fg: #ffffff;
    --tm-scanline:     rgba(0,0,0,.012);
    --tm-shadow-glow:  0 14px 40px -14px rgba(15,143,95,.30);
    --tm-shadow-glow2: 0 0 70px -35px rgba(0,119,204,.25);
    --tm-outer-border: rgba(15,143,95,.30);
  }
}

/* ============================================================
   FORCED DARK MODE
   ============================================================ */
#hexai-widget[data-theme="dark"]{
  --tm-bg:           #000000;
  --tm-bg-2:         #050505;
  --tm-bg-3:         #0b0b0b;
  --tm-fg:           #ffffff;
  --tm-fg-dim:       #b0b0b0;
  --tm-fg-mute:      #7a7a7a;
  --tm-accent:       #00ffa3;
  --tm-accent-soft:  rgba(0,255,163,.16);
  --tm-accent-line:  rgba(0,255,163,.30);
  --tm-border:       rgba(255,255,255,.08);
  --tm-border-strong:rgba(255,255,255,.16);
  --tm-key-bg:       linear-gradient(180deg,#1a1a1a,#101010);
  --tm-key-bg-hi:    linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-key-fg:       #e0e0e0;
  --tm-key-fg-hi:    #04120c;
  --tm-key-border:   rgba(255,255,255,.10);
  --tm-key-shadow:   0 1px 0 rgba(255,255,255,.05) inset, 0 2px 6px rgba(0,0,0,.7);
  --tm-toast-bg:     rgba(20,20,20,.96);
  --tm-toast-fg:     #f0f0f0;
  --tm-toast-border: rgba(0,255,163,.42);
  --tm-status-bg:    linear-gradient(180deg,#00ffa3,#00c47a);
  --tm-status-fg:    #04120c;
  --tm-status-ai-bg: linear-gradient(180deg,#00d9ff,#0096d6);
  --tm-status-ai-fg: #02121a;
  --tm-scanline:     rgba(255,255,255,.022);
  --tm-shadow-glow:  0 18px 55px -14px rgba(0,255,163,.30);
  --tm-shadow-glow2: 0 0 110px -35px rgba(0,217,255,.40);
  --tm-outer-border: rgba(0,255,163,.22);
}

/* ============================================================
   FORCED LIGHT MODE
   ============================================================ */
#hexai-widget[data-theme="light"]{
  --tm-bg:           #f6f6f4;
  --tm-bg-2:         #eeeeec;
  --tm-bg-3:         #e4e4e2;
  --tm-fg:           #121212;
  --tm-fg-dim:       #3d3d3d;
  --tm-fg-mute:      #6f6f6f;
  --tm-accent:       #0f8f5f;
  --tm-accent-soft:  rgba(15,143,95,.14);
  --tm-accent-line:  rgba(15,143,95,.35);
  --tm-border:       rgba(0,0,0,.10);
  --tm-border-strong:rgba(0,0,0,.20);
  --tm-key-bg:       linear-gradient(180deg,#ffffff,#e9e9e9);
  --tm-key-bg-hi:    linear-gradient(180deg,#0f8f5f,#0b7a50);
  --tm-key-fg:       #1a1a1a;
  --tm-key-fg-hi:    #ffffff;
  --tm-key-border:   rgba(0,0,0,.10);
  --tm-key-shadow:   0 1px 0 rgba(255,255,255,.9) inset, 0 2px 6px rgba(0,0,0,.10);
  --tm-toast-bg:     rgba(255,255,255,.98);
  --tm-toast-fg:     #121212;
  --tm-toast-border: rgba(15,143,95,.45);
  --tm-status-bg:    linear-gradient(180deg,#0f8f5f,#0b7a50);
  --tm-status-fg:    #ffffff;
  --tm-status-ai-bg: linear-gradient(180deg,#0077cc,#005fa3);
  --tm-status-ai-fg: #ffffff;
  --tm-scanline:     rgba(0,0,0,.012);
  --tm-shadow-glow:  0 14px 40px -14px rgba(15,143,95,.30);
  --tm-shadow-glow2: 0 0 70px -35px rgba(0,119,204,.25);
  --tm-outer-border: rgba(15,143,95,.30);
}

/* subtle CRT scanline overlay (dark only) */
#hexai-widget::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
  background:repeating-linear-gradient(
     to bottom,
     var(--tm-scanline) 0px,
     var(--tm-scanline) 1px,
     rgba(0,0,0,0) 2px,
     rgba(0,0,0,0) 4px
  );
  mix-blend-mode:overlay;
  opacity:.65;
  transition:background .28s ease;
}
#hexai-widget[data-theme="light"]::after{ opacity:.25; }

/* ============================================================
   TERMUX STATUS BAR (top)
   Mirrors the real Termux app: session title + menu (⋮)
   ============================================================ */
#hexai-widget .tm-statusbar{
  position:relative;
  z-index:6;
  display:flex;
  align-items:center;
  gap:10px;
  height:44px;
  padding:0 8px 0 6px;
  background:var(--tm-bg-2);
  border-bottom:1px solid var(--tm-border);
  transition:background .28s ease, border-color .28s ease;
}
#hexai-widget .tm-menu-btn{
  flex:0 0 auto;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--tm-fg);
  font-size:18px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .18s ease, transform .12s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-menu-btn:active{ transform:scale(.92); background:var(--tm-accent-soft); }
#hexai-widget .tm-menu-btn svg{ width:20px; height:20px; display:block; }

#hexai-widget .tm-session{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  line-height:1.15;
}
#hexai-widget .tm-session-name{
  font:600 13px/1.15 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  letter-spacing:.01em;
  color:var(--tm-fg);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#hexai-widget .tm-session-sub{
  font:500 10.5px/1.15 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.05em;
  color:var(--tm-fg-mute);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:2px;
}
#hexai-widget .tm-session-sub b{ color:var(--tm-accent); font-weight:700; }

#hexai-widget .tm-status-right{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
#hexai-widget .tm-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border-radius:999px;
  font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.09em;
  text-transform:uppercase;
  background:var(--tm-status-bg);
  color:var(--tm-status-fg);
  box-shadow:0 0 12px var(--tm-accent-soft);
  transition:background .25s ease, color .25s ease;
}
#hexai-widget .tm-badge.ai{
  background:var(--tm-status-ai-bg);
  color:var(--tm-status-ai-fg);
  box-shadow:0 0 16px rgba(0,217,255,.55);
}
#hexai-widget .tm-badge .tm-led{
  width:6px; height:6px; border-radius:50%;
  background:currentColor;
  animation:tm-pulse 1.15s ease-in-out infinite;
}
@keyframes tm-pulse{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:.30; transform:scale(.7); }
}

#hexai-widget .tm-theme-btn{
  flex:0 0 auto;
  width:36px;
  height:36px;
  border:1px solid var(--tm-border);
  border-radius:50%;
  background:transparent;
  color:var(--tm-fg);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  transition:background .18s ease, transform .12s ease, border-color .18s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-theme-btn:active{ transform:scale(.92); background:var(--tm-accent-soft); }
#hexai-widget .tm-theme-btn svg{ width:16px; height:16px; display:block; }

/* ============================================================
   SESSION DRAWER (left-edge, Termux style)
   ============================================================ */
#hexai-widget .tm-drawer-scrim{
  position:absolute;
  inset:0;
  z-index:30;
  background:rgba(0,0,0,.55);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
  backdrop-filter:blur(1.5px);
}
#hexai-widget .tm-drawer{
  position:absolute;
  top:0;
  left:0;
  bottom:0;
  z-index:31;
  width:min(300px, 78%);
  background:var(--tm-bg-2);
  border-right:1px solid var(--tm-border-strong);
  transform:translateX(-102%);
  transition:transform .26s cubic-bezier(.22,.61,.36,1);
  display:flex;
  flex-direction:column;
  box-shadow:12px 0 42px rgba(0,0,0,.55);
}
#hexai-widget.drawer-open .tm-drawer{ transform:translateX(0); }
#hexai-widget.drawer-open .tm-drawer-scrim{ opacity:1; pointer-events:auto; }

#hexai-widget .tm-drawer-head{
  padding:14px 16px 12px 16px;
  border-bottom:1px solid var(--tm-border);
  background:var(--tm-bg-3);
}
#hexai-widget .tm-drawer-title{
  font:700 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--tm-accent);
}
#hexai-widget .tm-drawer-sub{
  margin-top:6px;
  font:500 11px/1.4 ui-monospace,monospace;
  color:var(--tm-fg-mute);
}
#hexai-widget .tm-drawer-list{
  flex:1 1 auto;
  overflow-y:auto;
  padding:8px 0 14px 0;
}
#hexai-widget .tm-drawer-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 16px;
  border:0;
  background:transparent;
  width:100%;
  text-align:left;
  color:var(--tm-fg);
  font:500 13.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:background .15s ease, border-color .15s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-drawer-item:hover,
#hexai-widget .tm-drawer-item:active{
  background:var(--tm-accent-soft);
  border-left-color:var(--tm-accent);
}
#hexai-widget .tm-drawer-item .ic{
  flex:0 0 20px;
  width:20px; height:20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--tm-accent);
}
#hexai-widget .tm-drawer-item .ic svg{ width:16px; height:16px; display:block; }
#hexai-widget .tm-drawer-item .lbl{ flex:1 1 auto; min-width:0; }
#hexai-widget .tm-drawer-item .kbd{
  flex:0 0 auto;
  font:600 10px/1 ui-monospace,monospace;
  letter-spacing:.06em;
  color:var(--tm-fg-mute);
  padding:3px 6px;
  border-radius:5px;
  background:rgba(127,127,127,.14);
}
#hexai-widget .tm-drawer-sep{
  height:1px;
  background:var(--tm-border);
  margin:6px 12px;
}
#hexai-widget .tm-drawer-section{
  padding:10px 16px 4px 16px;
  font:700 10px/1 ui-monospace,monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tm-fg-mute);
}

/* ============================================================
   MENU POPUP (three-dot menu, Termux long-press style)
   ============================================================ */
#hexai-widget .tm-menu-popup{
  position:absolute;
  top:48px;
  left:8px;
  z-index:32;
  min-width:230px;
  max-width:min(300px, 84%);
  padding:6px 0;
  border-radius:12px;
  background:var(--tm-bg-2);
  border:1px solid var(--tm-border-strong);
  box-shadow:0 18px 44px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4);
  opacity:0;
  transform:translateY(-8px) scale(.97);
  transform-origin:top left;
  pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}
#hexai-widget.menu-open .tm-menu-popup{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}
#hexai-widget .tm-menu-popup .row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  padding:10px 15px;
  border:0;
  background:transparent;
  color:var(--tm-fg);
  font:500 13.5px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  text-align:left;
  cursor:pointer;
  transition:background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
#hexai-widget .tm-menu-popup .row:hover,
#hexai-widget .tm-menu-popup .row:active{ background:var(--tm-accent-soft); }
#hexai-widget .tm-menu-popup .row .ic{
  flex:0 0 18px; width:18px; height:18px;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--tm-accent);
}
#hexai-widget .tm-menu-popup .row .ic svg{ width:15px; height:15px; display:block; }
#hexai-widget .tm-menu-popup .row .kbd{
  margin-left:auto;
  font:600 10px/1 ui-monospace,monospace;
  color:var(--tm-fg-mute);
}
#hexai-widget .tm-menu-popup .sep{ height:1px; background:var(--tm-border); margin:5px 8px; }
#hexai-widget .tm-menu-popup .lbl-title{
  padding:8px 15px 4px 15px;
  font:700 9.5px/1 ui-monospace,monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--tm-fg-mute);
}

/* ============================================================
   TERMINAL SCREEN
   ============================================================ */
#hexai-widget .hx-screen{
  position:relative;
  z-index:4;
  height:460px;
  min-height:260px;
  padding:10px 6px 10px 12px;
  background:var(--tm-bg);
  overflow:hidden;
  touch-action:pan-y;
  transition:background .28s ease, padding .3s ease, margin .3s ease, border-radius .3s ease;
}
#hexai-widget .hx-screen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%, var(--tm-accent-soft), transparent 72%);
  opacity:.55;
  z-index:0;
  transition:background .28s ease;
}
#hexai-widget.hx-float .hx-screen{
  margin:14px 14px 6px 14px;
  border-radius:14px;
  border:1px solid var(--tm-accent-line);
  box-shadow:0 0 42px var(--tm-accent-soft), inset 0 0 44px var(--tm-accent-soft);
}
#hexai-term{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
}
#hexai-term .xterm{ height:100%; padding:0; }
#hexai-term .xterm-viewport{
  background:transparent !important;
  scrollbar-width:thin;
  scrollbar-color:var(--tm-accent-line) transparent;
}
#hexai-term .xterm-viewport::-webkit-scrollbar{ width:7px; }
#hexai-term .xterm-viewport::-webkit-scrollbar-track{ background:transparent; }
#hexai-term .xterm-viewport::-webkit-scrollbar-thumb{
  background:var(--tm-accent-line);
  border-radius:8px;
}
#hexai-term .xterm-screen{ z-index:2; }

/* ============================================================
   EXTRA-KEYS ROW (Termux mobile keyboard extension)
   ============================================================ */
#hexai-widget .hx-keys{
  position:relative;
  z-index:6;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px)) 8px;
  background:var(--tm-bg-2);
  border-top:1px solid var(--tm-border);
  transition:background .28s ease, border-color .28s ease;
}
#hexai-widget .hx-key{
  flex:0 0 auto;
  min-width:40px;
  height:36px;
  padding:0 11px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  border:1px solid var(--tm-key-border);
  background:var(--tm-key-bg);
  color:var(--tm-key-fg);
  font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .10s ease, background .16s ease, color .16s ease, box-shadow .16s ease, border-color .16s ease;
  box-shadow:var(--tm-key-shadow);
}
#hexai-widget .hx-key:active,
#hexai-widget .hx-key.is-active{
  transform:translateY(1px);
  background:var(--tm-key-bg-hi);
  color:var(--tm-key-fg-hi);
  border-color:var(--tm-accent);
  box-shadow:0 0 18px var(--tm-accent-soft);
}
#hexai-widget .hx-key.on{
  background:var(--tm-status-ai-bg);
  color:var(--tm-status-ai-fg);
  border-color:#00d9ff;
  box-shadow:0 0 16px rgba(0,217,255,.65);
}
#hexai-widget .hx-key.wide{ min-width:56px; }
#hexai-widget .hx-key.accent{
  color:var(--tm-accent);
  border-color:var(--tm-accent-line);
}

/* ============================================================
   FOOTER
   ============================================================ */
#hexai-widget .hx-foot{
  position:relative;
  z-index:6;
  padding:7px 12px;
  font:500 10.5px/1.4 ui-monospace,monospace;
  letter-spacing:.04em;
  color:var(--tm-fg-mute);
  background:var(--tm-bg-3);
  border-top:1px solid var(--tm-border);
  text-align:center;
  transition:background .28s ease, border-color .28s ease;
}
#hexai-widget .hx-foot span{ color:var(--tm-accent); }

/* ============================================================
   LOADING VEIL
   ============================================================ */
#hexai-widget .hx-loading{
  position:absolute;
  inset:0;
  z-index:40;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:var(--tm-bg);
  transition:opacity .5s ease, background .28s ease;
}
#hexai-widget .hx-loading.hide{ opacity:0; pointer-events:none; }
#hexai-widget .hx-spin{
  width:52px; height:52px;
  border-radius:50%;
  border:3px solid var(--tm-accent-soft);
  border-top-color:var(--tm-accent);
  border-right-color:var(--tm-accent2, #00d9ff);
  animation:hx-rot .85s linear infinite;
  box-shadow:0 0 26px var(--tm-accent-soft);
}
@keyframes hx-rot{ to{ transform:rotate(360deg); } }
#hexai-widget .hx-loadtxt{
  font:700 12px/1 ui-monospace,monospace;
  letter-spacing:.22em;
  color:var(--tm-accent);
  text-transform:uppercase;
  animation:hx-blink 1.2s ease-in-out infinite;
}
@keyframes hx-blink{ 0%,100%{opacity:1} 50%{opacity:.35} }

/* ============================================================
   TOASTS
   ============================================================ */
#hexai-widget .hx-toasts{
  position:absolute;
  left:50%;
  bottom:96px;
  transform:translateX(-50%);
  z-index:60;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
  pointer-events:none;
  width:max-content;
  max-width:82%;
}
#hexai-widget .hx-toast{
  padding:9px 14px;
  border-radius:22px;
  background:var(--tm-toast-bg);
  color:var(--tm-toast-fg);
  font:500 12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  border:1px solid var(--tm-toast-border);
  box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 20px var(--tm-accent-soft);
  backdrop-filter:blur(6px);
  opacity:0;
  transform:translateY(14px);
  animation:hx-toast-in .28s ease forwards;
  pointer-events:none;
  text-align:center;
}
#hexai-widget .hx-toast.out{ animation:hx-toast-out .28s ease forwards; }
#hexai-widget .hx-toast.ok   { border-color:var(--tm-accent-line); }
#hexai-widget .hx-toast.err  { border-color:rgba(255,92,92,.55); color:#ffd9d9; }
#hexai-widget .hx-toast.warn { border-color:rgba(255,214,92,.55); color:#fff4d1; }
@keyframes hx-toast-in{ to{ opacity:1; transform:translateY(0); } }
@keyframes hx-toast-out{ to{ opacity:0; transform:translateY(-6px); } }

/* ============================================================

@media (max-width:640px){

}

<script>
/* ================================================================
   HEX AI — TERMUX WEB TERMINAL v3.4
   Termux Android–authentic mobile interface
     • Auto theme via prefers-color-scheme
     • Forced dark / light toggle (3-state cycle)
     • Session drawer + three-dot menu + long-press context menu
     • Live AI via Pollinations.ai text API (no API key)
     • termux-api bridge + termux-style port (30 schemes · 20 fonts)
   ================================================================ */
(function () {
  'use strict';

  /* ------------------------------------------------------------
     0. REFERENCES + SAFETY
     ------------------------------------------------------------ */
  const ROOT      = document.getElementById('hexai-widget');
  if (!ROOT) return;

  const termEl    = document.getElementById('hexai-term');
  const keysEl    = document.getElementById('hexai-keys');
  const loadingEl = document.getElementById('hx-loading');
  const statusEl  = document.getElementById('hx-status-text');
  const statusPill= document.getElementById('hx-status-pill');
  const toastsEl  = document.getElementById('hx-toasts');
  const screenEl  = document.getElementById('hx-screen');
  const themeBtn  = document.getElementById('tm-theme-toggle');
  const themeIcon = document.getElementById('tm-theme-icon');
  const themeLbl  = document.getElementById('tm-theme-label');
  const menuBtn   = document.getElementById('tm-menu-btn');
  const menuPopup = document.getElementById('tm-menu-popup');
  const drawerEl  = document.getElementById('tm-drawer');
  const drawerList= document.getElementById('tm-drawer-list');
  const drawerScr = document.getElementById('tm-drawer-scrim');
  const miAuto    = document.getElementById('mi-auto');
  const miDark    = document.getElementById('mi-dark');
  const miLight   = document.getElementById('mi-light');

  if (typeof Terminal === 'undefined') {
    loadingEl.innerHTML =
      '<div style="color:#ff5c5c;font:13px ui-monospace,monospace;padding:24px;text-align:center;line-height:1.7">' +
      '✖ xterm.js could not be loaded.<br>Check your internet connection / CDN access.</div>';
    return;
  }

  /* ------------------------------------------------------------
     1. UTILITIES
     ------------------------------------------------------------ */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pad = (n, len) => { let s = String(n); while (s.length < len) s = ' ' + s; return s; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ------------------------------------------------------------
     2. THEME ENGINE
     States: 'auto' | 'dark' | 'light'
     ------------------------------------------------------------ */
  const ThemeEngine = (function () {
    const STORAGE_KEY = 'hexai.theme';
    let current = 'auto';
    const listeners = [];
    const mql = (window.matchMedia
      ? window.matchMedia('(prefers-color-scheme: dark)')
      : null);

    function systemIsDark() {
      return mql ? mql.matches : true;
    }

    function effective() {
      if (current === 'dark')  return 'dark';
      if (current === 'light') return 'light';
      return systemIsDark() ? 'dark' : 'light';
    }

    function apply() {
      ROOT.setAttribute('data-theme', current);
      const eff = effective();
      if (themeLbl) themeLbl.textContent = current + (current === 'auto' ? ' (' + eff + ')' : '');
      if (miAuto)  miAuto.textContent  = current === 'auto'  ? '✓' : ' ';
      if (miDark)  miDark.textContent  = current === 'dark'  ? '✓' : ' ';
      if (miLight) miLight.textContent = current === 'light' ? '✓' : ' ';
      updateIcon(eff);
      listeners.forEach((fn) => { try { fn(eff, current); } catch (e) {} });
    }

    function updateIcon(eff) {
      if (!themeIcon) return;
      if (current === 'auto') {
        themeIcon.innerHTML =
          '<circle cx="12" cy="12" r="9"/>' +
          '<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>';
      } else if (eff === 'dark') {
        themeIcon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
      } else {
        themeIcon.innerHTML =
          '<circle cx="12" cy="12" r="4"/>' +
          '<path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
      }
    }

    function set(mode) {
      if (mode !== 'auto' && mode !== 'dark' && mode !== 'light') return;
      current = mode;
      try { localStorage.setItem(STORAGE_KEY, mode); } catch (e) {}
      apply();
    }

    function cycle() {
      const order = ['auto', 'dark', 'light'];
      const i = order.indexOf(current);
      set(order[(i + 1) % order.length]);
      return current;
    }

    function init() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (saved === 'auto' || saved === 'dark' || saved === 'light') current = saved;
      if (mql && mql.addEventListener) mql.addEventListener('change', apply);
      else if (mql && mql.addListener) mql.addListener(apply);
      apply();
    }

    return {
      init, set, cycle,
      get: () => current,
      effective,
      onChange: (fn) => listeners.push(fn)
    };
  })();

  /* ------------------------------------------------------------
     3. TERMINAL SCHEMES (xterm.js color maps)
     ------------------------------------------------------------ */
  function mkScheme(displayName, bg, fg, cursor, p) {
    return {
      name: displayName,
      theme: {
        background: bg, foreground: fg, cursor: cursor, cursorAccent: bg,
        selectionBackground: 'rgba(255,255,255,0.25)',
        black: p[0],  red: p[1],  green: p[2],  yellow: p[3],
        blue: p[4],   magenta: p[5], cyan: p[6], white: p[7],
        brightBlack: p[8],  brightRed: p[9],  brightGreen: p[10], brightYellow: p[11],
        brightBlue: p[12],  brightMagenta: p[13], brightCyan: p[14], brightWhite: p[15]
      }
    };
  }

  /* ------------------------------------------------------------

     ------------------------------------------------------------ */
  function showToast(text, kind) {
    if (!toastsEl) return;
    const el = document.createElement('div');
    el.className = 'hx-toast' + (kind ? ' ' + kind : '');
    el.textContent = text;
    toastsEl.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2400);
  }

  async function showNotification(title, body) {
    try {
      if (typeof Notification === 'undefined') { showToast(title + ' — ' + body, 'warn'); return false; }
      let perm = Notification.permission;
      if (perm === 'default') perm = await Notification.requestPermission();
      if (perm === 'granted') { new Notification(title, { body }); showToast('🔔 ' + title, 'ok'); return true; }
      showToast('🔔 ' + title + ' — ' + body, 'warn');
      return false;
    } catch (e) { showToast('🔔 ' + title, 'warn'); return false; }
  }

  function applyEffectiveScheme(eff) {
    if (state.schemeLock) return;
    let name = 'hex';
    if (ThemeEngine.get() === 'auto') name = AUTO_SCHEME[eff] || 'hex';
    else if (ThemeEngine.get() === 'light') name = 'ice';
    else name = 'hex';

    if (SCHEMES[name]) {
      term.options.theme = SCHEMES[name].theme;
      ROOT.style.background = SCHEMES[name].theme.background;
      ROOT.setAttribute('data-scheme-tone', eff === 'light' ? 'light' : 'dark');
    }
  }

  ThemeEngine.onChange((eff) => {

    yel: '\x1b[38;2;255;214;92m',
    wht: '\x1b[38;2;226;246;255m',
    gry: '\x1b[38;2;110;136;153m'
  };
  const C = ANSI;

  function write(s) { term.write(s); }
  function println(s) { term.write((s === undefined ? '' : s) + '\r\n'); }

  function startSpinner(label) {
    const frames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    let i = 0;
    const id = setInterval(() => {
      term.write('\x1b[2K\r' + C.cyn + frames[i++ % frames.length] + C.r +
                 ' ' + C.gry + (label || 'working') + C.r);
    }, 72);
    return { stop() { clearInterval(id); term.write('\x1b[2K\r'); } };
  }

  async function typeOut(text, delay) {
    const d = (typeof delay === 'number') ? delay : 6;
    for (let i = 0; i < text.length; i++) {
      if (state.interrupt) { term.write(C.r); break; }
      term.write(text[i]);
      if (d > 0) await sleep(d);
    }
    term.write('\r\n');
  }

  async function progressBar(label) {
    const W = 12;
    for (let i = 0; i <= 100; i += 4) {
      if (state.interrupt) break;
      const filled = Math.round((i / 100) * W);
      const bar = '█'.repeat(filled) + '░'.repeat(W - filled);
      term.write('\x1b[2K\r' + C.grn + '[' + bar + ']' + C.r +
                 ' ' + pad(i, 3) + '% ' + C.gry + (label || '') + C.r);
      await sleep(26);
    }
    term.write('\x1b[2K\r');
  }

  /* ------------------------------------------------------------
     14. GENERIC PROXY GET (kept for fetch command)
     ------------------------------------------------------------ */
  async function proxyFetch(url) {
    const total = PROXIES_GET.length;
    for (let i = 0; i < total; i++) {
      if (state.interrupt) return { ok: false, aborted: true };
      const target = PROXIES_GET[i].url(url);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      term.write('\x1b[2K\r' + C.gry + '⇢ ' + PROXIES_GET[i].label + ' (' + (i + 1) + '/' + total + ')' + C.r);
      try {
        const res = await fetch(target, { method:'GET', signal:controller.signal, headers:{ 'Accept':'*/*' } });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        term.write('\x1b[2K\r');
        return { ok: true, text, via: PROXIES_GET[i].label };
      } catch (err) { clearTimeout(timer); }
    }
    term.write('\x1b[2K\r');
    return { ok: false };
  }

  /* ------------------------------------------------------------
     15. LIVE LLM STREAMING  (FIXED for Pollinations.ai)
     ------------------------------------------------------------ */

  /* --- helpers for parsing OpenAI / SSE payloads --- */
  function extractDeltaFromObj(obj) {
    if (!obj) return '';
    const ch = obj.choices && obj.choices[0];
    if (ch) {
      if (ch.delta && typeof ch.delta.content === 'string') return ch.delta.content;
      if (ch.message && typeof ch.message.content === 'string') return ch.message.content;
      if (typeof ch.text === 'string') return ch.text;
    }
    if (typeof obj.delta === 'string') return obj.delta;
    if (typeof obj.text === 'string') return obj.text;
    if (typeof obj.content === 'string') return obj.content;
    return '';
  }

  function extractFullFromObj(obj) {
    if (!obj) return '';
    if (typeof obj === 'string') return obj;
    const ch = obj.choices && obj.choices[0];
    if (ch) {
      if (ch.message && typeof ch.message.content === 'string') return ch.message.content;
      if (typeof ch.text === 'string') return ch.text;
      if (ch.delta && typeof ch.delta.content === 'string') return ch.delta.content;
    }
    if (typeof obj.text === 'string') return obj.text;
    if (typeof obj.content === 'string') return obj.content;
    if (typeof obj.response === 'string') return obj.response;
    return '';
  }

  function parseSseBuffer(buf) {
    /* returns { text, done, leftover } */
    let text = '';
    let done = false;
    let idx;
    while ((idx = buf.indexOf('\n')) !== -1) {
      const line = buf.slice(0, idx).replace(/\r$/, '');
      buf = buf.slice(idx + 1);
      if (!line || line.charAt(0) === ':') continue;
      if (line.indexOf('data:') === 0) {
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') { done = true; continue; }
        try {
          const obj = JSON.parse(payload);
          text += extractDeltaFromObj(obj);
        } catch (e) {}
      } else {
        /* Some servers send raw JSON lines */
        try {
          const obj = JSON.parse(line);
          text += extractDeltaFromObj(obj);
        } catch (e) {}
      }
    }
    return { text, done, leftover: buf };
  }

  /* --- Attempt a POST streaming request --- */
  async function tryPostStream(url, body, onToken, onStart, label) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 25000);
    try {
      const res = await fetch(url, {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'text/event-stream, application/json'
        },
        body: JSON.stringify(body)
      });
      clearTimeout(timer);
      if (!res.ok) return { ok:false, aborted:false };

      const ctype = (res.headers.get('content-type') || '').toLowerCase();

      /* --- Non-streaming JSON response --- */
      if (ctype.indexOf('application/json') !== -1 && !res.body) {
        const data = await res.json();
        const text = extractFullFromObj(data);
        if (!text) return { ok:false };
        if (onStart) onStart(label);
        if (onToken) onToken(text);
        return { ok:true, text, via:label };
      }

      /* --- Fallback when ReadableStream isn't available --- */
      if (!res.body || typeof res.body.getReader !== 'function') {
        const raw = await res.text();
        /* try JSON */
        let text = '';
        try { text = extractFullFromObj(JSON.parse(raw)); } catch (e) {}
        if (!text) {
          const parsed = parseSseBuffer(raw);
          text = parsed.text;
        }
        if (!text) text = raw;
        if (!text || !text.trim()) return { ok:false };
        if (onStart) onStart(label);
        if (onToken) onToken(text);
        return { ok:true, text, via:label };
      }

      /* --- Streaming with ReadableStream --- */
      if (onStart) onStart(label);

      const reader  = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let full   = '';
      let sawSse = false;

      while (true) {
        if (state.interrupt) { try { reader.cancel(); } catch (e) {} break; }
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream:true });

        /* If it's not SSE, treat the whole buffer as text later */
        if (buffer.indexOf('data:') === 0 || buffer.indexOf('data: ') !== -1) sawSse = true;

        if (sawSse) {
          const parsed = parseSseBuffer(buffer);
          buffer = parsed.leftover;
          if (parsed.text) { full += parsed.text; if (onToken) onToken(parsed.text); }
          if (parsed.done) { try { reader.cancel(); } catch (e) {} break; }
        } else {
          /* Plain text stream — just accumulate */
          /* But if it looks like JSON, try once we've got something */
          if (buffer.length > 32 && (buffer.trim()[0] === '{' || buffer.trim()[0] === '[')) {
            /* leave in buffer, wait for done */
          } else {
            /* flush as plain text */
            full += buffer;
            if (onToken) onToken(buffer);
            buffer = '';
          }
        }
      }

      /* final flush */
      if (buffer.trim()) {
        if (sawSse) {
          const parsed = parseSseBuffer(buffer + '\n');
          if (parsed.text) { full += parsed.text; if (onToken) onToken(parsed.text); }
        } else {
          let txt = buffer;
          try {
            const obj = JSON.parse(buffer);
            const ext = extractFullFromObj(obj);
            if (ext) txt = ext;
          } catch (e) {}
          full += txt;
          if (onToken) onToken(txt);
        }
      }

      if (full) return { ok:true, text:full, via:label };
      return { ok:false };
    } catch (err) {
      clearTimeout(timer);
      return { ok:false, aborted: state.interrupt };
    }
  }

  /* --- Attempt a GET plain-text request --- */
  async function tryGetText(url, onToken, onStart, label) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 25000);
    try {
      const res = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'text/plain, application/json, */*' } });
      clearTimeout(timer);
      if (!res.ok) return { ok:false, aborted:false };

      let text = await res.text();
      if (!text) return { ok:false };

      /* Unwrap if the response is JSON */
      const trimmed = text.trim();
      if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
        try {
          const obj = JSON.parse(trimmed);
          const ext = extractFullFromObj(obj);
          if (ext) text = ext;
        } catch (e) {}
      }

      if (!text || !text.trim()) return { ok:false };

      if (onStart) onStart(label);

      /* Simulate streaming for smooth UX */
      const chunks = text.match(/[\s\S]{1,4}/g) || [text];
      for (let i = 0; i < chunks.length; i++) {
        if (state.interrupt) break;
        if (onToken) onToken(chunks[i]);
        await sleep(6);
      }

      return { ok:true, text, via:label };
    } catch (err) {
      clearTimeout(timer);
      return { ok:false, aborted: state.interrupt };
    }
  }

  /* --- Main entry point: try POST streaming → GET fallback --- */
  async function streamHexAIReply(userText, onToken, onStart) {
    if (!state.aiLive) return { ok:false, error:'offline mode' };

    /* --- Phase 1: POST /openai (streaming) --- */
    const postBody = {
      model: HEX_AI_MODEL,
      messages: conversation.slice(),
      stream: true,
      temperature: 0.7,
      private: true,
      referrer: HEX_AI_REFERRER
    };

    const postTargets = [
      { label:'pollinations-direct', url: HEX_AI_ENDPOINT }
    ].concat(
      PROXIES_POST.map((p) => ({ label: p.label, url: p.url(HEX_AI_ENDPOINT) }))
    );

    for (const t of postTargets) {
      if (state.interrupt) return { ok:false, error:'aborted' };
      const r = await tryPostStream(t.url, postBody, onToken, onStart, t.label);
      if (r.ok) return r;
      if (r.aborted) return r;
    }

    /* --- Phase 2: GET plain-text fallback (very reliable) --- */
    const promptLines = ['System: ' + HEX_AI_SYSTEM];
    for (let i = 1; i < conversation.length; i++) {
      const m = conversation[i];
      promptLines.push((m.role === 'user' ? 'User: ' : 'Assistant: ') + m.content);
    }
    promptLines.push('Assistant:');
    const prompt = promptLines.join('\n');

    /* Pollinations GET accepts the prompt URL-encoded in the path,
       with model & referrer as query params. */
    const qs = '?model=' + encodeURIComponent(HEX_AI_MODEL) +
               '&referrer=' + encodeURIComponent(HEX_AI_REFERRER);
    const rawGetUrl = HEX_AI_GET_BASE + encodeURIComponent(prompt) + qs;

    const getTargets = [
      { label:'pollinations-get', url: rawGetUrl }
    ].concat(
      PROXIES_GET.map((p) => ({ label: p.label, url: p.url(rawGetUrl) }))
    );

    for (const t of getTargets) {
      if (state.interrupt) return { ok:false, error:'aborted' };
      const r = await tryGetText(t.url, onToken, onStart, t.label);
      if (r.ok) return r;
      if (r.aborted) return r;
    }

    return { ok:false, error:'all endpoints unreachable' };
  }

  /* ------------------------------------------------------------
     16. PROMPT + LINE EDITOR
     ------------------------------------------------------------ */
  function promptStr() {
    return C.grn + C.b + state.user + C.r +
           C.gry + '@' + C.r +
           C.cyn + C.b + state.host + C.r +
           C.gry + ':' + C.r +
           C.blu + C.b + state.cwd + C.r +
           C.grn + ' $ ' + C.r;
  }
  function printPrompt() { if (!state.closed) term.write(promptStr()); }
  function redraw() {
    term.write('\x1b[2K\r' + promptStr() + lineBuf);
    const back = lineBuf.length - cursor;
    if (back > 0) term.write('\x1b[' + back + 'D');
  }
  function insertText(str) {
    if (!str) return;
    lineBuf = lineBuf.slice(0, cursor) + str + lineBuf.slice(cursor);
    cursor += str.length;
    redraw();
  }
  function doBackspace() {
    if (cursor === 0) return;
    lineBuf = lineBuf.slice(0, cursor - 1) + lineBuf.slice(cursor);
    cursor--; redraw();
  }
  function doDelete() {
    if (cursor >= lineBuf.length) return;
    lineBuf = lineBuf.slice(0, cursor) + lineBuf.slice(cursor + 1);
    redraw();
  }
  function moveLeft()  { if (cursor > 0) { cursor--; redraw(); } }
  function moveRight() { if (cursor < lineBuf.length) { cursor++; redraw(); } }
  function historyUp() {
    if (!state.history.length) return;
    if (state.hIndex > 0) state.hIndex--;
    lineBuf = state.history[state.hIndex] || '';
    cursor = lineBuf.length; redraw();
  }
  function historyDown() {
    if (!state.history.length) return;
    if (state.hIndex < state.history.length - 1) {
      state.hIndex++;
      lineBuf = state.history[state.hIndex] || '';
    } else {
      state.hIndex = state.history.length;
      lineBuf = '';
    }
    cursor = lineBuf.length; redraw();
  }
  function autoComplete() {
    /* tiny completion: expand known commands from the current word */
    const before = lineBuf.slice(0, cursor);
    const m = before.match(/(\S+)$/);
    if (!m) return;
    const word = m[1];
    if (!word) return;
    const all = Object.keys(BUILTIN_COMMANDS);
    const hits = all.filter((c) => c.indexOf(word) === 0 && c !== word);
    if (!hits.length) return;
    if (hits.length === 1) {
      const done = hits[0];
      lineBuf = lineBuf.slice(0, cursor - word.length) + done + lineBuf.slice(cursor);
      cursor += done.length - word.length;
      redraw();
      return;
    }
    println('');
    hits.forEach((h) => println('  ' + h));
    printPrompt(); term.write(lineBuf);
    if (lineBuf.length - cursor > 0) term.write('\x1b[' + (lineBuf.length - cursor) + 'D');
  }

  /* ------------------------------------------------------------
     17. INPUT HANDLING
     ------------------------------------------------------------ */
  function handleInput(data) {
    if (state.menuActive) {
      const h = state.menuActive;
      state.menuActive = null;
      h(data);
      return;
    }
    if (state.busy) {
      if (data === '\x03' || data === '\x1b') state.interrupt = true;
      return;
    }
    if (ctrlArmed) {
      ctrlArmed = false; updateModKeys();
      if (data.length === 1) {
        const code = data.toUpperCase().charCodeAt(0);
        if (code >= 64 && code < 128) { handleInput(String.fromCharCode(code - 64)); return; }
      }
    }
    if (altArmed) {
      altArmed = false; updateModKeys();
      if (data.length === 1) { handleInput('\x1b' + data); return; }
    }
    switch (data) {
      case '\r': case '\n':  submit(); return;
      case '\u007f': case '\b': doBackspace(); return;
      case '\x03': println('^C'); lineBuf=''; cursor=0; printPrompt(); return;
      case '\x0c': term.clear(); redraw(); return;
      case '\t': autoComplete(); return;
      case '\x1b[A': historyUp();   return;
      case '\x1b[B': historyDown(); return;
      case '\x1b[C': moveRight();   return;
      case '\x1b[D': moveLeft();    return;
      case '\x1b[H': case '\x1b[1~': cursor = 0; redraw(); return;
      case '\x1b[F': case '\x1b[4~': cursor = lineBuf.length; redraw(); return;
      case '\x1b[3~': doDelete(); return;
      case '\x1b[5~': term.scrollPages(-1); return;
      case '\x1b[6~': term.scrollPages(1);  return;
      case '\x1b': return;
    }
    if (data.length > 1 && data.charCodeAt(0) !== 27) {
      insertText(data.replace(/[\r\n\t]+/g, ' '));
      return;
    }
    if (data.length === 1) {
      const code = data.charCodeAt(0);
      if (code >= 32 && code !== 127) insertText(data);
    }
  }

  term.onData(handleInput);

  term.attachCustomKeyEventHandler((e) => {
    if (e.type === 'keydown' && e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      if (term.hasSelection()) return false;
    }
    return true;
  });

  /* ------------------------------------------------------------
     18. COMMAND SUBMITTER
     ------------------------------------------------------------ */
  async function submit() {
    const raw = lineBuf;
    term.write('\r\n');
    lineBuf = ''; cursor = 0;
    if (raw.trim()) state.history.push(raw);
    state.hIndex = state.history.length;

    state.busy = true;
    state.interrupt = false;
    setStatus('busy');

    try { await runCommand(raw.trim()); }
    catch (err) { println(C.red + 'hexai: ' + (err && err.message ? err.message : String(err)) + C.r); }

    state.busy = false;
    state.interrupt = false;
    setStatus('online');
    if (!state.closed) printPrompt();
  }

  function setStatus(txt) {
    if (statusEl) statusEl.textContent = txt;
    if (statusPill) statusPill.classList.toggle('ai', txt === 'ai');
  }

  /* ------------------------------------------------------------
     19. TOKENIZER
     ------------------------------------------------------------ */
  function tokenize(str) {
    const out = [];
    let cur = '';
    let quote = null;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (quote) { if (ch === quote) quote = null; else cur += ch; }
      else if (ch === '"' || ch === "'") quote = ch;
      else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ''; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }

  /* ============================================================
     20. THEME COMMAND
     ============================================================ */
  async function cmdTheme(args) {
    const sub = (args[0] || '').toLowerCase();

    if (!sub || sub === 'status') {
      println('');
      println(C.grn + C.b + '  THEME STATUS' + C.r);
      println(C.gry + '  ─────────────────────────────────────────' + C.r);
      println('  ' + C.cyn + 'mode       : ' + C.r + C.wht + ThemeEngine.get() + C.r);
      println('  ' + C.cyn + 'effective  : ' + C.r + C.wht + ThemeEngine.effective() + C.r);
      println('  ' + C.cyn + 'scheme     : ' + C.r + C.wht + state.scheme +
              (state.schemeLock ? '' : ' (auto)') + C.r);
      println('  ' + C.cyn + 'system     : ' + C.r + C.wht +
              ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'prefers dark' : 'prefers light') + C.r);
      println('');
      println(C.gry + '  usage: theme auto | dark | light | status' + C.r);
      println('');
      return;
    }

    if (sub === 'auto' || sub === 'dark' || sub === 'light') {
      ThemeEngine.set(sub);
      showToast('🎨 Theme: ' + sub, 'ok');
      println(C.grn + '✔ theme → ' + C.grn + C.b + sub + C.r +
              C.gry + (sub === 'auto' ? ' (follows device preference)' : '') + C.r);
      return;
    }

    if (sub === 'cycle' || sub === 'toggle') {
      const next = ThemeEngine.cycle();
      showToast('🎨 Theme: ' + next, 'ok');
      println(C.grn + '✔ theme → ' + C.grn + C.b + next + C.r);
      return;
    }

    println(C.red + 'theme: unknown mode "' + sub + '"' + C.r);
    println(C.gry + 'usage: theme auto | dark | light | status | cycle' + C.r);
  }

  /* ============================================================
     21. TERMUX:API COMMANDS
     ============================================================ */
  async function cmdTermuxApi(args) {
    const sub = args[0] || 'help';
    const rest = args.slice(1);

    if (!state.installed['termux-api']) {
      println('');
      println(C.red + '  termux-api: command not found' + C.r);
      println(C.gry + '  hint: run ' + C.grn + '"pkg install termux-api"' + C.gry + ' first.' + C.r);
      println('');
      return;
    }

    switch (sub) {
      case 'battery-status': {
        const json = rest.indexOf('--json') !== -1;
        try {
          let level = null, charging = null;
          if (navigator.getBattery) {
            const b = await navigator.getBattery();
            level = Math.round(b.level * 100);
            charging = b.charging;
          }
          if (level === null) { println(C.yel + 'battery API unavailable on this browser' + C.r); return; }
          if (json) {
            println('{"health":"good","percentage":' + level +
                    ',"plugged":"' + (charging ? 'AC' : 'UNPLUGGED') +
                    '","status":"' + (charging ? 'CHARGING' : 'DISCHARGING') + '","temperature":0.0}');
          } else {
            println('');
            println(C.grn + C.b + '  BATTERY STATUS' + C.r);
            println('  ' + C.cyn + 'percentage : ' + C.r + C.wht + level + '%' + C.r);
            println('  ' + C.cyn + 'status     : ' + C.r + (charging ? C.grn + 'CHARGING' : C.yel + 'DISCHARGING') + C.r);
            println('  ' + C.cyn + 'health     : ' + C.r + C.wht + 'good' + C.r);
            println('');
          }
        } catch (e) { println(C.red + 'battery: ' + e.message + C.r); }
        return;
      }
      case 'vibrate': {
        const ms = parseInt(rest[0] || '500', 10) || 500;
        if (navigator.vibrate) {
          const ok = navigator.vibrate(ms);
          println(ok ? C.grn + '✔ vibrating ' + ms + 'ms' + C.r
                     : C.yel + '⚠ vibration was blocked by the browser' + C.r);
        } else println(C.yel + '⚠ vibration API unavailable on this device' + C.r);
        return;
      }
      case 'clipboard-get': {
        try { const txt = await navigator.clipboard.readText();
              println(txt || C.gry + '(clipboard empty)' + C.r); }
        catch (e) { println(C.red + 'clipboard-get: permission denied or unsupported' + C.r); }
        return;
      }
      case 'clipboard-set': {
        const txt = rest.join(' ');
        if (!txt) { println(C.yel + 'usage: termux-clipboard-set <text>' + C.r); return; }
        try { await navigator.clipboard.writeText(txt);
              println(C.grn + '✔ copied ' + txt.length + ' chars to clipboard' + C.r);
              showToast('📋 Copied to clipboard', 'ok'); }
        catch (e) { println(C.red + 'clipboard-set: ' + e.message + C.r); }
        return;
      }
      case 'toast': {
        const text = rest.join(' ') || 'Hello from HEX AI';
        showToast(text, 'ok');
        println(C.grn + '✔ toast shown: ' + text + C.r);
        return;
      }
      case 'notification': {
        let title = 'HEX AI', body = 'Notification from Termux:API';
        const t = rest.indexOf('--title');
        const c = rest.indexOf('--content');
        if (t !== -1 && rest[t + 1]) title = rest[t + 1];
        if (c !== -1 && rest[c + 1]) body  = rest[c + 1];
        await showNotification(title, body);
        return;
      }
      case 'notification-remove': { println(C.grn + '✔ notification removed' + C.r); return; }
      case 'tts-speak': {
        const text = rest.join(' ') || 'Hello from HEX AI';
        if (typeof speechSynthesis === 'undefined') {
          println(C.yel + 'tts-speak: speech synthesis unsupported' + C.r); return;
        }
        try { const u = new SpeechSynthesisUtterance(text);
              u.rate = 1.0; u.pitch = 1.0; speechSynthesis.speak(u);
              println(C.grn + '✔ speaking: "' + text + '"' + C.r); }
        catch (e) { println(C.red + 'tts-speak: ' + e.message + C.r); }
        return;
      }
      case 'tts-engines': { println('com.hexai.tts.engine'); return; }
      case 'location': {
        if (!navigator.geolocation) { println(C.red + 'location: geolocation API unavailable' + C.r); return; }
        println(C.gry + 'requesting location permission…' + C.r);
        await new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => { println('');
              println(C.grn + C.b + '  LOCATION' + C.r);
              println('  ' + C.cyn + 'latitude  : ' + C.r + C.wht + pos.coords.latitude.toFixed(6) + C.r);
              println('  ' + C.cyn + 'longitude : ' + C.r + C.wht + pos.coords.longitude.toFixed(6) + C.r);
              println('  ' + C.cyn + 'accuracy  : ' + C.r + C.wht + pos.coords.accuracy.toFixed(1) + ' m' + C.r);
              println(''); resolve(); },
            (err) => { println(C.red + 'location: ' + err.message + C.r); resolve(); },
            { enableHighAccuracy:true, timeout:12000 });
        });
        return;
      }
      case 'wifi-connectioninfo': {
        const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        println('');
        println(C.grn + C.b + '  WIFI / NETWORK INFO' + C.r);
        if (c) {
          println('  ' + C.cyn + 'type       : ' + C.r + C.wht + (c.effectiveType || 'unknown') + C.r);
          println('  ' + C.cyn + 'downlink   : ' + C.r + C.wht + (c.downlink || '?') + ' Mbps' + C.r);
          println('  ' + C.cyn + 'rtt        : ' + C.r + C.wht + (c.rtt || '?') + ' ms' + C.r);
          println('  ' + C.cyn + 'saved      : ' + C.r + C.wht + (c.saveData ? 'yes' : 'no') + C.r);
        } else {
          println('  ' + C.wht + 'online     : ' + (navigator.onLine ? 'yes' : 'no') + C.r);
          println('  ' + C.gry + '(Network Information API unavailable)' + C.r);
        }
        println('');
        return;
      }
      case 'wifi-scaninfo': {
        println('[{"ssid":"HEX-NET","bssid":"00:11:22:33:44:55","frequency":2412,"level":-45},' +
                '{"ssid":"GuestWiFi","bssid":"66:77:88:99:aa:bb","frequency":2437,"level":-72}]');
        return;
      }
      case 'wifi-enable': { println(C.grn + '✔ wifi toggled (simulated)' + C.r); return; }
      case 'share': {
        const text = rest.join(' ') || 'Shared from HEX AI terminal';
        if (navigator.share) {
          try { await navigator.share({ title:'HEX AI', text });
                println(C.grn + '✔ shared' + C.r); }
          catch (e) { println(C.gry + 'share cancelled' + C.r); }
        } else {
          println(C.yel + '⚠ Web Share API unavailable — copying to clipboard instead' + C.r);
          try { await navigator.clipboard.writeText(text); showToast('📋 Copied', 'ok'); } catch (e) {}
        }
        return;
      }
      case 'dialog': {
        const prompt_ = rest.join(' ') || 'Enter value';
        const val = window.prompt(prompt_, '');
        if (val === null) { println('{"code":-1,"text":""}'); return; }
        println('{"code":0,"text":"' + val.replace(/"/g, '\\"') + '"}');
        return;
      }
      case 'fingerprint': {
        if (window.PublicKeyCredential) {
          println(C.grn + '✔ authentication successful (WebAuthn available)' + C.r);
          println('{"auth_result":1,"errors":""}');
        } else {
          println(C.yel + '⚠ biometric API unavailable' + C.r);
          println('{"auth_result":0,"errors":"unsupported"}');
        }
        return;
      }
      case 'sensor': {
        if (typeof DeviceOrientationEvent === 'undefined') {
          println(C.yel + '⚠ device motion sensors unavailable' + C.r); return;
        }
        println(C.gry + 'reading device orientation for 1.5s…' + C.r);
        await new Promise((resolve) => {
          let got = false;
          const h = (e) => {
            got = true;
            println('{"sensor":"accelerometer","values":[' +
                    (e.alpha || 0).toFixed(2) + ',' +
                    (e.beta  || 0).toFixed(2) + ',' +
                    (e.gamma || 0).toFixed(2) + ']}');
          };
          window.addEventListener('deviceorientation', h);
          setTimeout(() => {
            window.removeEventListener('deviceorientation', h);
            if (!got) println(C.yel + '{"sensor":"accelerometer","values":[]}' + C.r);
            resolve();
          }, 1500);
        });
        return;
      }
      case 'camera-photo': {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          println(C.red + 'camera-photo: getUserMedia unavailable' + C.r); return;
        }
        try {
          println(C.gry + 'requesting camera permission…' + C.r);
          const s = await navigator.mediaDevices.getUserMedia({ video:true });
          s.getTracks().forEach((t) => t.stop());
          println(C.grn + '✔ camera accessible — photo saved to ~/photo.jpg' + C.r);
        } catch (e) { println(C.red + 'camera-photo: ' + e.name + ' — ' + e.message + C.r); }
        return;
      }
      case 'torch': {
        const on = (rest[0] || '').toLowerCase() !== 'false';
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          try {
            const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
            const track = s.getVideoTracks()[0];
            if (track && track.getCapabilities && track.getCapabilities().torch) {
              await track.applyConstraints({ advanced:[{ torch:on }] });
              println(C.grn + '✔ torch ' + (on ? 'ON' : 'OFF') + C.r);
            } else println(C.yel + '⚠ device has no torch capability' + C.r);
            setTimeout(() => s.getTracks().forEach((t) => t.stop()), 800);
          } catch (e) { println(C.red + 'torch: ' + e.name + C.r); }
        } else println(C.yel + '⚠ torch API unavailable' + C.r);
        return;
      }
      case 'volume': {
        const stream = rest[0] || 'music';
        println('{"stream":"' + stream + '","volume":' + (rest[1] || 7) +
                ',"max_volume":15,"muted":false}');
        return;
      }
      case 'brightness': { println(C.grn + '✔ brightness ' + (rest[0] || '128') + ' (simulated)' + C.r); return; }
      case 'telephony-deviceinfo': {
        println('{"network_operator_name":"HEX Mobile","network_country_iso":"IN",' +
                '"network_type":13,"device_id":"hexai-web-' +
                Math.floor(Math.random()*99999) + '","sim_state":"ready"}');
        return;
      }
      case 'telephony-cellinfo': {
        println('[{"type":"gsm","cid":12345,"lac":678,"signalStrength":-67,"dbm":-67}]');
        return;
      }
      case 'telephony-call': {
        const num = rest[0] || '0000000000';
        println(C.grn + '✔ dialing ' + num + ' (simulated)' + C.r);
        window.location.href = 'tel:' + num;
        return;
      }
      case 'contact-list': { println('[]');
        println(C.gry + '(contact list requires Termux:API Android app on a real device)' + C.r); return; }
      case 'sms-list': { println('[]'); println(C.gry + '(SMS access requires Termux:API Android app)' + C.r); return; }
      case 'sms-send': { println(C.grn + '✔ SMS queued (requires Android Termux:API app)' + C.r); return; }
      case 'call-log': { println('[]'); return; }
      case 'media-player': { println(C.grn + '✔ media-player: ' + (rest.join(' ') || 'info') + ' (simulated)' + C.r); return; }
      case 'media-scan': { println(C.grn + '✔ media scan complete' + C.r); return; }
      case 'audio-info': { println('{"stream":"music","volume":7,"max_volume":15}'); return; }
      case 'microphone-record': {
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio:true });
          s.getTracks().forEach((t) => t.stop());
          println(C.grn + '✔ microphone accessible' + C.r);
        } catch (e) { println(C.red + 'microphone-record: ' + e.name + C.r); }
        return;
      }
      case 'wallpaper': { println(C.grn + '✔ wallpaper set (simulated)' + C.r); return; }
      case 'storage-get': { println(C.grn + '✔ storage-get requested' + C.r); return; }
      case 'download': {
        const url = rest[0];
        if (!url) { println(C.yel + 'usage: termux-download <url>' + C.r); return; }
        const a = document.createElement('a');
        a.href = url; a.download = ''; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(() => a.remove(), 400);
        println(C.grn + '✔ download started for ' + url + C.r);
        showToast('⬇ Download started', 'ok');
        return;
      }
      case 'open': {
        const url = rest[0];
        if (!url) { println(C.yel + 'usage: termux-open <url|file>' + C.r); return; }
        window.open(/^https?:/.test(url) ? url : ('https://' + url), '_blank', 'noopener');
        println(C.grn + '✔ opened externally' + C.r);
        return;
      }
      case 'open-url': {

        window.open(url, '_blank', 'noopener');

      case 'share-file': { println(C.grn + '✔ file share requested' + C.r); return; }
      case 'usb': { if (navigator.usb) println('[]'); else println(C.yel + '⚠ WebUSB unavailable' + C.r); return; }
      case 'infrared-frequencies': { println('[]'); return; }
      case 'job-scheduler': { println(C.grn + '✔ job-scheduler registered (simulated)' + C.r); return; }
      case 'keystore': { println(C.grn + '✔ keystore operation completed (simulated)' + C.r); return; }

      default: {
        println('');
        println(C.grn + C.b + '  TERMUX:API COMMANDS' + C.r);
        println(C.gry + '  ─────────────────────────────────────────' + C.r);
        const list = [

  async function cmdTermuxStyle(args) {
    const sub = (args[0] || '').toLowerCase();
    if (sub === 'set' && args[1])   return applyScheme(args[1], true);
    if (sub === 'font' && args[1])  return applyFont(args[1], true);
    if (sub === 'list')             return listSchemes();
    if (sub === 'fonts')            return listFonts();
    if (sub === 'random')           return applyRandomScheme();
    await styleMenu();
  }

  function applyScheme(name, loud) {
    const key = name.toLowerCase().replace(/\s+/g, '-');
    if (!SCHEMES[key]) {
      println(C.red + 'termux-style: unknown color scheme "' + name + '"' + C.r);
      println(C.gry + 'run "termux-style list" to see all schemes.' + C.r);
      return;
    }
    state.scheme = key;
    state.schemeLock = true;
    term.options.theme = SCHEMES[key].theme;
    ROOT.style.background = SCHEMES[key].theme.background;
    if (loud) {
      println(C.grn + '✔ color scheme → ' + C.grn + C.b + SCHEMES[key].name + C.r);
      showToast('🎨 ' + SCHEMES[key].name, 'ok');
    }
    try { localStorage.setItem('hexai.scheme', key); } catch (e) {}
  }

  function applyFont(id, loud) {
    const f = FONTS.find((x) => x.id === id);
    if (!f) {
      println(C.red + 'termux-style: unknown font "' + id + '"' + C.r);
      println(C.gry + 'run "termux-style fonts" to see all fonts.' + C.r);
      return;
    }
    state.font = id;
    term.options.fontFamily = f.css + ', monospace';
    setTimeout(fitNow, 60);
    if (loud) {
      println(C.grn + '✔ font → ' + C.grn + C.b + f.label + C.r);
      showToast('🔤 ' + f.label, 'ok');
    }
    try { localStorage.setItem('hexai.font', id); } catch (e) {}
  }

  function applyRandomScheme() {
    const list = SCHEME_NAMES.filter((n) => n !== state.scheme);
    applyScheme(list[Math.floor(Math.random() * list.length)], true);
  }

  async function styleMenuColors() {
    println('');
    println(C.grn + C.b + '  SELECT COLOR-SCHEME' + C.r);
    println(C.gry + '  ─────────────────────────────────────────' + C.r);
    SCHEME_NAMES.forEach((id, i) => {
      const active = id === state.scheme;
      println('  ' + (active ? C.grn + '▸' : C.gry + ' ') + ' ' +
              C.gry + pad(i + 1, 3) + C.r + '  ' +
              (active ? C.grn + C.b + SCHEMES[id].name + C.r : C.wht + SCHEMES[id].name + C.r));
    });
    println('');
    println(C.gry + '  enter number (or "q" to go back)' + C.r);
    term.write(C.grn + '  [Color #]: ' + C.r);

    const k = await waitKey();
    term.write('\r\n');
    if (k === 'q' || k === 'esc') return;
    let buf = /[0-9]/.test(k) ? k : '';
    if (!buf) { println(C.yel + '  invalid input' + C.r); return; }
    while (true) {
      term.write(C.grn + '  [Color #]: ' + C.r + buf);
      const more = await waitKey();
      if (more === 'enter') break;
      if (more === 'esc') { term.write('\r\n'); return; }
      if (more.length === 1 && /[0-9]/.test(more)) { buf += more; term.write('\x1b[2K\r'); continue; }
      break;
    }
    const idx = parseInt(buf, 10) - 1;
    term.write('\r\n');
    if (isNaN(idx) || idx < 0 || idx >= SCHEME_NAMES.length) { println(C.red + '  invalid selection' + C.r); return; }
    applyScheme(SCHEME_NAMES[idx], true);
    println(C.gry + '  [*] Reloading Settings...' + C.r);
    println(C.grn + '  [*] Applied Successfully.' + C.r);
    await sleep(250);
  }

  /* waitKey — returns the next single keystroke (or "enter"/"esc") */
  function waitKey() {
    return new Promise((resolve) => {
      state.menuActive = (data) => {
        if (data === '\r' || data === '\n') return resolve('enter');
        if (data === '\x1b') return resolve('esc');
        if (data === '\u007f') return resolve('back');
        if (data.length === 1) return resolve(data.toLowerCase());
        resolve('');
      };
    });
  }

  async function cmdAI(args) {
    if (args[0] === '--clear' || args[0] === '--reset') {

    }

      println('  ' + C.cyn + 'api key  : ' + C.r + C.grn + 'none required' + C.r);
      println('  ' + C.cyn + 'stream   : ' + C.r + C.wht + 'yes (SSE) + GET fallback' + C.r);
      println('  ' + C.cyn + 'memory   : ' + C.r + C.wht + (conversation.length - 1) + ' / ' + MAX_TURNS + ' turns' + C.r);
      println('  ' + C.cyn + 'mode     : ' + C.r +
              (state.aiLive ? C.grn + 'LIVE' + C.r : C.yel + 'OFFLINE (local KB)' + C.r));
      println('');
      return;
    }
    if (args[0] === '--offline') { state.aiLive = false; println(C.yel + '⚠ HEX AI switched to offline mode' + C.r); return; }
    if (args[0] === '--online')  { state.aiLive = true;  println(C.grn + '✔ HEX AI switched to LIVE mode' + C.r); return; }

    const q = args.join(' ').trim();
    if (!q) {
      println('');
      println(C.grn + '  HEX AI ▸ usage: ai <your question>' + C.r);
      println(C.gry + '  examples: ai what is xterm.js | ai --clear | ai --status' + C.r);
      println('');
      return;
    }

    const math = tryMath(q);
    if (math !== null) {
      println('');
      println('  ' + C.grn + '▸' + C.r + ' ' + C.wht + q + ' = ' + C.r + C.grn + C.b + math + C.r);
      println('');
      return;
    }

    println('');
    term.write('  ' + C.grn + C.b + '╭─ HEX AI ' + C.r + C.gry + '──────── live · ' + HEX_AI_MODEL + ' ────────' + C.r + '\r\n');
    const spinFrames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    let spinIdx = 0;
    let gotFirstToken = false;
    setStatus('ai');

    term.write('  ' + C.grn + '│ ' + C.r);
    const spinId = setInterval(() => {
      if (gotFirstToken) return;
      const f = spinFrames[spinIdx++ % spinFrames.length];
      term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.cyn + f + C.r + ' ' + C.gry + 'thinking…' + C.r);
    }, 72);

    pushConversation('user', q);
    let reply = '';
    let via = '';
    const wrapWidth = Math.max(20, term.cols - 6);
    let currentCol = 0;

    function writeWrapped(chunk) {
      for (let i = 0; i < chunk.length; i++) {
        const ch = chunk[i];
        if (ch === '\n') { term.write('\r\n  ' + C.grn + '│ ' + C.r + C.wht); currentCol = 0; continue; }
        if (ch === '\r') continue;
        if (currentCol >= wrapWidth) { term.write('\r\n  ' + C.grn + '│ ' + C.r + C.wht); currentCol = 0; }
        term.write(C.wht + ch + C.r);
        currentCol++;
      }
    }

    const result = await streamHexAIReply(q,
      (token) => {
        if (!gotFirstToken) { gotFirstToken = true; clearInterval(spinId); term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.r); }
        reply += token;
        writeWrapped(token);
      },
      (label) => { via = label; }
    );

    clearInterval(spinId);

    if (result.ok && reply) {
      pushConversation('assistant', reply);
      term.write('\r\n');
      println('  ' + C.grn + '╰─ ' + C.gry + 'via ' + via + ' · ' + reply.length + ' chars · ' +
              (conversation.length - 1) + '/' + MAX_TURNS + ' turns' + C.r);
      println('');
      setStatus('online');
      return;
    }

    if (!gotFirstToken) term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.r);
    println('');
    println('  ' + C.grn + '╰─ ' + C.yel + 'live endpoint unreachable — falling back to local KB' + C.r);
    println('');

    const fallback = offlineReply(q);
    pushConversation('assistant', fallback);

    term.write('  ' + C.grn + C.b + '╭─ HEX AI ' + C.r + C.gry + '──────── offline KB ────────' + C.r + '\r\n');
    term.write('  ' + C.grn + '│ ' + C.r);
    await typeOut('  ' + C.wht + fallback + C.r, 6);
    println('  ' + C.grn + '╰──────────────────────────────────────' + C.r);
    println('');
    setStatus('online');
  }

  async function cmdFetch(args) {
    const raw = args.filter((a) => a.charAt(0) !== '-');
    let url = raw[0];
    const keepRaw = args.indexOf('-raw') !== -1;
    if (!url) { println(C.yel + 'usage: fetch <url> [-raw]' + C.r); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    println('');
    println('  ' + C.cyn + '→ ' + C.r + C.wht + url + C.r);
    println('  ' + C.gry + 'routing through ' + PROXIES_GET.length + ' free proxy nodes…' + C.r);
    const res = await proxyFetch(url);
    if (res.aborted) { println(C.yel + '  ✖ aborted by user' + C.r); return; }
    if (!res.ok) { println('');
      println(C.red + '  ✖ fetch failed — all proxy nodes unreachable right now.' + C.r); println(''); return; }
    println('');
    println('  ' + C.grn + C.b + '✔ 200 OK' + C.r + C.gry + '   via ' + res.via + '   ' +
            (res.text.length / 1024).toFixed(1) + ' KB' + C.r);
    println('');
    let body = res.text;
    if (!keepRaw) {
      body = body
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<noscript[\s\S]*?<\/noscript>/gi, '')
        .replace(/<!--[\s\S]*?-->/g, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
        .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    }
    const lines = body.split('\n').filter((l) => l.trim().length).slice(0, 28);
    let printed = 0;
    for (const l of lines) {
      if (printed >= 1600) break;
      const cut = l.length > 160 ? l.slice(0, 160) + '…' : l;
      println('  ' + C.gry + '│' + C.r + ' ' + C.wht + cut + C.r);
      printed += cut.length;
      await sleep(14);
    }
    println('');
    println(C.gry + '  … preview truncated. use "-raw" for untouched output.' + C.r);
    println('');
  }
