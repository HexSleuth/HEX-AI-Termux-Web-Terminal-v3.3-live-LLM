    whoami:1, uname:1, neofetch:1, pwd:1, ls:1, cd:1, cat:1, history:1,
    ai:1, ask:1, hex:1, fetch:1, curl:1, wget:1, get:1, open:1,
    xdg_open:1, proxy:1, matrix:1, pkg:1, apt:1, apt_get:1,
    reboot:1, restart:1, reset:1, exit:1, logout:1, sudo:1, '?':1,
    theme:1, scheme:1,
    lang:1, language:1, locale:1, i18n:1,
    'termux-style':1, tstyle:1,
    'termux-api':1,
    'termux-boot':1, 'termux-float':1, 'termux-tasker':1, 'termux-widget':1,
    'termux-battery-status':1, 'termux-vibrate':1,
    'termux-clipboard-get':1, 'termux-clipboard-set':1,
    'termux-toast':1, 'termux-notification':1, 'termux-notification-remove':1,
    'termux-tts-speak':1, 'termux-tts-engines':1,
    'termux-location':1, 'termux-wifi-connectioninfo':1, 'termux-wifi-scaninfo':1,
    'termux-wifi-enable':1, 'termux-share':1, 'termux-dialog':1,
    'termux-fingerprint':1, 'termux-sensor':1, 'termux-camera-photo':1,
    'termux-torch':1, 'termux-volume':1, 'termux-brightness':1,
    'termux-telephony-deviceinfo':1, 'termux-telephony-cellinfo':1,
    'termux-telephony-call':1, 'termux-contact-list':1, 'termux-sms-list':1,
    'termux-sms-send':1, 'termux-call-log':1,
    'termux-media-player':1, 'termux-media-scan':1, 'termux-audio-info':1,
    'termux-microphone-record':1, 'termux-wallpaper':1, 'termux-storage-get':1,
    'termux-download':1, 'termux-open':1, 'termux-open-url':1,
    'termux-share-file':1, 'termux-usb':1, 'termux-infrared-frequencies':1,
    'termux-job-scheduler':1, 'termux-keystore':1
  };

  async function runCommand(line) {
    if (!line) return;
    const parts = tokenize(line);
    if (!parts.length) return;
    const cmd  = parts[0].toLowerCase();
    const args = parts.slice(1);

    switch (cmd) {
      case 'help': case '?':         return cmdHelp();
      case 'about':                  return cmdAbout();
      case 'banner':                 return printBanner();
      case 'clear': case 'cls':      term.clear(); return;
      case 'echo':                   println(args.join(' ')); return;
      case 'date': case 'time':      return cmdDate();
      case 'whoami':                 println(state.user); return;
      case 'uname':                  return cmdUname();
      case 'neofetch':               return cmdNeofetch();
      case 'pwd':                    println('/data/data/com.termux/files/home'); return;
      case 'ls':                     return cmdLs();
      case 'cd':                     return cmdCd(args);
      case 'cat':                    return cmdCat(args);
      case 'history':                return cmdHistory();
      case 'ai': case 'ask': case 'hex': return cmdAI(args);
      case 'fetch': case 'curl': case 'wget': case 'get': return cmdFetch(args);
      case 'open': case 'xdg-open':  return cmdOpen(args);
      case 'proxy':                  return cmdProxy(args);
      case 'matrix':                 return cmdMatrix();
      case 'pkg': case 'apt': case 'apt-get': return cmdPkg(args);
      case 'reboot': case 'restart': case 'reset': return cmdReboot();
      case 'exit': case 'logout':    return cmdExit();
      case 'sudo':
        println(C.red + 'hexai is not in the sudoers file. 😄' + C.r);
        return;
      case 'theme': case 'scheme':   return cmdTheme(args);
      case 'lang': case 'language': case 'locale': case 'i18n':
        return cmdLang(args);
      case 'termux-style': case 'tstyle':
        if (!state.installed['termux-styling']) {
          println('');
          println(C.red + 'termux-style: command not found' + C.r);
          println(C.gry + 'hint: run ' + C.grn + '"pkg install termux-styling"' + C.gry + ' first.' + C.r);
          println('');
          return;
        }
        return cmdTermuxStyle(args);
      case 'termux-api':   return cmdTermuxApi(args);
      case 'termux-boot':  return cmdAddonBoot();
      case 'termux-float': return cmdAddonFloat(!(args[0] && args[0].toLowerCase() === 'off'));
      case 'termux-tasker':return cmdAddonTasker();
      case 'termux-widget':return cmdAddonWidget(args);
    }

    if (cmd.indexOf('termux-') === 0) {
      const sub = cmd.slice(7);
      return cmdTermuxApi([sub].concat(args));
    }

    const gated = {
      python  : ['python', 'python3'],
      figlet  : ['figlet'], cowsay: ['cowsay'], fortune: ['fortune'],
      htop    : ['htop', 'top'], nmap: ['nmap'], git: ['git'],
      lolcat  : ['lolcat'], sl: ['sl']
    };
    for (const pkg in gated) {
      if (gated[pkg].indexOf(cmd) === -1) continue;
      if (!state.installed[pkg]) {
        println('');
        println(C.red + '  ' + cmd + ': command not found' + C.r);
        println(C.gry + '  hint: run ' + C.grn + '"pkg install ' + pkg + '"' + C.gry + ' to install it.' + C.r);
        println('');
        return;
      }
      switch (pkg) {
        case 'python':  return cmdPython(args);
        case 'figlet':  return cmdFiglet(args);
        case 'cowsay':  return cmdCowsay(args);
        case 'fortune': return cmdFortune();
        case 'htop':    return cmdHtop();
        case 'nmap':    return cmdNmap(args);
        case 'git':     return cmdGit(args);
        case 'lolcat':  return cmdLolcat(args);
        case 'sl':      return cmdSl();
      }
    }

    println('');
    println(C.red + '  hexsh: ' + cmd + ': command not found' + C.r);
    println(C.gry + '  type ' + C.grn + '"help"' + C.gry + ' for the full command index.' + C.r);
    println('');
  }

  /* ------------------------------------------------------------
     29. BOOT SEQUENCE
     ------------------------------------------------------------ */
  async function bootSequence(isReboot) {
    state.closed = false;
    const steps = isReboot
      ? [ Locale.t('boot_init'), Locale.t('boot_mount'), Locale.t('boot_locale'),
          Locale.t('boot_theme'), Locale.t('boot_llm'), Locale.t('boot_termux'),
          Locale.t('boot_done') ]
      : [ Locale.t('boot_init'), Locale.t('boot_mount'), Locale.t('boot_locale'),
          Locale.t('boot_theme'), Locale.t('boot_renderer'), Locale.t('boot_net'),
          Locale.t('boot_llm'), Locale.t('boot_core'), Locale.t('boot_termux'),
          Locale.t('boot_probe'), Locale.t('boot_done') ];

    for (let i = 0; i < steps.length; i++) {
      const pct = Math.round(((i + 1) / steps.length) * 100);
      term.write('\x1b[2K\r' + C.gry + '[' + pad(pct, 3) + '%] ' + C.r + C.cyn + steps[i] + C.r);
      await sleep(120 + Math.random() * 110);
      term.write(' ' + C.grn + '✔' + C.r);
      await sleep(55);
      term.write('\r\n');
    }
    println('');
    await printBanner();
    println(C.gry + '  ┌─ ' + Locale.t('sys_header') + ' ─────────────────────────────┐' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_engine').padEnd(8) + C.r + C.wht + 'xterm.js 5.5.0' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_locale').padEnd(8) + C.r + C.wht +
            Locale.get() + ' · ' + Locale.info(Locale.get()).native + ' (' + Locale.dir() + ')' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_theme').padEnd(8) + C.r + C.wht +
            ThemeEngine.get() + ' (' + ThemeEngine.effective() + ')' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_ai').padEnd(8) + C.r + C.wht + 'gen.pollinations.ai (live)' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_proxy').padEnd(8) + C.r + C.wht + PROXIES.length + ' free nodes' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_addons').padEnd(8) + C.r + C.wht + '6 termux addons' + C.r);
    println(C.gry + '  │ ' + C.grn + Locale.t('sys_styles').padEnd(8) + C.r + C.wht +
            SCHEME_NAMES.length + ' schemes · ' + FONTS.length + ' fonts' + C.r);
    println(C.gry + '  └──────────────────────────────────────────┘' + C.r);
    println('');
    println(C.wht + '  ' + Locale.t('welcome') + C.r);
    println('');
  }

  /* ------------------------------------------------------------
     30. EXTRA-KEYS ROW
     ------------------------------------------------------------ */
  const KEYS = [
    { label:'ESC',  seq:'\x1b' },
    { label:'CTRL', mod:'ctrl' },
    { label:'ALT',  mod:'alt'  },
    { label:'TAB',  seq:'\t'   },
    { label:'↑',    seq:'\x1b[A' },
    { label:'↓',    seq:'\x1b[B' },
    { label:'←',    seq:'\x1b[D' },
    { label:'→',    seq:'\x1b[C' },
    { label:'HOME', seq:'\x1b[H' },
    { label:'END',  seq:'\x1b[F' },
    { label:'PGUP', seq:'\x1b[5~' },
    { label:'PGDN', seq:'\x1b[6~' },
    { label:'/',    seq:'/' },
    { label:'-',    seq:'-' },
    { label:'|',    seq:'|' },
    { label:'~',    seq:'~' },
    { label:'^C',   seq:'\x03', cls:'accent' },
    { label:'^L',   seq:'\x0c', cls:'accent' },
    { label:'⏎',    seq:'\r',   cls:'accent wide' },
    { label:'⌫',    seq:'\x7f', cls:'accent' }
  ];
  const modButtons = {};
  function buildKeyRow() {
    if (!keysEl) return;
    keysEl.innerHTML = '';
    KEYS.forEach((k) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hx-key' + (k.cls ? ' ' + k.cls : '');
      btn.textContent = k.label;
      const press = (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        if (k.mod === 'ctrl') { ctrlArmed = !ctrlArmed; if (ctrlArmed) altArmed = false; updateModKeys(); term.focus(); return; }
        if (k.mod === 'alt')  { altArmed  = !altArmed;  if (altArmed)  ctrlArmed = false; updateModKeys(); term.focus(); return; }
        handleInput(k.seq);
        term.focus();
      };
      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('mousedown', press);
      if (k.mod) modButtons[k.mod] = btn;
      keysEl.appendChild(btn);
    });
  }
  function updateModKeys() {
    if (modButtons.ctrl) modButtons.ctrl.classList.toggle('on', ctrlArmed);
    if (modButtons.alt)  modButtons.alt.classList.toggle('on', altArmed);
  }
  buildKeyRow();

  /* ------------------------------------------------------------
     31. TERMINAL FOCUS + LONG-PRESS MENU
     ------------------------------------------------------------ */
  termEl.addEventListener('touchstart', () => { term.focus(); }, { passive: true });
  termEl.addEventListener('click', () => { term.focus(); });

  let pressTimer = null;
  function longPressStart(e) {
    if (term.hasSelection()) return;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      openMenu();
      if (state.installed['termux-api'] && navigator.vibrate) {
        try { navigator.vibrate(15); } catch (err) {}
      }
    }, 550);
  }
  function longPressCancel() { clearTimeout(pressTimer); pressTimer = null; }
  screenEl.addEventListener('mousedown', longPressStart);
  screenEl.addEventListener('touchstart', longPressStart, { passive: true });
  screenEl.addEventListener('mouseup', longPressCancel);
  screenEl.addEventListener('mouseleave', longPressCancel);
  screenEl.addEventListener('touchend', longPressCancel);
  screenEl.addEventListener('touchcancel', longPressCancel);
  screenEl.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(); });

  /* ------------------------------------------------------------
     32. UI MENU / DRAWER ACTIONS
     ------------------------------------------------------------ */
  function openMenu() { ROOT.classList.add('menu-open'); ROOT.classList.remove('drawer-open'); }
  function closeMenu() { ROOT.classList.remove('menu-open'); }
  function toggleMenu() { ROOT.classList.contains('menu-open') ? closeMenu() : openMenu(); }
  function openDrawer() { ROOT.classList.add('drawer-open'); ROOT.classList.remove('menu-open'); }
  function closeDrawer() { ROOT.classList.remove('drawer-open'); }

  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu(); });
  if (drawerScr) drawerScr.addEventListener('click', closeDrawer);

  document.addEventListener('click', (e) => {
    if (!ROOT.contains(e.target)) { closeMenu(); closeDrawer(); return; }
    if (!menuPopup.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeMenu();
    }
  });

  /* swipe from left edge to open drawer */
  let swipeStartX = 0, swipeStartY = 0, swipeTracking = false;
  ROOT.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    swipeStartX = t.clientX; swipeStartY = t.clientY;
    swipeTracking = (t.clientX < 26);
  }, { passive: true });
  ROOT.addEventListener('touchmove', (e) => {
    if (!swipeTracking) return;
    const t = e.touches[0];
    const dx = t.clientX - swipeStartX;
    const dy = Math.abs(t.clientY - swipeStartY);
    if (dx > 55 && dy < 60) { swipeTracking = false; openDrawer(); }
  }, { passive: true });
  ROOT.addEventListener('touchend', () => { swipeTracking = false; });

  if (themeBtn) {
    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const next = ThemeEngine.cycle();
      showToast('🎨 ' + Locale.t('toast_theme') + ': ' + next, 'ok');
    });
  }

  /* ---------- LANGUAGE PICKER ---------- */
  const langToggleBtn = document.getElementById('tm-lang-toggle');
  const langListEl    = document.getElementById('tm-lang-list');
  const langSearchEl  = document.getElementById('tm-lang-search');

  function buildLangList(filter) {
    const f = (filter || '').trim().toLowerCase();
    const langs = Locale.list().sort((a, b) => a.code.localeCompare(b.code));
    const filtered = f
      ? langs.filter((l) =>
          l.code.toLowerCase().indexOf(f) !== -1 ||
          l.name.toLowerCase().indexOf(f) !== -1 ||
          (l.native && l.native.toLowerCase().indexOf(f) !== -1))
      : langs;

    /* preserve the search input element */
    const searchRow = langListEl.querySelector('.tm-lang-search');
    /* clear everything except the search row */
    while (langListEl.firstChild) {
      if (langListEl.firstChild === searchRow) break;
      langListEl.removeChild(langListEl.firstChild);
    }
    /* remove anything after search row */
    let node = searchRow.nextSibling;
    while (node) { const nx = node.nextSibling; langListEl.removeChild(node); node = nx; }

    filtered.forEach((l) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tm-lang-btn' + (l.code === Locale.get() ? ' active' : '');
      btn.setAttribute('data-lang', l.code);
      btn.innerHTML =
        '<span class="flag">' + (l.flag || '·') + '</span>' +
        '<span class="native">' +
          '<span class="n1">' + (l.native || l.name) + '</span>' +
          '<span class="n2">' + l.code + ' · ' + l.name + ' · ' + l.dir.toUpperCase() + '</span>' +
        '</span>' +
        '<span class="mark">✓</span>';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (Locale.set(l.code)) {
          resetConversation();
          refreshSystemPrompt();
          buildLangList(langSearchEl ? langSearchEl.value : '');
          const inf = Locale.info(Locale.get());
          showToast('🌐 ' + inf.native, 'ok');
        }
      });
      langListEl.appendChild(btn);
    });

    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.style.padding = '12px 16px';
      empty.style.color = 'var(--tm-fg-mute)';
      empty.style.font = '500 12px ui-monospace,monospace';
      empty.textContent = '— 0 matches —';
      langListEl.appendChild(empty);
    }
  }

  if (langToggleBtn) {
    langToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = langListEl.classList.toggle('open');
      if (open && !langListEl.querySelector('.tm-lang-btn')) {
        buildLangList('');
      }
    });
  }
  if (langSearchEl) {
    langSearchEl.addEventListener('input', (e) => buildLangList(e.target.value));
    langSearchEl.addEventListener('click', (e) => e.stopPropagation());
  }

  /* ---------- ACTION DISPATCH ---------- */
  function dispatchAction(action) {
    closeMenu();
    /* keep drawer open if language picker was just toggled */
    if (action !== 'lang-toggle' && action !== 'lang-picker') closeDrawer();
    switch (action) {
      case 'new-session': term.clear(); printPrompt(); term.focus(); break;
      case 'clear':       term.clear(); printPrompt(); term.focus(); break;
      case 'reset':       cmdReboot(); break;
      case 'theme-auto':  ThemeEngine.set('auto');  showToast('🎨 ' + Locale.t('toast_theme') + ': auto', 'ok'); break;
      case 'theme-dark':  ThemeEngine.set('dark');  showToast('🎨 ' + Locale.t('toast_theme') + ': dark', 'ok'); break;
      case 'theme-light': ThemeEngine.set('light'); showToast('🎨 ' + Locale.t('toast_theme') + ': light','ok'); break;
      case 'pkg-api':     cmdPkg(['install','termux-api']); break;
      case 'pkg-styling': cmdPkg(['install','termux-styling']); break;
      case 'pkg-float':
        if (state.installed['termux-float']) cmdAddonFloat(true);
        else cmdPkg(['install','termux-float']);
        break;
      case 'style-menu':
        if (state.installed['termux-styling']) cmdTermuxStyle([]);
        else { showToast('Install termux-styling first', 'warn'); cmdPkg(['install','termux-styling']); }
        break;
      case 'help':        term.clear(); cmdHelp().then(printPrompt); break;
      case 'about':       term.clear(); cmdAbout().then(printPrompt); break;
      case 'ai-status':   cmdAI(['--status']); break;
      case 'ai-clear':    resetConversation(); showToast('🧠 ' + Locale.t('toast_ai_cleared'), 'ok'); break;
      case 'lang-toggle': openDrawer(); setTimeout(() => {
                            const open = langListEl.classList.toggle('open');
                            if (open) buildLangList('');
                          }, 260); break;
      case 'lang-picker': openDrawer(); setTimeout(() => {
                            langListEl.classList.add('open');
                            buildLangList('');
                          }, 260); break;
    }
  }

  menuPopup.querySelectorAll('.row').forEach((r) => {
    r.addEventListener('click', (e) => { e.stopPropagation(); dispatchAction(r.getAttribute('data-action')); });
  });
  drawerList.querySelectorAll('.tm-drawer-item[data-action]').forEach((r) => {
    r.addEventListener('click', (e) => { e.stopPropagation(); dispatchAction(r.getAttribute('data-action')); });
  });

  /* ------------------------------------------------------------
     33. RESPONSIVE FIT
     ------------------------------------------------------------ */
  function responsiveFont() {
    const w = termEl.clientWidth || ROOT.clientWidth;
    let size = 13;
    if (w < 340)      size = 9.5;
    else if (w < 420) size = 10.5;
    else if (w < 560) size = 11.5;
    else if (w < 760) size = 12.5;
    else              size = 13.5;
    if (term.options.fontSize !== size) term.options.fontSize = size;
  }
  function fitNow() {
    if (!fitAddon) return;
    try { responsiveFont(); fitAddon.fit(); } catch (e) {}
  }
  window.addEventListener('resize', () => setTimeout(fitNow, 80));
  window.addEventListener('orientationchange', () => setTimeout(fitNow, 250));
  if (typeof ResizeObserver !== 'undefined') {
    try { const ro = new ResizeObserver(() => setTimeout(fitNow, 60)); ro.observe(termEl); } catch (e) {}
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => setTimeout(fitNow, 120));
  }

  /* ------------------------------------------------------------
     34. LOCALE EVENT WIRING
     ------------------------------------------------------------ */
  Locale.onChange((code) => {
    /* refresh status label */
    setStatus(state.busy ? 'busy' : 'online');
    /* update the drawer label */
    const inf = Locale.info(code);
    const langLabelInDrawer = document.getElementById('tm-lang-current-label');
    if (langLabelInDrawer) langLabelInDrawer.textContent = inf.native || inf.name;
    /* update mode badges inside menu rows */
    if (miLang) miLang.textContent = code;
    /* refresh the popup / drawer status text */
    const statusText = document.getElementById('hx-status-text');
    if (statusText && !state.busy && !statusPill.classList.contains('ai')) {
      statusText.textContent = Locale.t('status_online');
    }
    /* update the search input placeholder (multi-lingual hint) */
    if (langSearchEl) langSearchEl.placeholder = 'Search · खोजें · بحث · 検索 · busca';
    /* fit again in case font metrics changed */
    setTimeout(fitNow, 60);
  });

  /* ------------------------------------------------------------
     35. BOOT / START
     ------------------------------------------------------------ */
  (async function start() {
    /* 1. locale FIRST (applies data-i18n to static elements) */
    Locale.init();

    /* 2. theme */
    ThemeEngine.init();

    /* 3. restore persisted prefs */
    try {
      const s = localStorage.getItem('hexai.scheme');
      if (s && SCHEMES[s]) {
        state.scheme = s; state.schemeLock = true;
        term.options.theme = SCHEMES[s].theme;
        ROOT.style.background = SCHEMES[s].theme.background;
      }
      const f = localStorage.getItem('hexai.font');
      if (f && FONTS.find((x) => x.id === f)) {
        state.font = f;
        term.options.fontFamily = FONTS.find((x) => x.id === f).css + ', monospace';
      }
    } catch (e) {}

    /* 4. seed the AI conversation with the localised system prompt */
    initConversation();

    /* 5. set up initial status */
    setStatus('online');

    /* 6. fill language list (hidden until expanded) */
    buildLangList('');

    /* 7. initial sizing */
    await sleep(80); fitNow();
    await sleep(60); fitNow();

    /* 8. boot animation (localised) */
    await bootSequence(false);

    /* 9. hide loading veil */
    if (loadingEl) {
      loadingEl.classList.add('hide');
      setTimeout(() => { loadingEl.style.display = 'none'; }, 600);
    }

    printPrompt();
    term.focus();

    /* 10. silent AI endpoint probe */
    setTimeout(() => {
      try {
        fetch(HEX_AI_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: HEX_AI_MODEL,
            messages: [{ role: 'user', content: 'ping' }],
            stream: false,
            max_tokens: 1
          })
        }).then((r) => { if (!r.ok) state.aiLive = false; })
          .catch(() => { state.aiLive = false; });
      } catch (e) { state.aiLive = false; }
    }, 1200);

    /* 11. refit when tab returns */
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) setTimeout(fitNow, 120);
    });

    /* 12. welcome toast about long-press + language */
    setTimeout(() => {
      showToast('💡 ' + Locale.t('toast_longpress'), 'ok');
    }, 900);
    setTimeout(() => {
      const inf = Locale.info(Locale.get());
      showToast('🌐 ' + inf.native + ' · lang <code>', 'ok');
    }, 2600);
  })();

})();
</script>
