<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#05080d"/>
<title>HEX AI — Termux Web Terminal v3.3</title>

<!-- ============ xterm.js core stylesheet (CDN) ============ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"/>

<!-- ============ Web fonts for termux-style font switching ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Source+Code+Pro:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Ubuntu+Mono:wght@400;700&family=Roboto+Mono:wght@400;700&family=Inconsolata:wght@400;700&family=Space+Mono:wght@400;700&family=Anonymous+Pro:wght@400;700&family=Victor+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/* ============================================================
   HEX AI TERMINAL v3.3 — SCOPED STYLES
   ============================================================ */

#hexai-widget{
  --hx-accent:#00ffa3;
  --hx-accent2:#00d9ff;
  --hx-text:#d7ffe9;
  --hx-dim:#6f8a9b;
  --hx-line:rgba(0,255,163,.18);
  --hx-panel:#070c13;

  position:relative;
  width:100%;
  max-width:1000px;
  margin:0 auto;
  border-radius:16px;
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(160deg,#060a11 0%,#04070c 55%,#050a10 100%);
  border:1px solid rgba(0,255,163,.22);
  box-shadow:
     0 0 0 1px rgba(0,0,0,.65),
     0 18px 55px -14px rgba(0,255,163,.30),
     0 0 110px -35px rgba(0,217,255,.40);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
}
#hexai-widget *,
#hexai-widget *::before,
#hexai-widget *::after{ box-sizing:border-box; }

#hexai-widget::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:20;
  background:repeating-linear-gradient(
     to bottom,
     rgba(255,255,255,.024) 0px,
     rgba(255,255,255,.024) 1px,
     rgba(0,0,0,0) 2px,
     rgba(0,0,0,0) 4px
  );
  mix-blend-mode:overlay;
  opacity:.6;
}

/* ---------------- title bar ---------------- */
#hexai-widget .hx-bar{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:linear-gradient(180deg,#0a121b,#060b12);
  border-bottom:1px solid var(--hx-line);
}
#hexai-widget .hx-dots{ display:flex; gap:6px; flex:0 0 auto; }
#hexai-widget .hx-dot{
  width:11px; height:11px; border-radius:50%;
  box-shadow:inset 0 0 4px rgba(0,0,0,.55);
}
#hexai-widget .hx-dot.r{ background:#ff5f57; }
#hexai-widget .hx-dot.y{ background:#febc2e; }
#hexai-widget .hx-dot.g{ background:#28c840; }

#hexai-widget .hx-title{
  flex:1 1 auto;
  min-width:0;
  text-align:center;
  font:600 12.5px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.06em;
  color:#9fe8cd;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 0 12px rgba(0,255,163,.55);
}
#hexai-widget .hx-title b{ color:var(--hx-accent); }

#hexai-widget .hx-status{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 9px;
  border-radius:999px;
  font:600 10px/1 ui-monospace,monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#04120c;
  background:linear-gradient(180deg,#00ffa3,#00cf85);
  box-shadow:0 0 14px rgba(0,255,163,.55);
  transition:background .25s ease, box-shadow .25s ease;
}
#hexai-widget .hx-status.ai{
  background:linear-gradient(180deg,#00d9ff,#0096d6);
  color:#02121a;
  box-shadow:0 0 18px rgba(0,217,255,.8);
}
#hexai-widget .hx-led{
  width:6px; height:6px; border-radius:50%;
  background:#04120c;
  animation:hx-pulse 1.15s ease-in-out infinite;
}
#hexai-widget .hx-status.ai .hx-led{ background:#02121a; }
@keyframes hx-pulse{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:.25; transform:scale(.7); }
}

/* ---------------- screen ---------------- */
#hexai-widget .hx-screen{
  position:relative;
  z-index:4;
  height:460px;
  min-height:260px;
  padding:8px 4px 8px 9px;
  background:
     radial-gradient(130% 110% at 50% 0%, #08131c 0%, #04070c 72%),
     #04070c;
  overflow:hidden;
  touch-action:pan-y;
  transition:padding .3s ease, border-radius .3s ease;
}
#hexai-widget .hx-screen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%, rgba(0,255,163,.055), transparent 70%);
  z-index:0;
}
#hexai-widget.hx-float .hx-screen{
  margin:14px 14px 6px 14px;
  border-radius:14px;
  border:1px solid rgba(0,217,255,.35);
  box-shadow:0 0 42px rgba(0,217,255,.35), inset 0 0 44px rgba(0,217,255,.06);
}
#hexai-term{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
}
#hexai-term .xterm{ height:100%; padding:0; }
#hexai-term .xterm-viewport{
  background:transparent !important;
  scrollbar-width:thin;
  scrollbar-color:rgba(0,255,163,.45) transparent;
}
#hexai-term .xterm-viewport::-webkit-scrollbar{ width:7px; }
#hexai-term .xterm-viewport::-webkit-scrollbar-track{ background:transparent; }
#hexai-term .xterm-viewport::-webkit-scrollbar-thumb{
  background:rgba(0,255,163,.40);
  border-radius:8px;
}
#hexai-term .xterm-screen{ z-index:2; }

/* ---------------- extra keys (Termux style) ---------------- */
#hexai-widget .hx-keys{
  position:relative;
  z-index:6;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:9px 9px calc(9px + env(safe-area-inset-bottom,0px)) 9px;
  background:linear-gradient(180deg,#070c14,#050910);
  border-top:1px solid var(--hx-line);
}
#hexai-widget .hx-key{
  flex:0 0 auto;
  min-width:40px;
  height:36px;
  padding:0 11px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  border:1px solid rgba(0,255,163,.18);
  background:linear-gradient(180deg,#101a25,#0a1119);
  color:#9fe8cd;
  font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .10s ease, background .16s ease, color .16s ease, box-shadow .16s ease, border-color .16s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 3px 8px rgba(0,0,0,.45);
}
#hexai-widget .hx-key:active,
#hexai-widget .hx-key.is-active{
  transform:translateY(1px);
  background:linear-gradient(180deg,#00ffa3,#00d98a);
  color:#04120c;
  border-color:#00ffa3;
  box-shadow:0 0 18px rgba(0,255,163,.7);
}
#hexai-widget .hx-key.on{
  background:linear-gradient(180deg,#00d9ff,#009fd6);
  color:#02121a;
  border-color:#00d9ff;
  box-shadow:0 0 18px rgba(0,217,255,.75);
}
#hexai-widget .hx-key.wide{ min-width:56px; }
#hexai-widget .hx-key.accent{ color:var(--hx-accent); border-color:rgba(0,255,163,.4); }

/* ---------------- footer hint ---------------- */
#hexai-widget .hx-foot{
  position:relative;
  z-index:6;
  padding:7px 12px;
  font:500 10.5px/1.4 ui-monospace,monospace;
  letter-spacing:.04em;
  color:#4f6b7c;
  background:#040810;
  border-top:1px solid rgba(0,255,163,.09);
  text-align:center;
}
#hexai-widget .hx-foot span{ color:#00c98a; }

/* ---------------- loading veil ---------------- */
#hexai-widget .hx-loading{
  position:absolute;
  inset:0;
  z-index:40;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background:rgba(4,7,12,.94);
  backdrop-filter:blur(3px);
  transition:opacity .5s ease;
}
#hexai-widget .hx-loading.hide{ opacity:0; pointer-events:none; }
#hexai-widget .hx-spin{
  width:52px; height:52px;
  border-radius:50%;
  border:3px solid rgba(0,255,163,.14);
  border-top-color:#00ffa3;
  border-right-color:#00d9ff;
  animation:hx-rot .85s linear infinite;
  box-shadow:0 0 26px rgba(0,255,163,.35);
}
@keyframes hx-rot{ to{ transform:rotate(360deg); } }
#hexai-widget .hx-loadtxt{
  font:700 12px/1 ui-monospace,monospace;
  letter-spacing:.22em;
  color:#00ffa3;
  text-transform:uppercase;
  text-shadow:0 0 16px rgba(0,255,163,.7);
  animation:hx-blink 1.2s ease-in-out infinite;
}
@keyframes hx-blink{ 0%,100%{opacity:1} 50%{opacity:.35} }

/* ============================================================
   ANDROID-STYLE TOAST NOTIFICATIONS
   ============================================================ */
#hexai-widget .hx-toasts{
  position:absolute;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  z-index:60;
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:center;
  pointer-events:none;
  width:max-content;
  max-width:82%;
}
#hexai-widget .hx-toast{
  padding:9px 14px;
  border-radius:22px;
  background:rgba(12,18,26,.94);
  color:#e2fff5;
  font:500 12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  border:1px solid rgba(0,255,163,.32);
  box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 20px rgba(0,255,163,.18);
  backdrop-filter:blur(6px);
  opacity:0;
  transform:translateY(14px);
  animation:hx-toast-in .28s ease forwards;
  pointer-events:none;
  text-align:center;
}
#hexai-widget .hx-toast.out{ animation:hx-toast-out .28s ease forwards; }
#hexai-widget .hx-toast.ok   { border-color:rgba(0,255,163,.5); }
#hexai-widget .hx-toast.err  { border-color:rgba(255,92,92,.55); color:#ffd9d9; }
#hexai-widget .hx-toast.warn { border-color:rgba(255,214,92,.55); color:#fff4d1; }
@keyframes hx-toast-in{ to{ opacity:1; transform:translateY(0); } }
@keyframes hx-toast-out{ to{ opacity:0; transform:translateY(-6px); } }

/* ---------------- mobile tuning ---------------- */
@media (max-width:640px){
  #hexai-widget{ border-radius:13px; }
  #hexai-widget .hx-screen{ height:60vh; min-height:300px; padding:6px 3px 6px 7px; }
  #hexai-widget .hx-key{ height:34px; min-width:36px; padding:0 9px; font-size:11.5px; }
  #hexai-widget .hx-title{ font-size:11px; }
  #hexai-widget .hx-status{ font-size:9px; padding:3px 7px; }
  #hexai-widget .hx-toasts{ bottom:78px; max-width:90%; }
}
@media (max-width:380px){
  #hexai-widget .hx-keys{ gap:5px; padding:7px; }
  #hexai-widget .hx-key{ height:32px; min-width:32px; padding:0 7px; font-size:11px; }
  #hexai-widget .hx-toast{ font-size:11.5px; padding:8px 12px; }
}
</style>
</head>
<body>

<!-- ============================================================
     HEX AI WIDGET v3.3
     ============================================================ -->
<div id="hexai-widget">

  <div class="hx-loading" id="hx-loading">
    <div class="hx-spin"></div>
    <div class="hx-loadtxt">HEX AI v3.3 · Booting</div>
  </div>

  <div class="hx-bar">
    <div class="hx-dots">
      <span class="hx-dot r"></span>
      <span class="hx-dot y"></span>

  <div class="hx-screen" id="hx-screen">

</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>

<script>
/* ================================================================

(function () {

    return;

  /* ------------------------------------------------------------
     1. UTILITIES
     ------------------------------------------------------------ */
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const C = {
    r  : '\x1b[0m',
    b  : '\x1b[1m',
    d  : '\x1b[2m',
    it : '\x1b[3m',
    ul : '\x1b[4m',

  async function proxyFetch(url) {
    const total = PROXIES.length;
    for (let i = 0; i < total; i++) {
      if (state.interrupt) return { ok: false, aborted: true };
      const target = PROXIES[i](url);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      term.write('\x1b[2K\r' + C.gry + '⇢ ' + PROXY_LABELS[i] +
                 ' (' + (i + 1) + '/' + total + ')' + C.r);
      try {
        const res = await fetch(target, { method:'GET', signal:controller.signal, headers:{ 'Accept':'*/*' } });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        term.write('\x1b[2K\r');
        return { ok: true, text: text, via: PROXY_LABELS[i] };
      } catch (err) { clearTimeout(timer); }
    }
    term.write('\x1b[2K\r');
    return { ok: false };
  }

  /* ============================================================
     13. HEX AI — LIVE LLM CALL (gen.pollinations.ai)
     - OpenAI-compatible /v1/chat/completions
     - No API key required
     - Streams tokens as they arrive
     - Falls back to the local offline KB on failure
     ============================================================ */

  /**
   * Send a user message to the live HEX AI and stream the reply
   * into the terminal, token by token.
   * Returns { ok, text, error } where text is the full reply.
   */
  async function streamHexAIReply(userText, onToken, onStart) {
    if (!state.aiLive) return { ok:false, error:'offline mode' };

    const body = {
      model: HEX_AI_MODEL,
      messages: conversation.slice(),   /* system + rolling history */
      stream: true,
      temperature: 0.7,
      private: true,
      referrer: 'hexai-termux-web'
    };

    /* We try a direct call first, then fall back through the proxy pool. */
    const attempts = [
      { label: 'direct', url: HEX_AI_ENDPOINT, direct: true },
      ...PROXIES.map((fn, i) => ({ label: PROXY_LABELS[i], url: fn(HEX_AI_ENDPOINT), direct: false }))
    ];

    for (const attempt of attempts) {
      if (state.interrupt) return { ok:false, error:'aborted' };

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);

      try {
        const res = await fetch(attempt.url, {
          method : 'POST',
          signal : controller.signal,
          headers: {
            'Content-Type' : 'application/json',
            'Accept'       : 'text/event-stream, application/json'
          },
          body   : JSON.stringify(body)
        });
        clearTimeout(timer);

        if (!res.ok) throw new Error('HTTP ' + res.status);

        const ctype = (res.headers.get('content-type') || '').toLowerCase();

        /* ---------- non-streaming JSON response ---------- */
        if (ctype.indexOf('application/json') !== -1 && !res.body) {
          const data = await res.json();
          let text = '';
          if (data && data.choices && data.choices[0] && data.choices[0].message) {
            text = data.choices[0].message.content || '';
          } else if (data && data.text) {
            text = data.text;
          } else if (typeof data === 'string') {
            text = data;
          }
          if (!text) throw new Error('empty reply');
          if (onStart) onStart(attempt.label);
          if (onToken) onToken(text);
          return { ok:true, text:text, via:attempt.label };
        }

        /* ---------- streaming SSE response ---------- */
        if (!res.body || typeof res.body.getReader !== 'function') {
          /* fall back to text */
          const raw = await res.text();
          const text = extractTextFromRaw(raw);
          if (!text) throw new Error('empty stream');
          if (onStart) onStart(attempt.label);
          if (onToken) onToken(text);
          return { ok:true, text:text, via:attempt.label };
        }

        if (onStart) onStart(attempt.label);

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let full   = '';
        let firstTokenSeen = false;

        while (true) {
          if (state.interrupt) {
            try { reader.cancel(); } catch (e) {}
            break;
          }
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream:true });

          /* SSE frames are separated by \n\n */
          let idx;
          while ((idx = buffer.indexOf('\n')) !== -1) {
            const line = buffer.slice(0, idx).replace(/\r$/, '');
            buffer = buffer.slice(idx + 1);

            if (!line) continue;
            if (line.charAt(0) === ':') continue;        /* comment / heartbeat */

            if (line.indexOf('data:') === 0) {
              const payload = line.slice(5).trim();
              if (payload === '[DONE]') continue;
              try {
                const obj = JSON.parse(payload);
                const delta =
                  obj.choices && obj.choices[0] &&
                  (obj.choices[0].delta && obj.choices[0].delta.content
                    ? obj.choices[0].delta.content
                    : (obj.choices[0].message && obj.choices[0].message.content
                        ? obj.choices[0].message.content
                        : (obj.choices[0].text || '')));
                if (delta) {
                  full += delta;
                  firstTokenSeen = true;
                  if (onToken) onToken(delta);
                }
              } catch (e) { /* skip malformed chunk */ }
            }
          }
        }

        /* drain the tail */
        if (buffer.trim()) {
          try {
            const tail = buffer.trim();
            if (tail.indexOf('data:') === 0) {
              const payload = tail.slice(5).trim();
              if (payload && payload !== '[DONE]') {
                const obj = JSON.parse(payload);
                const delta =
                  obj.choices && obj.choices[0] &&
                  (obj.choices[0].delta && obj.choices[0].delta.content
                    ? obj.choices[0].delta.content
                    : (obj.choices[0].message && obj.choices[0].message.content
                        ? obj.choices[0].message.content : ''));
                if (delta) { full += delta; if (onToken) onToken(delta); }
              }
            }
          } catch (e) {}
        }

        if (full) return { ok:true, text:full, via:attempt.label };
        if (firstTokenSeen) return { ok:true, text:full, via:attempt.label };
        throw new Error('empty stream');

      } catch (err) {
        clearTimeout(timer);
        /* try the next attempt */
      }
    }

    return { ok:false, error:'all endpoints unreachable' };
  }

  /* helper: pull plain text out of a possibly-SSE string */
  function extractTextFromRaw(raw) {
    if (!raw) return '';
    /* Try JSON first */
    try {
      const obj = JSON.parse(raw);
      if (obj && obj.choices && obj.choices[0]) {
        const ch = obj.choices[0];
        if (ch.message && ch.message.content) return ch.message.content;
        if (ch.text) return ch.text;
      }
      if (obj && obj.text) return obj.text;
    } catch (e) {}
    /* Then parse SSE lines */
    let out = '';
    raw.split('\n').forEach((line) => {
      line = line.replace(/\r$/, '');
      if (line.indexOf('data:') !== 0) return;
      const payload = line.slice(5).trim();
      if (!payload || payload === '[DONE]') return;
      try {
        const obj = JSON.parse(payload);
        const ch = obj.choices && obj.choices[0];
        if (ch) {
          if (ch.delta && ch.delta.content) out += ch.delta.content;
          else if (ch.message && ch.message.content) out += ch.message.content;
          else if (ch.text) out += ch.text;
        }
      } catch (e) {}
    });
    return out || raw;
  }

  /* ------------------------------------------------------------
     14. PROMPT + LINE EDITOR
     ------------------------------------------------------------ */
  function promptStr() {
    return C.grn + C.b + state.user + C.r +
           C.gry + '@' + C.r +
           C.cyn + C.b + state.host + C.r +
           C.gry + ':' + C.r +
           C.blu + C.b + state.cwd + C.r +
           C.grn + ' $ ' + C.r;
  }

  function printPrompt() {
    if (state.closed) return;
    term.write(promptStr());
  }

  function redraw() {
    term.write('\x1b[2K\r' + promptStr() + lineBuf);
    const back = lineBuf.length - cursor;
    if (back > 0) term.write('\x1b[' + back + 'D');
  }

  function insertText(str) {
    if (!str) return;
    lineBuf = lineBuf.slice(0, cursor) + str + lineBuf.slice(cursor);
    cursor += str.length;
    redraw();
  }
  function doBackspace() {
    if (cursor === 0) return;
    lineBuf = lineBuf.slice(0, cursor - 1) + lineBuf.slice(cursor);
    cursor--; redraw();
  }
  function doDelete() {
    if (cursor >= lineBuf.length) return;
    lineBuf = lineBuf.slice(0, cursor) + lineBuf.slice(cursor + 1);
    redraw();
  }
  function moveLeft()  { if (cursor > 0) { cursor--; redraw(); } }
  function moveRight() { if (cursor < lineBuf.length) { cursor++; redraw(); } }
  function historyUp() {
    if (!state.history.length) return;
    if (state.hIndex > 0) state.hIndex--;
    lineBuf = state.history[state.hIndex] || '';
    cursor = lineBuf.length; redraw();
  }
  function historyDown() {
    if (!state.history.length) return;
    if (state.hIndex < state.history.length - 1) {
      state.hIndex++;
      lineBuf = state.history[state.hIndex] || '';
    } else {
      state.hIndex = state.history.length;
      lineBuf = '';
    }
    cursor = lineBuf.length; redraw();
  }

  function autoComplete() {
    const frag = lineBuf.slice(0, cursor);
    const parts = frag.split(/\s+/);
    if (parts.length <= 1) {
      const names = Object.keys(BUILTIN_COMMANDS).concat(Object.keys(PACKAGES));
      const hits = names.filter((n) => n.indexOf(parts[0]) === 0);
      if (hits.length === 1) {
        lineBuf = hits[0] + ' ' + lineBuf.slice(cursor);
        cursor = hits[0].length + 1; redraw();
      } else if (hits.length > 1) {
        println('');
        println(C.gry + hits.join('   ') + C.r);
        redraw();
      }
      return;
    }
    const hits = Object.keys(PACKAGES).filter((n) => n.indexOf(parts[parts.length - 1]) === 0);
    if (hits.length === 1) {
      parts[parts.length - 1] = hits[0];
      lineBuf = parts.join(' ') + ' ' + lineBuf.slice(cursor);
      cursor = parts.join(' ').length + 1; redraw();
    }
  }

  /* ------------------------------------------------------------
     15. INPUT HANDLING
     ------------------------------------------------------------ */
  function handleInput(data) {
    if (state.menuActive) {
      const h = state.menuActive;
      state.menuActive = null;
      h(data);
      return;
    }

    if (state.busy) {
      if (data === '\x03' || data === '\x1b') state.interrupt = true;
      return;
    }

    if (ctrlArmed) {
      ctrlArmed = false;
      updateModKeys();
      if (data.length === 1) {
        const code = data.toUpperCase().charCodeAt(0);
        if (code >= 64 && code < 128) { handleInput(String.fromCharCode(code - 64)); return; }
      }
    }

    if (altArmed) {
      altArmed = false;
      updateModKeys();
      if (data.length === 1) { handleInput('\x1b' + data); return; }
    }

    switch (data) {
      case '\r': case '\n':   submit(); return;
      case '\u007f': case '\b': doBackspace(); return;
      case '\x03': println('^C'); lineBuf=''; cursor=0; printPrompt(); return;
      case '\x0c': term.clear(); redraw(); return;
      case '\t': autoComplete(); return;
      case '\x1b[A': historyUp();   return;
      case '\x1b[B': historyDown(); return;
      case '\x1b[C': moveRight();   return;
      case '\x1b[D': moveLeft();    return;
      case '\x1b[H':
      case '\x1b[1~': cursor = 0; redraw(); return;
      case '\x1b[F':
      case '\x1b[4~': cursor = lineBuf.length; redraw(); return;
      case '\x1b[3~': doDelete(); return;
      case '\x1b[5~': term.scrollPages(-1); return;
      case '\x1b[6~': term.scrollPages(1);  return;
      case '\x1b': return;
    }

    if (data.length > 1 && data.charCodeAt(0) !== 27) {
      insertText(data.replace(/[\r\n\t]+/g, ' '));
      return;
    }
    if (data.length === 1) {
      const code = data.charCodeAt(0);
      if (code >= 32 && code !== 127) insertText(data);
    }
  }

  term.onData(handleInput);

  term.attachCustomKeyEventHandler((e) => {
    if (e.type === 'keydown' && e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      if (term.hasSelection()) return false;
    }
    return true;
  });

  function waitKey() {
    return new Promise((resolve) => {
      state.menuActive = (data) => {
        if (data === '\r' || data === '\n') return resolve('enter');
        if (data === '\x1b' || data === '\x03') return resolve('esc');
        if (data.length === 1) return resolve(data.toLowerCase());
        return resolve('other');
      };
    });
  }

  /* ------------------------------------------------------------
     16. COMMAND SUBMITTER
     ------------------------------------------------------------ */
  async function submit() {
    const raw = lineBuf;
    term.write('\r\n');
    lineBuf = ''; cursor = 0;
    if (raw.trim()) state.history.push(raw);
    state.hIndex = state.history.length;

    state.busy = true;
    state.interrupt = false;
    setStatus('busy');

    try { await runCommand(raw.trim()); }
    catch (err) { println(C.red + 'hexai: ' + (err && err.message ? err.message : String(err)) + C.r); }

    state.busy = false;
    state.interrupt = false;
    setStatus('online');
    if (!state.closed) printPrompt();
  }

  function setStatus(txt) {
    if (statusEl) statusEl.textContent = txt;
    if (statusPill) statusPill.classList.toggle('ai', txt === 'ai');
  }

  /* ------------------------------------------------------------
     17. TOKENIZER
     ------------------------------------------------------------ */
  function tokenize(str) {
    const out = [];
    let cur = '';
    let quote = null;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (quote) { if (ch === quote) quote = null; else cur += ch; }
      else if (ch === '"' || ch === "'") quote = ch;
      else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ''; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }

    }

    switch (sub) {
      case 'battery-status': {
        const json = rest.indexOf('--json') !== -1;
        try {
          let level = null, charging = null;
          if (navigator.getBattery) {
            const b = await navigator.getBattery();
            level = Math.round(b.level * 100);
            charging = b.charging;
          }
          if (level === null) { println(C.yel + 'battery API unavailable on this browser' + C.r); return; }
          if (json) {
            println('{"health":"good","percentage":' + level +
                    ',"plugged":"' + (charging ? 'AC' : 'UNPLUGGED') +
                    '","status":"' + (charging ? 'CHARGING' : 'DISCHARGING') +
                    '","temperature":0.0}');
          } else {
            println('');
            println(C.grn + C.b + '  BATTERY STATUS' + C.r);
            println('  ' + C.cyn + 'percentage : ' + C.r + C.wht + level + '%' + C.r);
            println('  ' + C.cyn + 'status     : ' + C.r + (charging ? C.grn + 'CHARGING' : C.yel + 'DISCHARGING') + C.r);
            println('  ' + C.cyn + 'health     : ' + C.r + C.wht + 'good' + C.r);
            println('');

      case 'clipboard-get': {
        try { const txt = await navigator.clipboard.readText();

  function applyScheme(name, loud) {
    const key = name.toLowerCase().replace(/\s+/g, '-');
    if (!SCHEMES[key]) {
      println(C.red + 'termux-style: unknown color scheme "' + name + '"' + C.r);
      println(C.gry + 'run "termux-style list" to see all schemes.' + C.r);
      return;
    }
    state.scheme = key;
    term.options.theme = SCHEMES[key].theme;
    ROOT.style.background = SCHEMES[key].theme.background;
    if (loud) {
      println(C.grn + '✔ color scheme → ' + C.grn + C.b + SCHEMES[key].name + C.r);
      showToast('🎨 ' + SCHEMES[key].name, 'ok');
    }
    try { localStorage.setItem('hexai.scheme', key); } catch (e) {}
  }

  function applyFont(id, loud) {
    const f = FONTS.find((x) => x.id === id);
    if (!f) {
      println(C.red + 'termux-style: unknown font "' + id + '"' + C.r);
      println(C.gry + 'run "termux-style fonts" to see all fonts.' + C.r);
      return;
    }
    state.font = id;
    term.options.fontFamily = f.css + ', monospace';
    setTimeout(fitNow, 60);
    if (loud) {
      println(C.grn + '✔ font → ' + C.grn + C.b + f.label + C.r);
      showToast('🔤 ' + f.label, 'ok');
    }
    try { localStorage.setItem('hexai.font', id); } catch (e) {}
  }

  async function styleMenuColors() {
    println('');
    println(C.grn + C.b + '  SELECT COLOR-SCHEME' + C.r);
    println(C.gry + '  ─────────────────────────────────────────' + C.r);
    SCHEME_NAMES.forEach((id, i) => {
      const active = id === state.scheme;
      println('  ' + (active ? C.grn + '▸' : C.gry + ' ') + ' ' +
              C.gry + pad(i + 1, 3) + C.r + '  ' +
              (active ? C.grn + C.b + SCHEMES[id].name + C.r : C.wht + SCHEMES[id].name + C.r));
    });
    println('');
    println(C.gry + '  enter number (or "q" to go back)' + C.r);
    term.write(C.grn + '  [Color #]: ' + C.r);

    const k = await waitKey();
    term.write('\r\n');
    if (k === 'q' || k === 'esc') return;
    let buf = /[0-9]/.test(k) ? k : '';
    if (!buf) { println(C.yel + '  invalid input' + C.r); return; }
    while (true) {
      term.write(C.grn + '  [Color #]: ' + C.r + buf);
      const more = await waitKey();
      if (more === 'enter') break;
      if (more === 'esc') { term.write('\r\n'); return; }
      if (more.length === 1 && /[0-9]/.test(more)) { buf += more; term.write('\x1b[2K\r'); continue; }
      break;
    }
    const idx = parseInt(buf, 10) - 1;
    term.write('\r\n');
    if (isNaN(idx) || idx < 0 || idx >= SCHEME_NAMES.length) { println(C.red + '  invalid selection' + C.r); return; }
    applyScheme(SCHEME_NAMES[idx], true);
    println(C.gry + '  [*] Reloading Settings...' + C.r);
    println(C.grn + '  [*] Applied Successfully.' + C.r);
    await sleep(250);
  }

     23. HEX AI COMMAND  (live via gen.pollinations.ai)
     ============================================================ */
  async function cmdAI(args) {
    /* ---------- sub-commands ---------- */
    if (args[0] === '--clear' || args[0] === '--reset') {
      resetConversation();
      println(C.grn + '✔ conversation memory cleared (' + (conversation.length - 1) + ' turns kept)' + C.r);
      return;
    }
    if (args[0] === '--status') {
      println('');
      println(C.grn + C.b + '  HEX AI — LIVE STATUS' + C.r);
      println(C.gry + '  ─────────────────────────────────────────' + C.r);
      println('  ' + C.cyn + 'endpoint : ' + C.r + C.wht + HEX_AI_ENDPOINT + C.r);
      println('  ' + C.cyn + 'model    : ' + C.r + C.wht + HEX_AI_MODEL + C.r);
      println('  ' + C.cyn + 'api key  : ' + C.r + C.grn + 'none required' + C.r);
      println('  ' + C.cyn + 'stream   : ' + C.r + C.wht + 'yes (SSE)' + C.r);
      println('  ' + C.cyn + 'memory   : ' + C.r + C.wht + (conversation.length - 1) + ' / ' + MAX_TURNS + ' turns' + C.r);
      println('  ' + C.cyn + 'mode     : ' + C.r +
              (state.aiLive ? C.grn + 'LIVE' + C.r : C.yel + 'OFFLINE (local KB)' + C.r));
      println('');
      return;
    }
    if (args[0] === '--offline') {
      state.aiLive = false;
      println(C.yel + '⚠ HEX AI switched to offline mode (local KB only)' + C.r);
      return;
    }
    if (args[0] === '--online') {
      state.aiLive = true;
      println(C.grn + '✔ HEX AI switched to LIVE mode (gen.pollinations.ai)' + C.r);
      return;
    }

    const q = args.join(' ').trim();

    if (!q) {
      println('');
      println(C.grn + '  HEX AI ▸ usage: ai <your question>' + C.r);
      println(C.gry + '  examples:' + C.r);
      println(C.gry + '    ai what is xterm.js' + C.r);
      println(C.gry + '    ai write a bash loop from 1 to 10' + C.r);
      println(C.gry + '    ai --clear     (reset conversation)' + C.r);
      println(C.gry + '    ai --status    (check the live endpoint)' + C.r);
      println('');
      return;
    }

    /* ---------- local math shortcut ---------- */
    const math = tryMath(q);
    if (math !== null) {
      println('');
      println('  ' + C.grn + '▸' + C.r + ' ' + C.wht + q + ' = ' + C.r + C.grn + C.b + math + C.r);
      println('');
      return;
    }

    /* ---------- fetch from the LIVE endpoint ---------- */
    println('');
    term.write('  ' + C.grn + C.b + '╭─ HEX AI ' + C.r + C.gry + '──────── live · ' + HEX_AI_MODEL + ' ────────' + C.r + '\r\n');

    const spinFrames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    let spinIdx = 0;
    let gotFirstToken = false;
    let headerPrinted = false;
    setStatus('ai');
    if (statusPill) statusPill.classList.add('ai');

    /* write the streaming prefix */
    term.write('  ' + C.grn + '│ ' + C.r);

    /* spinner while we wait for the first token */
    const spinId = setInterval(() => {
      if (gotFirstToken) return;
      const f = spinFrames[spinIdx++ % spinFrames.length];
      term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.cyn + f + C.r + ' ' +
                 C.gry + 'thinking…' + C.r);
    }, 72);

    /* record the user's message into the rolling context */
    pushConversation('user', q);

    let reply = '';
    let via   = '';

    /* line-wrap helper: intercept tokens and wrap at terminal width */
    const wrapWidth = Math.max(20, term.cols - 6);
    let currentCol = 0;

    function writeWrapped(chunk) {
      for (let i = 0; i < chunk.length; i++) {
        const ch = chunk[i];
        if (ch === '\n') {
          term.write('\r\n  ' + C.grn + '│ ' + C.r + C.wht);
          currentCol = 0;
          continue;
        }
        if (ch === '\r') continue;
        if (currentCol >= wrapWidth) {
          term.write('\r\n  ' + C.grn + '│ ' + C.r + C.wht);
          currentCol = 0;
        }
        /* colour codes reset to white after coloured system messages */
        term.write(C.wht + ch + C.r);
        currentCol++;
      }
    }

    const result = await streamHexAIReply(
      q,
      (token) => {
        if (!gotFirstToken) {
          gotFirstToken = true;
          clearInterval(spinId);
          term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.r);
          headerPrinted = true;
        }
        reply += token;
        writeWrapped(token);
      },
      (attemptLabel) => {
        via = attemptLabel;
      }
    );

    clearInterval(spinId);

    /* ---------- success ---------- */
    if (result.ok && reply) {
      /* remember the assistant reply */
      pushConversation('assistant', reply);

      /* end the box */
      term.write('\r\n');
      println('  ' + C.grn + '╰─ ' + C.gry + 'via ' + via + ' · ' +
              reply.length + ' chars · ' +
              (conversation.length - 1) + '/' + MAX_TURNS + ' turns' + C.r);
      println('');
      setStatus('online');
      if (statusPill) statusPill.classList.remove('ai');
      return;
    }

    /* ---------- fallback: offline KB ---------- */
    clearInterval(spinId);

    if (!gotFirstToken) {
      term.write('\x1b[2K\r  ' + C.grn + '│ ' + C.r);
    }

    println('');
    println('  ' + C.grn + '╰─ ' + C.yel + 'live endpoint unreachable — falling back to local KB' + C.r);
    println('');

    const fallback = offlineReply(q);
    pushConversation('assistant', fallback);

    term.write('  ' + C.grn + C.b + '╭─ HEX AI ' + C.r + C.gry + '──────── offline KB ────────' + C.r + '\r\n');
    term.write('  ' + C.grn + '│ ' + C.r);
    await typeOut('  ' + C.wht + fallback + C.r, 6);
    println('  ' + C.grn + '╰──────────────────────────────────────' + C.r);
    println('');

    setStatus('online');
    if (statusPill) statusPill.classList.remove('ai');
  }

  /* ---- fetch ---- */
  async function cmdFetch(args) {
    const raw = args.filter((a) => a.charAt(0) !== '-');
    let url = raw[0];
    const keepRaw = args.indexOf('-raw') !== -1;
    if (!url) {
      println('');
      println(C.yel + '  usage: fetch <url>  [-raw]' + C.r);
      println(C.gry + '  example: fetch https://example.com' + C.r);
      println('');
      return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    println('');
    println('  ' + C.cyn + '→ ' + C.r + C.wht + url + C.r);
    println('  ' + C.gry + 'routing through free proxy pool (' + PROXIES.length + ' nodes)…' + C.r);
    const res = await proxyFetch(url);
    if (res.aborted) { println(C.yel + '  ✖ aborted by user' + C.r); return; }
    if (!res.ok) {
      println('');
      println(C.red + '  ✖ fetch failed — every proxy node is unreachable right now.' + C.r);
      println('');
      return;
    }
    println('');
    println('  ' + C.grn + C.b + '✔ 200 OK' + C.r + C.gry + '   via ' + res.via + '   ' +
            (res.text.length / 1024).toFixed(1) + ' KB' + C.r);
    println('');
    let body = res.text;
    if (!keepRaw) {
      body = body
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<style[\s\S]*?<\/style>/gi, '')
        .replace(/<noscript[\s\S]*?<\/noscript>/gi, '')
        .replace(/<!--[\s\S]*?-->/g, '')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
        .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    }
    const lines = body.split('\n').filter((l) => l.trim().length).slice(0, 28);
    const maxChars = 1600;
    let printed = 0;
    for (const l of lines) {
      if (printed >= maxChars) break;
      const cut = l.length > 160 ? l.slice(0, 160) + '…' : l;
      println('  ' + C.gry + '│' + C.r + ' ' + C.wht + cut + C.r);
      printed += cut.length;
      await sleep(14);
    }
    println('');
    println(C.gry + '  … preview truncated. use "-raw" for untouched output.' + C.r);
    println('');
  }

  async function cmdPkg(args) {
    const sub  = (args[0] || 'list').toLowerCase();
    const name = args[1] ? args[1].toLowerCase() : null;

    if (sub === 'install' || sub === 'i' || sub === 'add') {
      if (!name) { println(C.yel + 'usage: pkg install <package>' + C.r); return; }
      if (!PACKAGES[name]) {
        println(C.red + 'E: Unable to locate package "' + name + '"' + C.r);
        println(C.gry + 'run "pkg list" to see available packages.' + C.r);
        return;
      }
      if (state.installed[name]) { println(C.yel + name + ' is already the newest version.' + C.r); return; }
      const isAddon = !!PACKAGES[name].addon;

      println('');
      println(C.cyn + 'Reading package lists... Done' + C.r);
      println(C.cyn + 'Building dependency tree... Done' + C.r);
      println(C.gry + 'The following NEW package will be installed:' + C.r);
      println('  ' + C.grn + name + C.r + C.gry + '  (' + PACKAGES[name].size + ')  — ' + PACKAGES[name].desc + C.r);
      if (isAddon) println('  ' + C.mag + '★ Termux addon — extends the terminal with new features' + C.r);
      println('');
      await sleep(260);

      if (isAddon) { await progressBar('download addon'); await progressBar('link with termux'); }
      else         { await progressBar('fetch ' + name);   await progressBar('unpack'); }
      await sleep(180);

      state.installed[name] = true;
      println('');
      println(C.grn + C.b + '✔ ' + name + ' installed successfully.' + C.r);

      if (name === 'termux-api')         println(C.gry + 'run "termux-api" to see every termux-api command.' + C.r);
      else if (name === 'termux-styling') println(C.gry + 'run "termux-style" for the interactive style menu.' + C.r);
      else if (name === 'termux-float')   println(C.gry + 'run "termux-float" or "termux-float off" to toggle floating mode.' + C.r);
      else if (name === 'termux-boot')    println(C.gry + 'run "termux-boot" to inspect the boot script directory.' + C.r);
      else if (name === 'termux-tasker')  println(C.gry + 'run "termux-tasker" to configure the Tasker bridge.' + C.r);
      else if (name === 'termux-widget')  println(C.gry + 'run "termux-widget" to manage home-screen scripts.' + C.r);
      else                                println(C.gry + 'run "' + (PACKAGES[name].cmd || name) + '" to use it.' + C.r);
      println('');
      showToast('📦 ' + name + ' installed', 'ok');
      return;
    }

    if (sub === 'remove' || sub === 'rm' || sub === 'uninstall') {
      if (!name || !state.installed[name]) {
        println(C.red + 'E: package "' + (name || '') + '" is not installed' + C.r); return;
      }
      await progressBar('removing ' + name);
      delete state.installed[name];
      if (name === 'termux-float') ROOT.classList.remove('hx-float');
      println(C.grn + '✔ ' + name + ' removed.' + C.r);
      return;

  async function runCommand(line) {
    if (!line) return;
    const parts = tokenize(line);
    if (!parts.length) return;

    const cmd  = parts[0].toLowerCase();
    const args = parts.slice(1);

    switch (cmd) {
      case 'help': case '?':         return cmdHelp();
      case 'about':                  return cmdAbout();
      case 'banner':                 return printBanner();
      case 'clear': case 'cls':      term.clear(); return;
      case 'echo':                   println(args.join(' ')); return;
      case 'date': case 'time':      return cmdDate();
      case 'whoami':                 println(state.user); return;
      case 'uname':                  return cmdUname();
      case 'neofetch':               return cmdNeofetch();
      case 'pwd':                    println('/data/data/com.termux/files/home'); return;
      case 'ls':                     return cmdLs(args);
      case 'cd':                     return cmdCd(args);
      case 'cat':                    return cmdCat(args);
      case 'history':                return cmdHistory();
      case 'ai': case 'ask': case 'hex': return cmdAI(args);
      case 'fetch': case 'curl': case 'wget': case 'get': return cmdFetch(args);
      case 'open': case 'xdg-open':  return cmdOpen(args);
      case 'proxy':                  return cmdProxy(args);
      case 'matrix':                 return cmdMatrix();
      case 'pkg': case 'apt': case 'apt-get': return cmdPkg(args);
      case 'reboot': case 'restart': case 'reset': return cmdReboot();
      case 'exit': case 'logout':    return cmdExit();
      case 'sudo':
        println(C.red + 'hexai is not in the sudoers file. This incident has been reported. 😄' + C.r);
        return;
      case 'termux-style': case 'tstyle':
        if (!state.installed['termux-styling']) {
          println('');
          println(C.red + 'termux-style: command not found' + C.r);
          println(C.gry + 'hint: run ' + C.grn + '"pkg install termux-styling"' + C.gry + ' first.' + C.r);
          println('');
          return;
        }
        return cmdTermuxStyle(args);
      case 'termux-api':
        return cmdTermuxApi(args);
      case 'termux-boot':   return cmdAddonBoot();
      case 'termux-float':  return cmdAddonFloat(!(args[0] && args[0].toLowerCase() === 'off'));
      case 'termux-tasker': return cmdAddonTasker();
      case 'termux-widget': return cmdAddonWidget(args);
    }

    if (cmd.indexOf('termux-') === 0) {
      const sub = cmd.slice(7);
      return cmdTermuxApi([sub].concat(args));
    }

    const gated = {
      python  : ['python', 'python3'],
      figlet  : ['figlet'],
      cowsay  : ['cowsay'],
      fortune : ['fortune'],
      htop    : ['htop', 'top'],
      nmap    : ['nmap'],
      git     : ['git'],
      lolcat  : ['lolcat'],
      sl      : ['sl']
    };
    for (const pkg in gated) {
      if (gated[pkg].indexOf(cmd) === -1) continue;
      if (!state.installed[pkg]) {
        println('');
        println(C.red + '  ' + cmd + ': command not found' + C.r);
        println(C.gry + '  hint: run ' + C.grn + '"pkg install ' + pkg + '"' + C.gry + ' to install it.' + C.r);
        println('');
        return;
      }
      switch (pkg) {
        case 'python':  return cmdPython(args);
        case 'figlet':  return cmdFiglet(args);
        case 'cowsay':  return cmdCowsay(args);
        case 'fortune': return cmdFortune();
        case 'htop':    return cmdHtop();
        case 'nmap':    return cmdNmap(args);
        case 'git':     return cmdGit(args);
        case 'lolcat':  return cmdLolcat(args);
        case 'sl':      return cmdSl();
      }
    }

    println('');
    println(C.red + '  hexsh: ' + cmd + ': command not found' + C.r);
    println(C.gry + '  type ' + C.grn + '"help"' + C.gry + ' for the full command index.' + C.r);
    println('');
  }

  function buildKeyRow() {
    if (!keysEl) return;
    keysEl.innerHTML = '';
    KEYS.forEach((k) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hx-key' + (k.cls ? ' ' + k.cls : '');
      btn.textContent = k.label;
      btn.setAttribute('aria-label', k.label);

      const press = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        if (k.mod === 'ctrl') {
          ctrlArmed = !ctrlArmed;
          if (ctrlArmed) altArmed = false;
          updateModKeys(); term.focus(); return;
        }
        if (k.mod === 'alt') {
          altArmed = !altArmed;
          if (altArmed) ctrlArmed = false;
          updateModKeys(); term.focus(); return;
        }
        handleInput(k.seq);
        term.focus();
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('mousedown', press);
      if (k.mod) modButtons[k.mod] = btn;
      keysEl.appendChild(btn);
    });
  }

  function updateModKeys() {
    if (modButtons.ctrl) modButtons.ctrl.classList.toggle('on', ctrlArmed);
    if (modButtons.alt)  modButtons.alt.classList.toggle('on', altArmed);
  }

  buildKeyRow();

  termEl.addEventListener('touchstart', () => { term.focus(); }, { passive: true });
  termEl.addEventListener('click', () => { term.focus(); });

  /* ------------------------------------------------------------
     28. RESPONSIVE FIT
     ------------------------------------------------------------ */
  function responsiveFont() {
    const w = termEl.clientWidth || ROOT.clientWidth;
    let size = 13;
    if (w < 340)      size = 9.5;
    else if (w < 420) size = 10.5;
    else if (w < 560) size = 11.5;
    else if (w < 760) size = 12.5;
    else              size = 13.5;
    if (term.options.fontSize !== size) term.options.fontSize = size;
  }

  function fitNow() {
    if (!fitAddon) return;
    try { responsiveFont(); fitAddon.fit(); } catch (e) {}
  }

  window.addEventListener('resize', () => setTimeout(fitNow, 80));
  window.addEventListener('orientationchange', () => setTimeout(fitNow, 250));

  if (typeof ResizeObserver !== 'undefined') {
    try {
      const ro = new ResizeObserver(() => setTimeout(fitNow, 60));
      ro.observe(termEl);
    } catch (e) {}
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => setTimeout(fitNow, 120));
  }

  /* ------------------------------------------------------------
     29. START
     ------------------------------------------------------------ */
  (async function start() {
    try {
      const s = localStorage.getItem('hexai.scheme');
      if (s && SCHEMES[s]) { state.scheme = s; term.options.theme = SCHEMES[s].theme; ROOT.style.background = SCHEMES[s].theme.background; }
      const f = localStorage.getItem('hexai.font');
      if (f && FONTS.find((x) => x.id === f)) {
        state.font = f;
        term.options.fontFamily = FONTS.find((x) => x.id === f).css + ', monospace';
      }
    } catch (e) {}

    await sleep(80); fitNow();
    await sleep(60); fitNow();

    await bootSequence(false);

    if (loadingEl) {
      loadingEl.classList.add('hide');
      setTimeout(() => { loadingEl.style.display = 'none'; }, 600);
    }

    printPrompt();
    term.focus();

    /* silently probe the AI endpoint once (fire and forget) */
    setTimeout(() => {
      try {
        fetch(HEX_AI_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: HEX_AI_MODEL,
            messages: [{ role: 'user', content: 'ping' }],
            stream: false,
            max_tokens: 1
          })
        }).then((r) => {
          if (!r.ok) state.aiLive = false;
        }).catch(() => { state.aiLive = false; });
      } catch (e) { state.aiLive = false; }
    }, 1200);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) setTimeout(fitNow, 120);
    });
  })();

})();
</script>
